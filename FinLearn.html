  const submit=async(e)=>{

    if(pw.length<6)return setErr('Password min 6 caratteri.');

  return (

      <div style={{position:'absolute',bottom:'15%',right:'5%',width:220,height:220,borderRadius:'50%',background:'radial-gradient(circle,rgba(139,92,246,.1),transparent 70%)',filter:'blur(60px)',pointerEvents:'none'}}/>

      <div style={{width:'100%',maxWidth:400}} className="anim-scale">
        {/* Header */}
        <div style={{textAlign:'center',marginBottom:32}}>
          <img src={LOGO_B64} style={{width:72,height:72,borderRadius:20,margin:'0 auto 16px',display:'block',boxShadow:'0 20px 48px rgba(15,32,68,.4)'}} alt="FinLearn"/>
          <h1 style={{fontFamily:"'DM Serif Display',Georgia,serif",fontSize:34,color:'#fff',letterSpacing:'.03em'}}>FinLearn</h1>
          <p style={{color:'rgba(52,211,153,.5)',fontSize:12,letterSpacing:'.2em',textTransform:'uppercase',marginTop:6}}>AI-Powered CFA Prep</p>
        </div>

        {/* Card */}
        <div style={{background:'rgba(255,255,255,.97)',borderRadius:24,padding:28,boxShadow:'0 32px 80px rgba(0,0,0,.3)',border:'1px solid rgba(255,255,255,.15)'}}>
          {/* Tabs */}
          <div className="pill-tab" style={{marginBottom:24}}>
            {['login','register'].map(m=>(
              <button key={m} className={`pill-tab-item${mode===m?' active':''}`} onClick={()=>{setMode(m);setErr(null);}}>
                {m==='login'?'Accedi':'Registrati'}
              </button>
            ))}
          </div>

          <form onSubmit={submit} style={{display:'flex',flexDirection:'column',gap:14}}>
            {mode==='register'&&(
              <input className="input" type="text" value={name} onChange={e=>setName(e.target.value)} placeholder="Il tuo nome" autoComplete="name"/>
            )}
            <div style={{position:'relative'}}>
              <span style={{position:'absolute',left:14,top:'50%',transform:'translateY(-50%)',color:'#94a3b8',pointerEvents:'none'}}><IMail size={16}/></span>
              <input className="input" style={{paddingLeft:42}} type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="Email" autoComplete="email"/>
            </div>
            <div style={{position:'relative'}}>
              <span style={{position:'absolute',left:14,top:'50%',transform:'translateY(-50%)',color:'#94a3b8',pointerEvents:'none'}}><ILock size={16}/></span>
              <input className="input" style={{paddingLeft:42,paddingRight:44}} type={show?'text':'password'} value={pw} onChange={e=>setPw(e.target.value)} placeholder="Password"/>
              <button type="button" onClick={()=>setShow(!show)} style={{position:'absolute',right:14,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',color:'#94a3b8',cursor:'pointer',padding:4}}>
                {show?<IEyeOff size={16}/>:<IEye size={16}/>}
              </button>
            </div>
            {mode==='register'&&(
              <input className="input" type="password" value={pw2} onChange={e=>setPw2(e.target.value)} placeholder="Conferma password"/>
            )}
            {err&&(
              <div style={{display:'flex',alignItems:'center',gap:8,padding:'10px 14px',background:'#fef2f2',border:'1px solid #fecaca',borderRadius:10,color:'#dc2626',fontSize:13}}>
                <IAlert size={15}/>{err}
              </div>
            )}
            <button type="submit" disabled={loading} className="btn-primary" style={{padding:'14px 0',borderRadius:12,fontSize:15,marginTop:4}}>
              {loading?<span style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8}}><span style={{width:16,height:16,border:'2px solid rgba(255,255,255,.4)',borderTopColor:'#fff',borderRadius:'50%',display:'inline-block',animation:'spin .7s linear infinite'}}/> Caricamento…</span>
               :mode==='login'?'Accedi →':'Crea account →'}
            </button>
          </form>
        </div>
      </div>
    </div>
  );
}

// ─── CALCULATOR ───────────────────────────────────────────────────────────────
function Calculator({onClose}) {
  const [display,setDisplay]=useState('0');
  const [sub,setSub]=useState('');
  const [input,setInput]=useState('');
  const [pendingOp,setPendingOp]=useState(null);
  const [first,setFirst]=useState(null);
  const [tvm,setTvm]=useState({N:0,IY:0,PV:0,PMT:0,FV:0});
  const [cptMode,setCptMode]=useState(false);
  const [sec,setSec]=useState(false);
  const [cashFlows,setCashFlows]=useState([{value:0,freq:1}]);
  const [cfMode,setCfMode]=useState(false);
  const [cfIdx,setCfIdx]=useState(0);

  const fmt=(n,d=6)=>{if(n===undefined||isNaN(n)||!isFinite(n))return'Error';if(Math.abs(n)<1e-9&&n!==0)return n.toExponential(4);if(Math.abs(n)>=1e10)return n.toExponential(4);return parseFloat(n.toFixed(d)).toLocaleString('en-US',{maximumFractionDigits:d});};
  const raw=(n,d=6)=>{if(n===undefined||isNaN(n))return'0';return parseFloat(n.toFixed(d)).toString();};
  const cur=()=>parseFloat((input||display).replace(/,/g,''))||0;

  const pressNum=(n)=>{const ni=input===''||input==='0'?String(n):input+n;setInput(ni);setDisplay(ni);};
  const pressDecimal=()=>{if(input.includes('.'))return;const ni=input===''?'0.':input+'.';setInput(ni);setDisplay(ni);};
  const pressClear=()=>{if(input!==''){setInput('');setDisplay('0');}else{setDisplay('0');setSub('');setPendingOp(null);setFirst(null);}};
  const pressOp=(op)=>{setFirst(cur());setPendingOp(op);setSub(op);setInput('');};
  const pressEq=()=>{if(!pendingOp||first===null)return;const b=cur();let r;switch(pendingOp){case'+':r=first+b;break;case'−':r=first-b;break;case'×':r=first*b;break;case'÷':r=b!==0?first/b:NaN;break;default:r=b;}setDisplay(fmt(r));setFirst(null);setPendingOp(null);setInput('');setSub('');};

  const pressTVM=(key)=>{
    if(cptMode){
      const{N,IY,PV,PMT,FV}=tvm;
      const i=IY/100/12;let result;
      try{
        if(key==='FV'){result=i===0?-PV-PMT*N:-(PV*Math.pow(1+i,N)+PMT*(Math.pow(1+i,N)-1)/i);}
        else if(key==='PV'){result=i===0?-FV-PMT*N:-FV/Math.pow(1+i,N)-PMT*(1-Math.pow(1+i,-N))/i;}
        else if(key==='PMT'){result=i===0?N!==0?-(PV+FV)/N:0:-(PV+FV/Math.pow(1+i,N))*i/(1-Math.pow(1+i,-N));}
        else if(key==='N'){result=i===0?-(PV+FV)/(PMT||1):Math.log((PMT-FV*i)/(PMT+PV*i))/Math.log(1+i);}
        if(isNaN(result)||!isFinite(result)){setDisplay('Error');setSub('No solution');}
        else{setTvm(t=>({...t,[key]:result}));setDisplay(fmt(result,2));setSub(`${key} = ${fmt(result,2)}`);}
      }catch{setDisplay('Error');}
      setCptMode(false);setInput('');return;
    }
    if(sec){
      if(key==='FV'){setTvm({N:0,IY:0,PV:0,PMT:0,FV:0});setSub('CLR TVM');}
      setSec(false);return;
    }
    const val=cur();setTvm(t=>({...t,[key]:val}));setSub(`${key}=${fmt(val,2)}`);setInput('');
  };

  const pressNPV=()=>{
    const rate=tvm.IY/100;let npv=0,t=0;
    for(const cf of cashFlows){for(let j=0;j<(cf.freq||1);j++){npv+=(cf.value||0)/Math.pow(1+rate,t);t++;}}
    setDisplay(fmt(npv,2));setSub(`NPV @ ${tvm.IY}%`);setCfMode(false);
  };

  const CalcBtn=({label,sub:s,onClick,type='num'})=>{
    const colors={num:{bg:'#3f3f46',text:'#fff'},op:{bg:'#27272a',text:'#e4e4e7'},tvm:{bg:'#065f46',text:'#fff'},func:{bg:'#1c1c1e',text:'#a1a1aa'},second:{bg:'#d97706',text:'#fff'}};
    const c=colors[type]||colors.num;
    return(
      <button onClick={onClick} className="calc-btn" style={{background:c.bg,color:c.text,fontSize:type==='tvm'?11:13,position:'relative'}}>
        {s&&<span style={{position:'absolute',top:-9,fontSize:7,color:'#f59e0b',fontWeight:600,letterSpacing:'.02em'}}>{s}</span>}
        {label}
      </button>
    );
  };

  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.75)',backdropFilter:'blur(8px)',zIndex:200,display:'flex',alignItems:'center',justifyContent:'center',padding:16}} onClick={onClose}>
      <div style={{background:'#18181b',borderRadius:24,width:'100%',maxWidth:360,boxShadow:'0 32px 80px rgba(0,0,0,.5)',border:'1px solid rgba(255,255,255,.08)',overflow:'hidden'}} onClick={e=>e.stopPropagation()}>
        {/* Header */}
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'14px 16px',borderBottom:'1px solid rgba(255,255,255,.06)'}}>
          <span style={{color:'#f59e0b',fontSize:10,fontWeight:800,letterSpacing:'.18em'}}>FINLEARN CALC</span>
          <button onClick={onClose} style={{width:28,height:28,borderRadius:'50%',background:'rgba(255,255,255,.08)',border:'none',color:'#71717a',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}><IX size={14}/></button>
        </div>
        {/* LCD */}
        <div style={{background:'#0a1a0f',margin:'12px 14px 0',borderRadius:14,padding:'12px 14px',border:'1px solid rgba(52,211,153,.1)'}}>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:8,color:'rgba(52,211,153,.5)',height:14}}>
            <div style={{display:'flex',gap:6}}>{sec&&<span>2ND</span>}{cptMode&&<span>CPT</span>}{cfMode&&<span>CF</span>}</div>
          </div>
          <div style={{color:'rgba(52,211,153,.5)',fontSize:10,textAlign:'right',height:14,fontFamily:'monospace'}}>{sub}</div>
          <div style={{color:'#4ade80',fontSize:32,fontFamily:'monospace',textAlign:'right',letterSpacing:'.04em',textShadow:'0 0 20px rgba(74,222,128,.4)'}}>{display}</div>
          <div style={{display:'flex',justifyContent:'space-between',marginTop:8,paddingTop:8,borderTop:'1px solid rgba(52,211,153,.1)',fontSize:7,fontFamily:'monospace',color:'#166534',gap:4}}>
            {Object.entries(tvm).map(([k,v])=><span key={k} style={{color:v?'#22c55e':'#166534'}}>{k}:{raw(v,0)}</span>)}
          </div>
        </div>
        {/* Keys */}
        <div style={{padding:'12px 14px 16px',display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:6}}>
          <CalcBtn label="N" s="×P/Y" onClick={()=>pressTVM('N')} type="tvm"/>
          <CalcBtn label="I/Y" onClick={()=>pressTVM('IY')} type="tvm"/>
          <CalcBtn label="PV" onClick={()=>pressTVM('PV')} type="tvm"/>
          <CalcBtn label="PMT" onClick={()=>pressTVM('PMT')} type="tvm"/>
          <CalcBtn label="FV" s="CLR" onClick={()=>pressTVM('FV')} type="tvm"/>
          <CalcBtn label="CF" onClick={()=>{setCfMode(true);setSub('CF0');}} type="func"/>
          <CalcBtn label="NPV" onClick={pressNPV} type="func"/>
          <CalcBtn label="IRR" onClick={()=>setSub('IRR N/A')} type="func"/>
          <CalcBtn label="%" onClick={()=>{setDisplay(fmt(cur()/100));setInput('');}} type="func"/>
          <CalcBtn label="√x" onClick={()=>{const v=cur();setDisplay(v<0?'Error':fmt(Math.sqrt(v)));setInput('');}} type="func"/>
          <CalcBtn label="2nd" onClick={()=>{setSec(!sec);setSub(sec?'':'2nd');}} type="second"/>
          <CalcBtn label="CPT" onClick={()=>{setCptMode(true);setSub('CPT');}} type="second"/>
          <CalcBtn label="DEL" onClick={()=>{const ni=input.slice(0,-1);setInput(ni);setDisplay(ni||'0');}} type="func"/>
          <CalcBtn label="CE" onClick={pressClear} type="func"/>
          <CalcBtn label="÷" onClick={()=>pressOp('÷')} type="op"/>
          <CalcBtn label="7" onClick={()=>pressNum(7)}/><CalcBtn label="8" onClick={()=>pressNum(8)}/><CalcBtn label="9" onClick={()=>pressNum(9)}/>
          <CalcBtn label="×" onClick={()=>pressOp('×')} type="op"/>
          <CalcBtn label="yˣ" onClick={()=>{setFirst(cur());setPendingOp('yˣ');setInput('');}} type="func"/>
          <CalcBtn label="4" onClick={()=>pressNum(4)}/><CalcBtn label="5" onClick={()=>pressNum(5)}/><CalcBtn label="6" onClick={()=>pressNum(6)}/>
          <CalcBtn label="−" onClick={()=>pressOp('−')} type="op"/>
          <CalcBtn label="1/x" onClick={()=>{const v=cur();setDisplay(v===0?'Error':fmt(1/v));setInput('');}} type="func"/>
          <CalcBtn label="1" onClick={()=>pressNum(1)}/><CalcBtn label="2" onClick={()=>pressNum(2)}/><CalcBtn label="3" onClick={()=>pressNum(3)}/>
          <CalcBtn label="+" onClick={()=>pressOp('+')} type="op"/>
          <CalcBtn label="=" onClick={pressEq} type="op"/>
          <CalcBtn label="0" onClick={()=>pressNum(0)}/><CalcBtn label="." onClick={pressDecimal}/>
          <CalcBtn label="+/−" onClick={()=>{if(input.startsWith('-'))setInput(input.slice(1));else if(input&&input!=='0')setInput('-'+input);setDisplay(input.startsWith('-')?input.slice(1):'-'+input);}} type="func"/>
        </div>
      </div>
    </div>
  );
}

// ─── AI CHAT PANEL ────────────────────────────────────────────────────────────
function ChatPanel({user,chats,setChats,activeChatId,setActiveChatId}) {
  const [msg,setMsg]=useState('');
  const [loading,setLoading]=useState(false);
  const [showHistory,setShowHistory]=useState(false);
  const endRef=useRef(null);

  const current=chats.find(c=>c.id===activeChatId);
  const messages=current?.messages||[];

  useEffect(()=>{endRef.current?.scrollIntoView({behavior:'smooth'});},[messages,loading]);

  const SYSTEM=`Sei il Bull Coach 🐂, tutor AI esperto per CFA prep e finanza. Rispondi SEMPRE in italiano (termini tecnici in inglese ok). Sii conciso ma preciso. Usa emoji: 📊📈💡🎯⚡. Se l'utente fa quiz, guida senza dare risposta diretta. Copri: Fixed Income, Equity, Derivatives, Portfolio Mgmt, Ethics, FRA, Quant Methods.`;

  const callAI=async(userMsg,history)=>{
    const msgs=[];
    for(const m of history.slice(-8))msgs.push({role:m.role,content:m.content});
    if(msgs.length>0&&msgs[0].role==='user')msgs[0]={role:'user',content:SYSTEM+'\n\n---\n\n'+msgs[0].content};
    else msgs.unshift({role:'user',content:SYSTEM+'\n\nPresentati brevemente.'},{role:'assistant',content:'🐂 Ciao! Sono il Bull Coach, il tuo tutor CFA. Cosa vuoi studiare?'});
    msgs.push({role:'user',content:userMsg});
    try{
      const r=await window.claude.complete({messages:msgs.slice(-10)});
      return r||fallback(userMsg);
    }catch{return fallback(userMsg);}
  };

  const fallback=(t)=>{
    const l=t.toLowerCase();
    if(l.includes('duration'))return"📊 **Duration** misura la sensibilità al tasso:\n\n• **MacD** = tempo medio ponderato dei CF\n• **ModD** = MacD / (1+y/m) → variazione % per 1% Δy\n• **EffD** = per bond con opzioni embedded\n\n💡 ModD=7 → yield +1% ≈ price -7%";
    if(l.includes('ytm')||l.includes('yield'))return"📈 **YTM** = IRR del bond!\n\nTasso che eguaglia PV di tutti i CF al prezzo.\n• **BEY** = 2 × semi YTM\n• **EAY** = (1+semi YTM)² - 1\n\n⚡ Premium bond: Coupon maggiore CY maggiore YTM\n⚡ Discount bond: Coupon minore CY minore YTM";
    if(l.includes('ciao')||l.includes('hello'))return`🐂 Ciao${user?.displayName?' '+user.displayName:''}! Pronto a dominare il CFA?\n\nChiedimi di:\n📊 Fixed Income &amp; Duration\n📈 Equity &amp; Valuation\n⚡ Derivatives &amp; Greeks\n📐 Quant Methods\n\nCosa vuoi affrontare?`;
    return"🐂 Ottima domanda! Posso aiutarti con:\n\n📊 Bond valuation, duration, spreads\n📈 Equity, P/E, DDM, FCF\n⚡ Options, futures, swaps\n📐 NPV, IRR, CAPM\n\nDimmi cosa vuoi approfondire! 💪";
  };

  const newChat=()=>{
    const c={id:`c_${Date.now()}`,title:'Nuova chat',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),messages:[{role:'assistant',content:`🐂 Ciao${user?.displayName?' '+user.displayName:''}! Sono il Bull Coach, il tuo tutor AI per il CFA.\n\nChiedimi qualsiasi cosa su:\n📊 Fixed Income &amp; Bonds\n📈 Equity Analysis\n⚡ Derivatives\n📐 Quant Methods`,timestamp:new Date().toISOString()}]};
    setChats(p=>[c,...p].slice(0,50));setActiveChatId(c.id);setShowHistory(false);
  };

  const send=async()=>{
    if(!msg.trim()||loading)return;
    const text=msg.trim();
    let chatId=activeChatId;
    if(!chatId){const c={id:`c_${Date.now()}`,title:text.slice(0,40),createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),messages:[]};chatId=c.id;setChats(p=>[c,...p].slice(0,50));setActiveChatId(c.id);}
    const um={role:'user',content:text,timestamp:new Date().toISOString()};
    setChats(p=>p.map(c=>c.id===chatId?{...c,title:c.messages.filter(x=>x.role==='user').length===0?text.slice(0,40):c.title,messages:[...c.messages,um],updatedAt:new Date().toISOString()}:c));
    setMsg('');setLoading(true);
    try{
      const cur=chats.find(c=>c.id===chatId)?.messages||[];
      const reply=await callAI(text,cur);
      setChats(p=>p.map(c=>c.id===chatId?{...c,messages:[...c.messages,{role:'assistant',content:reply,timestamp:new Date().toISOString()}],updatedAt:new Date().toISOString()}:c));
    }catch{
      setChats(p=>p.map(c=>c.id===chatId?{...c,messages:[...c.messages,{role:'assistant',content:'⚠️ Errore. Riprova!',timestamp:new Date().toISOString()}],updatedAt:new Date().toISOString()}:c));
    }
    setLoading(false);
  };

  const fmtMsg=(text)=>text.split('\n').map((line,i)=>{
    const fmt=line.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code style="background:#e2e8f0;padding:1px 5px;border-radius:4px;font-size:.9em">$1</code>');
    if(line.startsWith('• ')||line.startsWith('- '))return<div key={i} style={{display:'flex',gap:8,marginTop:2}}><span style={{color:'var(--em)',flexShrink:0}}>•</span><span dangerouslySetInnerHTML={{__html:fmt.slice(2)}}/></div>;
    return<div key={i} style={{marginTop:i>0?2:0}} dangerouslySetInnerHTML={{__html:fmt}}/>;
  });

  const suggestions=['📊 Cos\'è la Duration?','📈 Come calcolo YTM?','⚡ Differenza Call vs Put','📐 Spiegami il CAPM'];

  return(
    <div style={{display:'flex',flexDirection:'column',height:'100%',background:'#fafafa'}}>
      {/* Header */}
      <div style={{background:'rgba(255,255,255,.95)',backdropFilter:'blur(16px)',borderBottom:'1px solid var(--border)',padding:'12px 16px',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <div style={{width:44,height:44,borderRadius:14,background:'linear-gradient(135deg,#f59e0b,#ea580c)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:22,boxShadow:'0 4px 12px rgba(245,158,11,.3)'}}>🐂</div>
          <div>
            <div style={{fontWeight:700,fontSize:15,color:'var(--ink)'}}>Bull Coach AI</div>
            <div style={{fontSize:11,color:'var(--ink-4)',display:'flex',alignItems:'center',gap:4}}><ISpark size={10} style={{color:'#f59e0b'}}/> Powered by Claude</div>
          </div>
        </div>
        <div style={{display:'flex',gap:8}}>
          <button onClick={()=>setShowHistory(true)} style={{position:'relative',width:38,height:38,borderRadius:12,background:'#f1f5f9',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--ink-3)'}}>
            <IClock size={17}/>
            {chats.length>0&&<span style={{position:'absolute',top:-3,right:-3,width:16,height:16,background:'#f59e0b',color:'#fff',fontSize:9,fontWeight:700,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center'}}>{chats.length}</span>}
          </button>
          <button onClick={newChat} style={{width:38,height:38,borderRadius:12,background:'#fef3c7',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:'#d97706'}}><IPlus size={17}/></button>
        </div>
      </div>

      {/* Messages */}
      {!activeChatId&&chats.length===0?(
        <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:24,gap:20}}>
          <div style={{width:80,height:80,borderRadius:24,background:'linear-gradient(135deg,#f59e0b,#ea580c)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:40,boxShadow:'0 16px 48px rgba(245,158,11,.3)'}}>🐂</div>
          <div style={{textAlign:'center'}}>
            <div style={{fontSize:20,fontWeight:800,color:'var(--ink)'}}>Bull Coach AI</div>
            <div style={{fontSize:13,color:'var(--ink-3)',marginTop:4}}>Il tuo tutor CFA personale</div>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,width:'100%',maxWidth:320}}>
            {suggestions.map((s,i)=>(
              <button key={i} onClick={()=>{setMsg(s.slice(2));}}
                style={{padding:'12px 14px',background:'#fff',border:'1.5px solid var(--border)',borderRadius:14,fontSize:12,color:'var(--ink-2)',cursor:'pointer',textAlign:'left',fontWeight:500,fontFamily:'inherit',transition:'all .18s'}}
                onMouseEnter={e=>{e.currentTarget.style.borderColor='var(--am)';e.currentTarget.style.background='#fffbeb';}}
                onMouseLeave={e=>{e.currentTarget.style.borderColor='var(--border)';e.currentTarget.style.background='#fff';}}>
                {s}
              </button>
            ))}
          </div>
        </div>
      ):(
        <div style={{flex:1,overflowY:'auto',WebkitOverflowScrolling:'touch',padding:'16px 16px 8px'}}>
          <div style={{maxWidth:560,margin:'0 auto',display:'flex',flexDirection:'column',gap:12}}>
            {messages.map((m,i)=>(
              <div key={i} style={{display:'flex',justifyContent:m.role==='user'?'flex-end':'flex-start'}}>
                {m.role==='assistant'&&<div style={{width:28,height:28,borderRadius:9,background:'linear-gradient(135deg,#f59e0b,#ea580c)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,marginRight:8,flexShrink:0,marginTop:4}}>🐂</div>}
                <div className={m.role==='user'?'bubble-user':'bubble-ai'} style={{maxWidth:'82%',padding:'11px 15px',fontSize:13.5,lineHeight:1.65,color:m.role==='user'?'#fff':'var(--ink-2)'}}>
                  <div style={{display:'flex',flexDirection:'column',gap:1}}>{fmtMsg(m.content)}</div>
                </div>
              </div>
            ))}
            {loading&&(
              <div style={{display:'flex',justifyContent:'flex-start'}}>
                <div style={{width:28,height:28,borderRadius:9,background:'linear-gradient(135deg,#f59e0b,#ea580c)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,marginRight:8,flexShrink:0}}>🐂</div>
                <div className="bubble-ai" style={{padding:'14px 16px'}}>
                  <div style={{display:'flex',gap:5}}>
                    {[0,.15,.3].map((d,i)=><div key={i} style={{width:7,height:7,background:'#94a3b8',borderRadius:'50%',animation:'bounce-dot 1.2s infinite',animationDelay:`${d}s`}}/>)}
                  </div>
                </div>
              </div>
            )}
            <div ref={endRef}/>
          </div>
        </div>
      )}

      {/* Input */}
      <div style={{background:'rgba(255,255,255,.95)',backdropFilter:'blur(16px)',borderTop:'1px solid var(--border)',padding:'12px 16px',flexShrink:0}}>
        <div style={{maxWidth:560,margin:'0 auto',display:'flex',gap:10,alignItems:'center'}}>
          <input value={msg} onChange={e=>setMsg(e.target.value)} onKeyDown={e=>e.key==='Enter'&&!e.shiftKey&&send()}
            placeholder="Chiedimi di bonds, equity, derivati…" disabled={loading}
            style={{flex:1,padding:'12px 16px',background:'#f1f5f9',border:'1.5px solid transparent',borderRadius:14,outline:'none',fontSize:14,fontFamily:'inherit',color:'var(--ink)',transition:'all .18s'}}
            onFocus={e=>{e.target.style.background='#fff';e.target.style.border='1.5px solid var(--em)';e.target.style.boxShadow='0 0 0 3px rgba(5,150,105,.1)';}}
            onBlur={e=>{e.target.style.background='#f1f5f9';e.target.style.border='1.5px solid transparent';e.target.style.boxShadow='none';}}
          />
          <button onClick={send} disabled={!msg.trim()||loading}
            style={{width:46,height:46,borderRadius:14,background:msg.trim()&&!loading?'linear-gradient(135deg,#f59e0b,#ea580c)':'#f1f5f9',border:'none',cursor:msg.trim()&&!loading?'pointer':'default',display:'flex',alignItems:'center',justifyContent:'center',color:msg.trim()&&!loading?'#fff':'#cbd5e1',transition:'all .2s',flexShrink:0}}>
            <ISend size={17}/>
          </button>
        </div>
      </div>

      {/* History drawer */}
      {showHistory&&(
        <div style={{position:'absolute',inset:0,zIndex:50,display:'flex'}} className="anim-in">
          <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,.35)',backdropFilter:'blur(4px)'}} onClick={()=>setShowHistory(false)}/>
          <div style={{position:'relative',marginLeft:'auto',width:300,background:'#fff',height:'100%',display:'flex',flexDirection:'column',boxShadow:'-16px 0 48px rgba(0,0,0,.12)'}}>
            <div style={{padding:'16px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <div>
                <div style={{fontWeight:700,fontSize:15,color:'var(--ink)'}}>Cronologia</div>
                <div style={{fontSize:11,color:'var(--ink-4)',marginTop:2}}>{chats.length} conversazioni</div>
              </div>
              <button onClick={()=>setShowHistory(false)} style={{width:32,height:32,borderRadius:10,background:'#f1f5f9',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--ink-3)'}}><IX size={15}/></button>
            </div>
            <div style={{flex:1,overflowY:'auto',padding:'10px 10px'}}>
              {chats.length===0?<div style={{textAlign:'center',padding:40,color:'var(--ink-4)'}}><IChat size={28} style={{margin:'0 auto 8px',display:'block'}}/><div style={{fontSize:13}}>Nessuna chat</div></div>
              :chats.map(c=>(
                <div key={c.id} onClick={()=>{setActiveChatId(c.id);setShowHistory(false);}}
                  style={{padding:'12px 12px',borderRadius:12,cursor:'pointer',marginBottom:4,background:c.id===activeChatId?'#ecfdf5':'transparent',border:`1.5px solid ${c.id===activeChatId?'#a7f3d0':'transparent'}`,transition:'all .15s',display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}
                  onMouseEnter={e=>{if(c.id!==activeChatId)e.currentTarget.style.background='#f8fafc';}}
                  onMouseLeave={e=>{if(c.id!==activeChatId)e.currentTarget.style.background='transparent';}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:600,fontSize:13,color:'var(--ink)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{c.title||'Chat'}</div>
                    <div style={{fontSize:11,color:'var(--ink-4)',marginTop:2}}>{new Date(c.updatedAt).toLocaleDateString('it')} · {c.messages?.length||0} msg</div>
                  </div>
                  <button onClick={e=>{e.stopPropagation();setChats(p=>p.filter(x=>x.id!==c.id));if(activeChatId===c.id)setActiveChatId(null);}}
                    style={{width:24,height:24,borderRadius:8,background:'transparent',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:'#fca5a5',opacity:0,transition:'opacity .15s',flexShrink:0}}
                    onMouseEnter={e=>e.currentTarget.style.opacity='1'} onMouseLeave={e=>e.currentTarget.style.opacity='0'}>
                    <ITrash size={12}/>
                  </button>
                </div>
              ))}
            </div>
            <div style={{padding:'12px'}}>
              <button onClick={newChat} style={{width:'100%',padding:'12px',borderRadius:14,background:'linear-gradient(135deg,#f59e0b,#ea580c)',color:'#fff',border:'none',fontWeight:700,fontSize:14,cursor:'pointer',fontFamily:'inherit'}}>+ Nuova Chat</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}
