<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --em: #059669; --em-d: #065f46; --em-l: #d1fae5; --em-2: #34d399;
    --am: #f59e0b; --am-d: #d97706; --am-l: #fef3c7;
    --ink: #0f172a; --ink-2: #334155; --ink-3: #64748b; --ink-4: #94a3b8;
    --bg: #f1f5f9; --card: #ffffff; --border: rgba(15,23,42,.07);
    --shadow-sm: 0 1px 3px rgba(15,23,42,.08), 0 1px 2px rgba(15,23,42,.04);
    --shadow: 0 4px 16px rgba(15,23,42,.08), 0 1px 4px rgba(15,23,42,.04);
    --shadow-lg: 0 16px 48px rgba(15,23,42,.12), 0 4px 12px rgba(15,23,42,.06);
    --r: 16px; --r-sm: 10px; --r-lg: 24px;
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body { background: var(--bg); overflow: hidden; height: 100vh; }
  #root { height: 100vh; display: flex; flex-direction: column; }

  /* Typography */
  .serif { font-family: 'DM Serif Display', Georgia, serif; }

  /* Scrollbars */
  ::-webkit-scrollbar { width: 0; height: 0; }

  /* Animations */
  @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes scaleIn { from { opacity:0; transform:scale(.96); } to { opacity:1; transform:scale(1); } }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes pulse-glow { 0%,100% { box-shadow:0 0 0 0 rgba(5,150,105,.4); } 50% { box-shadow:0 0 0 12px rgba(5,150,105,0); } }
  @keyframes bounce-dot { 0%,80%,100% { transform:translateY(0); } 40% { transform:translateY(-6px); } }

  .anim-up { animation: fadeUp .4s cubic-bezier(.22,.68,0,1.2) both; }
  .anim-in { animation: fadeIn .3s ease both; }
  .anim-scale { animation: scaleIn .3s cubic-bezier(.22,.68,0,1.2) both; }

  /* Cards */
  .card { background:var(--card); border-radius:var(--r); box-shadow:var(--shadow); border:1px solid var(--border); }
  .card-sm { background:var(--card); border-radius:var(--r-sm); box-shadow:var(--shadow-sm); border:1px solid var(--border); }

  /* Buttons */
  .btn-primary { background:linear-gradient(135deg,#059669,#0d9488); color:#fff; border:none; font-weight:700; cursor:pointer; transition:all .18s; }
  .btn-primary:hover { filter:brightness(1.08); transform:translateY(-1px); box-shadow:0 8px 24px rgba(5,150,105,.35); }
  .btn-primary:active { transform:translateY(0); filter:brightness(.97); }
  .btn-ghost { background:transparent; border:1.5px solid var(--border); color:var(--ink-2); font-weight:600; cursor:pointer; transition:all .18s; }
  .btn-ghost:hover { background:var(--bg); border-color:var(--em); color:var(--em); }

  /* Badge */
  .badge { display:inline-flex; align-items:center; padding:3px 10px; border-radius:99px; font-size:11px; font-weight:700; letter-spacing:.02em; }

  /* Bottom nav */
  .bottom-nav { background:rgba(255,255,255,.92); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-top:1px solid var(--border); }

  /* Input */
  .input { width:100%; padding:13px 16px; background:#f8fafc; border:1.5px solid #e2e8f0; border-radius:12px; font-size:15px; font-family:inherit; color:var(--ink); transition:all .18s; outline:none; }
  .input:focus { border-color:var(--em); background:#fff; box-shadow:0 0 0 3px rgba(5,150,105,.1); }
  .input::placeholder { color:var(--ink-4); }

  /* Pill tab */
  .pill-tab { display:flex; background:#f1f5f9; border-radius:12px; padding:4px; gap:4px; }
  .pill-tab-item { flex:1; padding:9px 12px; border-radius:9px; border:none; background:transparent; font-family:inherit; font-size:13px; font-weight:600; color:var(--ink-3); cursor:pointer; transition:all .2s; }
  .pill-tab-item.active { background:#fff; color:var(--em); box-shadow:0 2px 8px rgba(15,23,42,.08); }

  /* XP ring */
  .xp-ring { transform:rotate(-90deg); }

  /* Lesson card hover */
  .lesson-card { transition:transform .2s, box-shadow .2s; }
  .lesson-card:hover { transform:translateY(-2px); box-shadow:var(--shadow-lg); }

  /* Option button */
  .option-btn { width:100%; border:1.5px solid #e2e8f0; border-radius:14px; background:#fff; text-align:left; cursor:pointer; transition:all .18s; }
  .option-btn:hover:not(:disabled) { border-color:var(--em); background:#f0fdf8; }
  .option-btn.selected { border-color:var(--em); background:#f0fdf8; }
  .option-btn.correct { border-color:#059669; background:#ecfdf5; }
  .option-btn.wrong { border-color:#ef4444; background:#fef2f2; }
  .option-btn.dimmed { border-color:#f1f5f9; background:#fafafa; opacity:.45; }

  /* Flashcard flip */
  .flip-card { perspective:1000px; }
  .flip-inner { transition:transform .45s cubic-bezier(.4,0,.2,1); transform-style:preserve-3d; }
  .flip-inner.flipped { transform:rotateY(180deg); }
  .flip-front, .flip-back { backface-visibility:hidden; -webkit-backface-visibility:hidden; }
  .flip-back { transform:rotateY(180deg); }

  /* Deep dive iframe */
  .deep-iframe { border:none; width:100%; height:100%; display:block; }

  /* Chat bubble */
  .bubble-ai { background:#f1f5f9; border-radius:4px 18px 18px 18px; }
  .bubble-user { background:linear-gradient(135deg,#059669,#0d9488); border-radius:18px 4px 18px 18px; color:#fff; }

  /* Streak flame */
  @keyframes flicker { 0%,100%{transform:scaleY(1) scaleX(1);} 25%{transform:scaleY(1.04) scaleX(.98);} 75%{transform:scaleY(.97) scaleX(1.02);} }
  .flame { animation:flicker 1.8s ease-in-out infinite; display:inline-block; }

  /* Calculator */
  .calc-btn { display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:10px; font-weight:700; transition:all .12s; cursor:pointer; border:none; user-select:none; height:40px; font-family:inherit; }
  .calc-btn:active { transform:scale(.93); }
</style>

,border:'none',color:'#94a3b8',cursor:'pointer',padding:4}}>\n                {show?<IEyeOff size={16}/>:<IEye size={16}/>}\n              </button>\n            </div>\n            {mode==='register'&&(\n              <input className=\"input\" type=\"password\" value={pw2} onChange={e=>setPw2(e.target.value)} placeholder=\"Conferma password\"/>\n            )}\n            {err&&(\n              <div style={{display:'flex',alignItems:'center',gap:8,padding:'10px 14px',background:'#fef2f2',border:'1px solid #fecaca',borderRadius:10,color:'#dc2626',fontSize:13}}>\n                <IAlert size={15}/>{err}\n              </div>\n            )}\n            <button type=\"submit\" disabled={loading} className=\"btn-primary\" style={{padding:'14px 0',borderRadius:12,fontSize:15,marginTop:4}}>\n              {loading?<span style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8}}><span style={{width:16,height:16,border:'2px solid rgba(255,255,255,.4)',borderTopColor:'#fff',borderRadius:'50%',display:'inline-block',animation:'spin .7s linear infinite'}}/> Caricamento…</span>\n               :mode==='login'?'Accedi →':'Crea account →'}\n            </button>\n          </form>\n        </div>\n      </div>\n    </div>\n  );\n}\n\n// ─── CALCULATOR ───────────────────────────────────────────────────────────────\nfunction Calculator({onClose}) {\n  const [display,setDisplay]=useState('0');\n  const [sub,setSub]=useState('');\n  const [input,setInput]=useState('');\n  const [pendingOp,setPendingOp]=useState(null);\n  const [first,setFirst]=useState(null);\n  const [tvm,setTvm]=useState({N:0,IY:0,PV:0,PMT:0,FV:0});\n  const [cptMode,setCptMode]=useState(false);\n  const [sec,setSec]=useState(false);\n  const [cashFlows,setCashFlows]=useState([{value:0,freq:1}]);\n  const [cfMode,setCfMode]=useState(false);\n  const [cfIdx,setCfIdx]=useState(0);\n\n  const fmt=(n,d=6)=>{if(n===undefined||isNaN(n)||!isFinite(n))return'Error';if(Math.abs(n)<1e-9&&n!==0)return n.toExponential(4);if(Math.abs(n)>=1e10)return n.toExponential(4);return parseFloat(n.toFixed(d)).toLocaleString('en-US',{maximumFractionDigits:d});};\n  const raw=(n,d=6)=>{if(n===undefined||isNaN(n))return'0';return parseFloat(n.toFixed(d)).toString();};\n  const cur=()=>parseFloat((input||display).replace(/,/g,''))||0;\n\n  const pressNum=(n)=>{const ni=input===''||input==='0'?String(n):input+n;setInput(ni);setDisplay(ni);};\n  const pressDecimal=()=>{if(input.includes('.'))return;const ni=input===''?'0.':input+'.';setInput(ni);setDisplay(ni);};\n  const pressClear=()=>{if(input!==''){setInput('');setDisplay('0');}else{setDisplay('0');setSub('');setPendingOp(null);setFirst(null);}};\n  const pressOp=(op)=>{setFirst(cur());setPendingOp(op);setSub(op);setInput('');};\n  const pressEq=()=>{if(!pendingOp||first===null)return;const b=cur();let r;switch(pendingOp){case'+':r=first+b;break;case'−':r=first-b;break;case'×':r=first*b;break;case'÷':r=b!==0?first/b:NaN;break;default:r=b;}setDisplay(fmt(r));setFirst(null);setPendingOp(null);setInput('');setSub('');};\n\n  const pressTVM=(key)=>{\n    if(cptMode){\n      const{N,IY,PV,PMT,FV}=tvm;\n      const i=IY/100/12;let result;\n      try{\n        if(key==='FV'){result=i===0?-PV-PMT*N:-(PV*Math.pow(1+i,N)+PMT*(Math.pow(1+i,N)-1)/i);}\n        else if(key==='PV'){result=i===0?-FV-PMT*N:-FV/Math.pow(1+i,N)-PMT*(1-Math.pow(1+i,-N))/i;}\n        else if(key==='PMT'){result=i===0?N!==0?-(PV+FV)/N:0:-(PV+FV/Math.pow(1+i,N))*i/(1-Math.pow(1+i,-N));}\n        else if(key==='N'){result=i===0?-(PV+FV)/(PMT||1):Math.log((PMT-FV*i)/(PMT+PV*i))/Math.log(1+i);}\n        if(isNaN(result)||!isFinite(result)){setDisplay('Error');setSub('No solution');}\n        else{setTvm(t=>({...t,[key]:result}));setDisplay(fmt(result,2));setSub((key)+\" = \"+(fmt(result,2)));}\n      }catch{setDisplay('Error');}\n      setCptMode(false);setInput('');return;\n    }\n    if(sec){\n      if(key==='FV'){setTvm({N:0,IY:0,PV:0,PMT:0,FV:0});setSub('CLR TVM');}\n      setSec(false);return;\n    }\n    const val=cur();setTvm(t=>({...t,[key]:val}));setSub((key)+\"=\"+(fmt(val,2)));setInput('');\n  };\n\n  const pressNPV=()=>{\n    const rate=tvm.IY/100;let npv=0,t=0;\n    for(const cf of cashFlows){for(let j=0;j<(cf.freq||1);j++){npv+=(cf.value||0)/Math.pow(1+rate,t);t++;}}\n    setDisplay(fmt(npv,2));setSub(\"NPV @ \"+(tvm.IY)+\"%\");setCfMode(false);\n  };\n\n  const CalcBtn=({label,sub:s,onClick,type='num'})=>{\n    const colors={num:{bg:'#3f3f46',text:'#fff'},op:{bg:'#27272a',text:'#e4e4e7'},tvm:{bg:'#065f46',text:'#fff'},func:{bg:'#1c1c1e',text:'#a1a1aa'},second:{bg:'#d97706',text:'#fff'}};\n    const c=colors[type]||colors.num;\n    return(\n      <button onClick={onClick} className=\"calc-btn\" style={{background:c.bg,color:c.text,fontSize:type==='tvm'?11:13,position:'relative'}}>\n        {s&&<span style={{position:'absolute',top:-9,fontSize:7,color:'#f59e0b',fontWeight:600,letterSpacing:'.02em'}}>{s}</span>}\n        {label}\n      </button>\n    );\n  };\n\n  return(\n    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.75)',backdropFilter:'blur(8px)',zIndex:200,display:'flex',alignItems:'center',justifyContent:'center',padding:16}} onClick={onClose}>\n      <div style={{background:'#18181b',borderRadius:24,width:'100%',maxWidth:360,boxShadow:'0 32px 80px rgba(0,0,0,.5)',border:'1px solid rgba(255,255,255,.08)',overflow:'hidden'}} onClick={e=>e.stopPropagation()}>\n        {/* Header */}\n        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'14px 16px',borderBottom:'1px solid rgba(255,255,255,.06)'}}>\n          <span style={{color:'#f59e0b',fontSize:10,fontWeight:800,letterSpacing:'.18em'}}>FINLEARN CALC</span>\n          <button onClick={onClose} style={{width:28,height:28,borderRadius:'50%',background:'rgba(255,255,255,.08)',border:'none',color:'#71717a',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}><IX size={14}/></button>\n        </div>\n        {/* LCD */}\n        <div style={{background:'#0a1a0f',margin:'12px 14px 0',borderRadius:14,padding:'12px 14px',border:'1px solid rgba(52,211,153,.1)'}}>\n          <div style={{display:'flex',justifyContent:'space-between',fontSize:8,color:'rgba(52,211,153,.5)',height:14}}>\n            <div style={{display:'flex',gap:6}}>{sec&&<span>2ND</span>}{cptMode&&<span>CPT</span>}{cfMode&&<span>CF</span>}</div>\n          </div>\n          <div style={{color:'rgba(52,211,153,.5)',fontSize:10,textAlign:'right',height:14,fontFamily:'monospace'}}>{sub}</div>\n          <div style={{color:'#4ade80',fontSize:32,fontFamily:'monospace',textAlign:'right',letterSpacing:'.04em',textShadow:'0 0 20px rgba(74,222,128,.4)'}}>{display}</div>\n          <div style={{display:'flex',justifyContent:'space-between',marginTop:8,paddingTop:8,borderTop:'1px solid rgba(52,211,153,.1)',fontSize:7,fontFamily:'monospace',color:'#166534',gap:4}}>\n            {Object.entries(tvm).map(([k,v])=><span key={k} style={{color:v?'#22c55e':'#166534'}}>{k}:{raw(v,0)}</span>)}\n          </div>\n        </div>\n        {/* Keys */}\n        <div style={{padding:'12px 14px 16px',display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:6}}>\n          <CalcBtn label=\"N\" s=\"×P/Y\" onClick={()=>pressTVM('N')} type=\"tvm\"/>\n          <CalcBtn label=\"I/Y\" onClick={()=>pressTVM('IY')} type=\"tvm\"/>\n          <CalcBtn label=\"PV\" onClick={()=>pressTVM('PV')} type=\"tvm\"/>\n          <CalcBtn label=\"PMT\" onClick={()=>pressTVM('PMT')} type=\"tvm\"/>\n          <CalcBtn label=\"FV\" s=\"CLR\" onClick={()=>pressTVM('FV')} type=\"tvm\"/>\n          <CalcBtn label=\"CF\" onClick={()=>{setCfMode(true);setSub('CF0');}} type=\"func\"/>\n          <CalcBtn label=\"NPV\" onClick={pressNPV} type=\"func\"/>\n          <CalcBtn label=\"IRR\" onClick={()=>setSub('IRR N/A')} type=\"func\"/>\n          <CalcBtn label=\"%\" onClick={()=>{setDisplay(fmt(cur()/100));setInput('');}} type=\"func\"/>\n          <CalcBtn label=\"√x\" onClick={()=>{const v=cur();setDisplay(v<0?'Error':fmt(Math.sqrt(v)));setInput('');}} type=\"func\"/>\n          <CalcBtn label=\"2nd\" onClick={()=>{setSec(!sec);setSub(sec?'':'2nd');}} type=\"second\"/>\n          <CalcBtn label=\"CPT\" onClick={()=>{setCptMode(true);setSub('CPT');}} type=\"second\"/>\n          <CalcBtn label=\"DEL\" onClick={()=>{const ni=input.slice(0,-1);setInput(ni);setDisplay(ni||'0');}} type=\"func\"/>\n          <CalcBtn label=\"CE\" onClick={pressClear} type=\"func\"/>\n          <CalcBtn label=\"÷\" onClick={()=>pressOp('÷')} type=\"op\"/>\n          <CalcBtn label=\"7\" onClick={()=>pressNum(7)}/><CalcBtn label=\"8\" onClick={()=>pressNum(8)}/><CalcBtn label=\"9\" onClick={()=>pressNum(9)}/>\n          <CalcBtn label=\"×\" onClick={()=>pressOp('×')} type=\"op\"/>\n          <CalcBtn label=\"yˣ\" onClick={()=>{setFirst(cur());setPendingOp('yˣ');setInput('');}} type=\"func\"/>\n          <CalcBtn label=\"4\" onClick={()=>pressNum(4)}/><CalcBtn label=\"5\" onClick={()=>pressNum(5)}/><CalcBtn label=\"6\" onClick={()=>pressNum(6)}/>\n          <CalcBtn label=\"−\" onClick={()=>pressOp('−')} type=\"op\"/>\n          <CalcBtn label=\"1/x\" onClick={()=>{const v=cur();setDisplay(v===0?'Error':fmt(1/v));setInput('');}} type=\"func\"/>\n          <CalcBtn label=\"1\" onClick={()=>pressNum(1)}/><CalcBtn label=\"2\" onClick={()=>pressNum(2)}/><CalcBtn label=\"3\" onClick={()=>pressNum(3)}/>\n          <CalcBtn label=\"+\" onClick={()=>pressOp('+')} type=\"op\"/>\n          <CalcBtn label=\"=\" onClick={pressEq} type=\"op\"/>\n          <CalcBtn label=\"0\" onClick={()=>pressNum(0)}/><CalcBtn label=\".\" onClick={pressDecimal}/>\n          <CalcBtn label=\"+/−\" onClick={()=>{if(input.startsWith('-'))setInput(input.slice(1));else if(input&&input!=='0')setInput('-'+input);setDisplay(input.startsWith('-')?input.slice(1):'-'+input);}} type=\"func\"/>\n        </div>\n      </div>\n    </div>\n  );\n}\n\n// ─── AI CHAT PANEL ────────────────────────────────────────────────────────────\nfunction ChatPanel({user,chats,setChats,activeChatId,setActiveChatId}) {\n  const [msg,setMsg]=useState('');\n  const [loading,setLoading]=useState(false);\n  const [showHistory,setShowHistory]=useState(false);\n  const endRef=useRef(null);\n\n  const current=chats.find(c=>c.id===activeChatId);\n  const messages=current?.messages||[];\n\n  useEffect(()=>{endRef.current?.scrollIntoView({behavior:'smooth'});},[messages,loading]);\n\n  const SYSTEM='Sei il Bull Coach, tutor AI esperto per CFA prep e finanza. Rispondi SEMPRE in italiano (termini tecnici in inglese ok). Sii conciso ma preciso. Usa emoji: 📊📈💡🎯⚡. Copri: Fixed Income, Equity, Derivatives, Portfolio Mgmt, Ethics, FRA, Quant Methods.';\n\n  const callAI=async(userMsg,history)=>{\n    try{\n      const ctx=history.slice(-4).map(m=>(m.role==='user'?'Utente: ':'Coach: ')+m.content).join('\\n');\n      const prompt=SYSTEM+'\\n\\n'+(ctx?'Conversazione precedente:\\n'+ctx+'\\n\\n':'')+'Utente: '+userMsg+'\\nCoach:';\n      const url='https://text.pollinations.ai/'+encodeURIComponent(prompt)+'?model=openai';\n      const ctrl=new AbortController();\n      const tm=setTimeout(()=>ctrl.abort(),12000);\n      const res=await fetch(url,{signal:ctrl.signal});\n      clearTimeout(tm);\n      if(!res.ok)throw new Error('http '+res.status);\n      const text=await res.text();\n      const t=text.trim();\n      if(!t||t.length<3)return fallback(userMsg);\n      return t;\n    }\n    catch(e){console.warn('AI call failed:',e&&e.message);return fallback(userMsg);}\n  };\n\n  const fallback=(t)=>{\n    const l=t.toLowerCase();\n    if(l.includes('duration'))return'📊 **Duration** misura la sensibilità al tasso:\\n\\n• **MacD** = tempo medio ponderato dei CF\\n• **ModD** = MacD / (1+y/m) → variazione % per 1% Δy\\n• **EffD** = per bond con opzioni embedded\\n\\n💡 ModD=7 → yield +1% ≈ price -7%';\n    if(l.includes('ytm')||l.includes('yield'))return'📈 **YTM** = IRR del bond!\\n\\nTasso che eguaglia PV di tutti i CF al prezzo.\\n• **BEY** = 2 × semi YTM\\n• **EAY** = (1+semi YTM)² - 1\\n\\n⚡ Premium bond: Coupon > CY > YTM';\n    if(l.includes('ciao')||l.includes('hello'))return'🐂 Ciao'+(user?.displayName?' '+user.displayName:'')+'! Pronto a dominare il CFA?\\n\\nChiedimi di:\\n📊 Fixed Income & Duration\\n📈 Equity & Valuation\\n⚡ Derivatives & Greeks\\n📐 Quant Methods';\n    return'🐂 Ottima domanda! Posso aiutarti con:\\n\\n📊 Bond valuation, duration, spreads\\n📈 Equity, P/E, DDM, FCF\\n⚡ Options, futures, swaps\\n📐 NPV, IRR, CAPM\\n\\nDimmi cosa vuoi approfondire! 💪';\n  };\n\n  const newChat=()=>{\n    const c={id:'c_'+Date.now(),title:'Nuova chat',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),messages:[{role:'assistant',content:'🐂 Ciao'+(user?.displayName?' '+user.displayName:'')+'! Sono il Bull Coach, il tuo tutor AI per il CFA.\\n\\nChiedimi qualsiasi cosa su:\\n📊 Fixed Income & Bonds\\n📈 Equity Analysis\\n⚡ Derivatives\\n📐 Quant Methods',timestamp:new Date().toISOString()}]};\n    setChats(p=>[c,...p].slice(0,50));setActiveChatId(c.id);setShowHistory(false);\n  };\n\n  const send=async()=>{\n    if(!msg.trim()||loading)return;\n    const text=msg.trim();\n    let chatId=activeChatId;\n    if(!chatId){const c={id:'c_'+Date.now(),title:text.slice(0,40),createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),messages:[]};chatId=c.id;setChats(p=>[c,...p].slice(0,50));setActiveChatId(c.id);}\n    const um={role:'user',content:text,timestamp:new Date().toISOString()};\n    setChats(p=>p.map(c=>c.id===chatId?{...c,title:c.messages.filter(x=>x.role==='user').length===0?text.slice(0,40):c.title,messages:[...c.messages,um],updatedAt:new Date().toISOString()}:c));\n    setMsg('');setLoading(true);\n    try{\n      const cur=chats.find(c=>c.id===chatId)?.messages||[];\n      const reply=await callAI(text,cur);\n      setChats(p=>p.map(c=>c.id===chatId?{...c,messages:[...c.messages,{role:'assistant',content:reply,timestamp:new Date().toISOString()}],updatedAt:new Date().toISOString()}:c));\n    }catch{\n      setChats(p=>p.map(c=>c.id===chatId?{...c,messages:[...c.messages,{role:'assistant',content:'⚠️ Errore. Riprova!',timestamp:new Date().toISOString()}],updatedAt:new Date().toISOString()}:c));\n    }\n    setLoading(false);\n  };\n\n  const fmtMsg=(text)=>{\n    try{\n    if(!text)return null;\n    const boldRe=new RegExp('\\\\*\\\\*(.*?)\\\\*\\\\*','g');\n    return text.split('\\n').map((line,i)=>{\n      const safe=line.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');\n      const fmt=safe.replace(boldRe,'<strong>$1</strong>');\n      if(line.startsWith('\u2022 ')||line.startsWith('- '))return(\n        <div key={i} style={{display:'flex',gap:8,marginTop:2}}>\n          <span style={{color:'var(--em)',flexShrink:0}}>&bull;</span>\n          <span dangerouslySetInnerHTML={{__html:fmt.slice(fmt.indexOf(' ')+1)}}/>\n        </div>\n      );\n      return<div key={i} style={{marginTop:i>0?2:0}} dangerouslySetInnerHTML={{__html:fmt}}/>;\n    });\n    }catch(e){return<span>{text}</span>;}\n  };\n\n  const suggestions=['📊 Cos è la Duration?','📈 Come calcolo YTM?','⚡ Differenza Call vs Put','📐 Spiegami il CAPM'];\n\n  return(\n    <div style={{display:'flex',flexDirection:'column',height:'100%',background:'#fafafa'}}>\n      <div style={{background:'rgba(255,255,255,.95)',backdropFilter:'blur(16px)',borderBottom:'1px solid var(--border)',padding:'12px 16px',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>\n        <div style={{display:'flex',alignItems:'center',gap:12}}>\n          <div style={{width:44,height:44,borderRadius:14,background:'linear-gradient(135deg,#f59e0b,#ea580c)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:22,boxShadow:'0 4px 12px rgba(245,158,11,.3)'}}>🐂</div>\n          <div>\n            <div style={{fontWeight:700,fontSize:15,color:'var(--ink)'}}>Bull Coach AI</div>\n            <div style={{fontSize:11,color:'var(--ink-4)',display:'flex',alignItems:'center',gap:4}}><ISpark size={10} style={{color:'#f59e0b'}}/> Powered by Claude</div>\n          </div>\n        </div>\n        <div style={{display:'flex',gap:8}}>\n          <button onClick={()=>setShowHistory(true)} style={{position:'relative',width:38,height:38,borderRadius:12,background:'#f1f5f9',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--ink-3)'}}>\n            <IClock size={17}/>\n            {chats.length>0&&<span style={{position:'absolute',top:-3,right:-3,width:16,height:16,background:'#f59e0b',color:'#fff',fontSize:9,fontWeight:700,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center'}}>{chats.length}</span>}\n          </button>\n          <button onClick={newChat} style={{width:38,height:38,borderRadius:12,background:'#fef3c7',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:'#d97706'}}><IPlus size={17}/></button>\n        </div>\n      </div>\n\n      {!activeChatId&&chats.length===0?(\n        <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:24,gap:20}}>\n          <div style={{width:80,height:80,borderRadius:24,background:'linear-gradient(135deg,#f59e0b,#ea580c)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:40,boxShadow:'0 16px 48px rgba(245,158,11,.3)'}}>🐂</div>\n          <div style={{textAlign:'center'}}>\n            <div style={{fontSize:20,fontWeight:800,color:'var(--ink)'}}>Bull Coach AI</div>\n            <div style={{fontSize:13,color:'var(--ink-3)',marginTop:4}}>Il tuo tutor CFA personale</div>\n          </div>\n          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,width:'100%',maxWidth:320}}>\n            {suggestions.map((s,i)=>(\n              <button key={i} onClick={()=>setMsg(s.replace(/^[^s]+ /,''))}\n                style={{padding:'12px 14px',background:'#fff',border:'1.5px solid var(--border)',borderRadius:14,fontSize:12,color:'var(--ink-2)',cursor:'pointer',textAlign:'left',fontWeight:500,fontFamily:'inherit'}}>\n                {s}\n              </button>\n            ))}\n          </div>\n        </div>\n      ):(\n        <div style={{flex:1,overflowY:'auto',WebkitOverflowScrolling:'touch',padding:'16px 16px 8px'}}>\n          <div style={{maxWidth:560,margin:'0 auto',display:'flex',flexDirection:'column',gap:12}}>\n            {messages.map((m,i)=>(\n              <div key={i} style={{display:'flex',justifyContent:m.role==='user'?'flex-end':'flex-start'}}>\n                {m.role==='assistant'&&<div style={{width:28,height:28,borderRadius:9,background:'linear-gradient(135deg,#f59e0b,#ea580c)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,marginRight:8,flexShrink:0,marginTop:4}}>🐂</div>}\n                <div className={m.role==='user'?'bubble-user':'bubble-ai'} style={{maxWidth:'82%',padding:'11px 15px',fontSize:13.5,lineHeight:1.65,color:m.role==='user'?'#fff':'var(--ink-2)'}}>\n                  <div style={{display:'flex',flexDirection:'column',gap:1}}>{fmtMsg(m.content)}</div>\n                </div>\n              </div>\n            ))}\n            {loading&&(\n              <div style={{display:'flex',justifyContent:'flex-start'}}>\n                <div style={{width:28,height:28,borderRadius:9,background:'linear-gradient(135deg,#f59e0b,#ea580c)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,marginRight:8,flexShrink:0}}>🐂</div>\n                <div className=\"bubble-ai\" style={{padding:'14px 16px'}}>\n                  <div style={{display:'flex',gap:5}}>\n                    {[0,.15,.3].map((d,i)=><div key={i} style={{width:7,height:7,background:'#94a3b8',borderRadius:'50%',animation:'bounce-dot 1.2s infinite',animationDelay:d+'s'}}/>)}\n                  </div>\n                </div>\n              </div>\n            )}\n            <div ref={endRef}/>\n          </div>\n        </div>\n      )}\n\n      <div style={{background:'rgba(255,255,255,.95)',backdropFilter:'blur(16px)',borderTop:'1px solid var(--border)',padding:'12px 16px',flexShrink:0}}>\n        <div style={{maxWidth:560,margin:'0 auto',display:'flex',gap:10,alignItems:'center'}}>\n          <input value={msg} onChange={e=>setMsg(e.target.value)} onKeyDown={e=>e.key==='Enter'&&!e.shiftKey&&send()}\n            placeholder=\"Chiedimi di bonds, equity, derivati…\" disabled={loading}\n            style={{flex:1,padding:'12px 16px',background:'#f1f5f9',border:'1.5px solid transparent',borderRadius:14,outline:'none',fontSize:14,fontFamily:'inherit',color:'var(--ink)',transition:'all .18s'}}\n            onFocus={e=>{e.target.style.background='#fff';e.target.style.border='1.5px solid var(--em)';e.target.style.boxShadow='0 0 0 3px rgba(5,150,105,.1)';}}\n            onBlur={e=>{e.target.style.background='#f1f5f9';e.target.style.border='1.5px solid transparent';e.target.style.boxShadow='none';}}\n          />\n          <button onClick={send} disabled={!msg.trim()||loading}\n            style={{width:46,height:46,borderRadius:14,background:msg.trim()&&!loading?'linear-gradient(135deg,#f59e0b,#ea580c)':'#f1f5f9',border:'none',cursor:msg.trim()&&!loading?'pointer':'default',display:'flex',alignItems:'center',justifyContent:'center',color:msg.trim()&&!loading?'#fff':'#cbd5e1',transition:'all .2s',flexShrink:0}}>\n            <ISend size={17}/>\n          </button>\n        </div>\n      </div>\n\n      {showHistory&&(\n        <div style={{position:'absolute',inset:0,zIndex:50,display:'flex'}} className=\"anim-in\">\n          <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,.35)',backdropFilter:'blur(4px)'}} onClick={()=>setShowHistory(false)}/>\n          <div style={{position:'relative',marginLeft:'auto',width:300,background:'#fff',height:'100%',display:'flex',flexDirection:'column',boxShadow:'-16px 0 48px rgba(0,0,0,.12)'}}>\n            <div style={{padding:'16px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'space-between'}}>\n              <div>\n                <div style={{fontWeight:700,fontSize:15,color:'var(--ink)'}}>Cronologia</div>\n                <div style={{fontSize:11,color:'var(--ink-4)',marginTop:2}}>{chats.length} conversazioni</div>\n              </div>\n              <button onClick={()=>setShowHistory(false)} style={{width:32,height:32,borderRadius:10,background:'#f1f5f9',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--ink-3)'}}><IX size={15}/></button>\n            </div>\n            <div style={{flex:1,overflowY:'auto',padding:'10px 10px'}}>\n              {chats.length===0?<div style={{textAlign:'center',padding:40,color:'var(--ink-4)'}}><IChat size={28} style={{margin:'0 auto 8px',display:'block'}}/><div style={{fontSize:13}}>Nessuna chat</div></div>\n              :chats.map(c=>(\n                <div key={c.id} onClick={()=>{setActiveChatId(c.id);setShowHistory(false);}}\n                  style={{padding:'12px',borderRadius:12,cursor:'pointer',marginBottom:4,background:c.id===activeChatId?'#ecfdf5':'transparent',border:'1.5px solid '+(c.id===activeChatId?'#a7f3d0':'transparent'),transition:'all .15s',display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}\n                  onMouseEnter={e=>{if(c.id!==activeChatId)e.currentTarget.style.background='#f8fafc';}}\n                  onMouseLeave={e=>{if(c.id!==activeChatId)e.currentTarget.style.background='transparent';}}>\n                  <div style={{flex:1,minWidth:0}}>\n                    <div style={{fontWeight:600,fontSize:13,color:'var(--ink)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{c.title||'Chat'}</div>\n                    <div style={{fontSize:11,color:'var(--ink-4)',marginTop:2}}>{new Date(c.updatedAt).toLocaleDateString('it')} · {c.messages?.length||0} msg</div>\n                  </div>\n                  <button onClick={e=>{e.stopPropagation();setChats(p=>p.filter(x=>x.id!==c.id));if(activeChatId===c.id)setActiveChatId(null);}}\n                    style={{width:24,height:24,borderRadius:8,background:'transparent',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:'#fca5a5',opacity:0,transition:'opacity .15s',flexShrink:0}}\n                    onMouseEnter={e=>e.currentTarget.style.opacity='1'} onMouseLeave={e=>e.currentTarget.style.opacity='0'}>\n                    <ITrash size={12}/>\n                  </button>\n                </div>\n              ))}\n            </div>\n            <div style={{padding:'12px'}}>\n              <button onClick={newChat} style={{width:'100%',padding:'12px',borderRadius:14,background:'linear-gradient(135deg,#f59e0b,#ea580c)',color:'#fff',border:'none',fontWeight:700,fontSize:14,cursor:'pointer',fontFamily:'inherit'}}>+ Nuova Chat</button>\n            </div>\n          </div>\n        </div>\n      )}\n    </div>\n  );\n}\n\n// ─── EXPORT TO WINDOW FOR SCRIPT 2 ──────────────────────────────────────────\n\n\n// ─── TEST CFA ──────────────────────────────────────────────────────────────────\nfunction TestCFA({user,stats,setStats,setSection}) {\n  const MODES=[\n    {id:'warmup',  label:'Warm-up',   q:10, mins:15, color:'#10b981', icon:'🌱'},\n    {id:'standard',label:'Standard',  q:25, mins:38, color:'#3b82f6', icon:'🎯'},\n    {id:'mock',    label:'Full Mock', q:50, mins:75, color:'#8b5cf6', icon:'🏆'},\n  ];\n\n  const [phase,setPhase]=useState('select'); // select | exam | result\n  const [mode,setMode]=useState(null);\n  const [qs,setQs]=useState([]);\n  const [idx,setIdx]=useState(0);\n  const [answers,setAnswers]=useState({});\n  const [selected,setSelected]=useState(null);\n  const [timeLeft,setTimeLeft]=useState(0);\n  const [showCalc,setShowCalc]=useState(false);\n  const [history,setHistory]=useState(()=>{try{return JSON.parse(localStorage.getItem('fl_exam_history')||'[]');}catch{return [];}});\n  const timerRef=useRef(null);\n\n  const allQ=useMemo(()=>{\n    const Q=window.__FL_QUESTIONS||{};\n    const out=[];\n    Object.entries(Q).forEach(([topic,arr])=>{\n      (arr||[]).forEach(q=>out.push({...q,topic}));\n    });\n    return out;\n  },[]);\n\n  const bestScore=history.length?Math.max(...history.map(h=>h.pct)):null;\n\n  function startExam(m) {\n    const shuffled=[...allQ].sort(()=>Math.random()-0.5).slice(0,m.q);\n    setMode(m); setQs(shuffled); setIdx(0); setAnswers({}); setSelected(null);\n    setTimeLeft(m.mins*60); setPhase('exam');\n  }\n\n  useEffect(()=>{\n    if(phase!=='exam') return;\n    timerRef.current=setInterval(()=>{\n      setTimeLeft(t=>{\n        if(t<=1){clearInterval(timerRef.current); finishExam(); return 0;}\n        return t-1;\n      });\n    },1000);\n    return ()=>clearInterval(timerRef.current);\n  },[phase]);\n\n  function finishExam() {\n    clearInterval(timerRef.current);\n    setPhase('result');\n    const correct=qs.filter((q,i)=>answers[i]===q.ans).length;\n    const pct=Math.round(correct/qs.length*100);\n    const entry={date:new Date().toLocaleDateString('it-IT'),mode:mode.label,score:correct,total:qs.length,pct};\n    const newH=[entry,...history].slice(0,20);\n    setHistory(newH);\n    localStorage.setItem('fl_exam_history',JSON.stringify(newH));\n    if(pct>=60) setStats(s=>({...s,xp:s.xp+300,coins:s.coins+50}));\n  }\n\n  function answer(i) {\n    if(answers[idx]!==undefined) return;\n    const newA={...answers,[idx]:i};\n    setAnswers(newA);\n    setSelected(i);\n    setTimeout(()=>{\n      if(idx<qs.length-1){setIdx(idx+1);setSelected(null);}\n      else finishExam();\n    },900);\n  }\n\n  const mm=String(Math.floor(timeLeft/60)).padStart(2,'0');\n  const ss=String(timeLeft%60).padStart(2,'0');\n  const isLow=timeLeft<120&&timeLeft>0;\n\n  // ── SELECT SCREEN ──\n  if(phase==='select') return (\n    <div style={{height:'100%',overflowY:'auto',WebkitOverflowScrolling:'touch',background:'var(--bg)',paddingBottom:100}}>\n      <div style={{background:'linear-gradient(160deg,#0d1b3e,#1a0050)',padding:'32px 20px 28px'}}>\n        <div style={{maxWidth:600,margin:'0 auto'}}>\n          <div style={{fontSize:13,color:'rgba(255,255,255,.45)',fontWeight:600,letterSpacing:1,textTransform:'uppercase',marginBottom:8}}>Simulazione Esame</div>\n          <h1 style={{fontFamily:\"'DM Serif Display',Georgia,serif\",fontSize:28,color:'#fff',marginBottom:4}}>Test CFA</h1>\n          {bestScore!==null&&<div style={{display:'inline-flex',alignItems:'center',gap:6,marginTop:8,background:'rgba(255,255,255,.1)',borderRadius:99,padding:'5px 12px'}}><span style={{fontSize:12,color:'rgba(255,255,255,.7)'}}>Best score</span><span style={{fontSize:13,fontWeight:700,color:'#fbbf24'}}>{bestScore}%</span></div>}\n        </div>\n      </div>\n      <div style={{maxWidth:600,margin:'0 auto',padding:'20px'}}>\n        <div style={{marginBottom:24}}>\n          {MODES.map(m=>(\n            <div key={m.id} onClick={()=>startExam(m)} style={{background:'#fff',borderRadius:16,padding:'20px',marginBottom:12,boxShadow:'0 2px 12px rgba(0,0,0,.06)',border:'1px solid #f1f5f9',cursor:'pointer',display:'flex',alignItems:'center',gap:16}}>\n              <div style={{width:52,height:52,borderRadius:14,background:m.color+'18',display:'flex',alignItems:'center',justifyContent:'center',fontSize:26,flexShrink:0}}>{m.icon}</div>\n              <div style={{flex:1}}>\n                <div style={{fontWeight:700,fontSize:16,color:'#0f2044'}}>{m.label}</div>\n                <div style={{fontSize:13,color:'#64748b',marginTop:2}}>{m.q} domande · {m.mins} minuti</div>\n              </div>\n              <div style={{color:m.color,fontSize:20}}>›</div>\n            </div>\n          ))}\n        </div>\n        {history.length>0&&(\n          <div>\n            <div style={{fontWeight:700,fontSize:15,color:'#0f2044',marginBottom:12}}>Storico esami</div>\n            {history.slice(0,5).map((h,i)=>(\n              <div key={i} style={{background:'#fff',borderRadius:12,padding:'14px 16px',marginBottom:8,boxShadow:'0 1px 6px rgba(0,0,0,.05)',border:'1px solid #f1f5f9',display:'flex',alignItems:'center',gap:12}}>\n                <div style={{flex:1}}>\n                  <div style={{fontSize:13,fontWeight:600,color:'#0f2044'}}>{h.mode}</div>\n                  <div style={{fontSize:11,color:'#94a3b8',marginTop:2}}>{h.date}</div>\n                </div>\n                <div style={{textAlign:'right'}}>\n                  <div style={{fontSize:16,fontWeight:800,color:h.pct>=60?'#10b981':'#ef4444'}}>{h.pct}%</div>\n                  <div style={{fontSize:10,color:'#94a3b8'}}>{h.score}/{h.total}</div>\n                </div>\n                <div style={{fontSize:11,fontWeight:700,color:h.pct>=60?'#10b981':'#ef4444',background:h.pct>=60?'#ecfdf5':'#fef2f2',padding:'3px 8px',borderRadius:99}}>{h.pct>=60?'PASS':'FAIL'}</div>\n              </div>\n            ))}\n          </div>\n        )}\n      </div>\n    </div>\n  );\n\n  // ── RESULT SCREEN ──\n  if(phase==='result') {\n    const correct=qs.filter((q,i)=>answers[i]===q.ans).length;\n    const pct=Math.round(correct/qs.length*100);\n    const pass=pct>=60;\n    const byTopic={};\n    qs.forEach((q,i)=>{\n      if(!byTopic[q.topic])byTopic[q.topic]={correct:0,total:0};\n      byTopic[q.topic].total++;\n      if(answers[i]===q.ans)byTopic[q.topic].correct++;\n    });\n    const topicNames={bonds:'Obbligazioni',stocks:'Azioni',cfa_fi:'CFA Fixed Income',derivatives:'Derivati',alt:'Alt. Investments'};\n    return (\n      <div style={{height:'100%',overflowY:'auto',WebkitOverflowScrolling:'touch',background:'var(--bg)',paddingBottom:100}}>\n        <div style={{background:pass?'linear-gradient(160deg,#064e3b,#065f46)':'linear-gradient(160deg,#7f1d1d,#991b1b)',padding:'32px 20px 28px',textAlign:'center'}}>\n          <div style={{fontSize:48,marginBottom:8}}>{pass?'🏆':'📚'}</div>\n          <div style={{fontSize:48,fontWeight:900,color:'#fff'}}>{pct}%</div>\n          <div style={{fontSize:16,color:'rgba(255,255,255,.7)',marginBottom:4}}>{correct} / {qs.length} corrette</div>\n          <div style={{display:'inline-block',background:pass?'#10b981':'#ef4444',color:'#fff',fontWeight:700,fontSize:14,padding:'6px 18px',borderRadius:99,marginTop:8}}>{pass?'PROMOSSO ✓':'DA RIVEDERE ✗'}</div>\n          {pass&&<div style={{marginTop:12,fontSize:13,color:'rgba(255,255,255,.6)'}}>+300 XP · +50 🪙</div>}\n        </div>\n        <div style={{maxWidth:600,margin:'0 auto',padding:'20px'}}>\n          <div style={{fontWeight:700,fontSize:15,color:'#0f2044',marginBottom:12}}>Risultati per argomento</div>\n          {Object.entries(byTopic).map(([topic,r])=>{\n            const p=Math.round(r.correct/r.total*100);\n            return (\n              <div key={topic} style={{background:'#fff',borderRadius:12,padding:'14px 16px',marginBottom:8,boxShadow:'0 1px 6px rgba(0,0,0,.05)',border:'1px solid #f1f5f9'}}>\n                <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>\n                  <span style={{fontSize:13,fontWeight:600,color:'#0f2044'}}>{topicNames[topic]||topic}</span>\n                  <span style={{fontSize:13,fontWeight:700,color:p>=60?'#10b981':'#ef4444'}}>{r.correct}/{r.total}</span>\n                </div>\n                <div style={{background:'#f1f5f9',borderRadius:99,height:6}}>\n                  <div style={{width:p+'%',height:'100%',borderRadius:99,background:p>=60?'#10b981':'#ef4444',transition:'width .5s'}}/>\n                </div>\n              </div>\n            );\n          })}\n          <div style={{display:'flex',gap:12,marginTop:20}}>\n            <div onClick={()=>startExam(mode)} style={{flex:1,background:'#0f2044',color:'#fff',borderRadius:14,padding:'14px',textAlign:'center',fontWeight:700,fontSize:14,cursor:'pointer'}}>Riprova</div>\n            <div onClick={()=>setPhase('select')} style={{flex:1,background:'#f1f5f9',color:'#0f2044',borderRadius:14,padding:'14px',textAlign:'center',fontWeight:700,fontSize:14,cursor:'pointer'}}>Menu</div>\n          </div>\n        </div>\n      </div>\n    );\n  }\n\n  // ── EXAM SCREEN ──\n  const q=qs[idx];\n  const answered=answers[idx]!==undefined;\n  const prog=(idx/qs.length)*100;\n  return (\n    <React.Fragment>\n    <div style={{height:'100%',display:'flex',flexDirection:'column',background:'var(--bg)'}}>\n      {/* Header */}\n      <div style={{background:'#0f2044',padding:'12px 16px',flexShrink:0}}>\n        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>\n          <span style={{color:'rgba(255,255,255,.6)',fontSize:12}}>{mode.label} · {idx+1}/{qs.length}</span>\n          <span style={{color:isLow?'#ef4444':'#fff',fontWeight:700,fontSize:16,fontVariantNumeric:'tabular-nums'}}>{mm}:{ss}</span><button onClick={()=>setShowCalc(true)} style={{width:40,height:40,borderRadius:13,background:'rgba(255,255,255,.07)',border:'1px solid rgba(255,255,255,.1)',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:'rgba(255,255,255,.6)'}}><Ph name=\"calculator\" size={20} duotone/></button>\n        </div>\n        <div style={{background:'rgba(255,255,255,.15)',borderRadius:99,height:4}}>\n          <div style={{width:prog+'%',height:'100%',borderRadius:99,background:'#10b981',transition:'width .3s'}}/>\n        </div>\n      </div>\n      {/* Dot nav */}\n      <div style={{display:'flex',gap:4,padding:'10px 16px',overflowX:'auto',background:'#fff',borderBottom:'1px solid #f1f5f9',flexShrink:0}}>\n        {qs.map((_,i)=>(\n          <div key={i} onClick={()=>{setIdx(i);setSelected(answers[i]!==undefined?answers[i]:null);}} style={{width:20,height:20,borderRadius:'50%',flexShrink:0,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontSize:9,fontWeight:700,\n            background:i===idx?'#0f2044':answers[i]!==undefined?(answers[i]===qs[i].ans?'#10b981':'#ef4444'):'#f1f5f9',\n            color:i===idx||answers[i]!==undefined?'#fff':'#94a3b8'}}>{i+1}</div>\n        ))}\n      </div>\n      {/* Question */}\n      <div style={{flex:1,overflowY:'auto',WebkitOverflowScrolling:'touch',padding:'20px 16px 100px'}}>\n        <div style={{background:'#fff',borderRadius:16,padding:'20px',marginBottom:16,boxShadow:'0 2px 12px rgba(0,0,0,.06)',border:'1px solid #f1f5f9'}}>\n          <div style={{fontSize:10,color:'#94a3b8',fontWeight:600,letterSpacing:1,textTransform:'uppercase',marginBottom:10}}>{q.topic}</div>\n          <div style={{fontSize:15,fontWeight:600,color:'#0f2044',lineHeight:1.5}}>{q.q}</div>\n        </div>\n        {q.opts.map((opt,i)=>{\n          let bg='#fff', border='#f1f5f9', color='#0f2044';\n          if(answered){\n            if(i===q.ans){bg='#ecfdf5';border='#10b981';color='#065f46';}\n            else if(i===selected&&i!==q.ans){bg='#fef2f2';border='#ef4444';color='#991b1b';}\n            else{bg='#f8fafc';color='#94a3b8';}\n          } else if(selected===i){bg='#eff6ff';border='#3b82f6';}\n          return (\n            <div key={i} onClick={()=>answer(i)} style={{background:bg,border:'2px solid '+border,borderRadius:14,padding:'14px 16px',marginBottom:10,cursor:answered?'default':'pointer',transition:'all .2s',color}}>\n              <div style={{display:'flex',gap:12,alignItems:'flex-start'}}>\n                <div style={{width:22,height:22,borderRadius:'50%',background:answered&&i===q.ans?'#10b981':answered&&i===selected&&i!==q.ans?'#ef4444':'#f1f5f9',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,flexShrink:0,color:answered&&(i===q.ans||(i===selected&&i!==q.ans))?'#fff':'#94a3b8'}}>\n                  {String.fromCharCode(65+i)}\n                </div>\n                <span style={{fontSize:14,lineHeight:1.4}}>{opt}</span>\n              </div>\n            </div>\n          );\n        })}\n        {answered&&(\n          <div style={{background:'#fffbeb',border:'1px solid #fbbf24',borderRadius:12,padding:'14px 16px',marginTop:4}}>\n            <div style={{fontSize:12,fontWeight:700,color:'#92400e',marginBottom:4}}>💡 Spiegazione</div>\n            <div style={{fontSize:13,color:'#78350f',lineHeight:1.5}}>{q.exp}</div>\n          </div>\n        )}\n        {answered&&idx<qs.length-1&&(\n          <div onClick={()=>{setIdx(idx+1);setSelected(answers[idx+1]!==undefined?answers[idx+1]:null);}} style={{background:'#0f2044',color:'#fff',borderRadius:14,padding:'14px',textAlign:'center',fontWeight:700,fontSize:14,cursor:'pointer',marginTop:12}}>\n            Prossima →\n          </div>\n        )}\n        {answered&&idx===qs.length-1&&(\n          <div onClick={finishExam} style={{background:'#10b981',color:'#fff',borderRadius:14,padding:'14px',textAlign:'center',fontWeight:700,fontSize:14,cursor:'pointer',marginTop:12}}>\n            Vedi risultati 🏆\n          </div>\n        )}\n      </div>\n    </div>\n    {showCalc&&(\n      <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.55)',zIndex:999,display:'flex',alignItems:'flex-end'}} onClick={()=>setShowCalc(false)}>\n        <div onClick={e=>e.stopPropagation()} style={{width:'100%',maxHeight:'85vh',overflowY:'auto',borderRadius:'20px 20px 0 0',background:'#f8fafc'}}>\n          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'16px 20px 0'}}>\n            <span style={{fontWeight:700,fontSize:15,color:'#0f2044'}}>Calcolatrice</span>\n            <div onClick={()=>setShowCalc(false)} style={{fontSize:20,cursor:'pointer',color:'#64748b'}}>✕</div>\n          </div>\n          <Calculator onClose={()=>setShowCalc(false)}/>\n        </div>\n      </div>\n    )}\n    </React.Fragment>\n  );\n}\n// ─── END TEST CFA ──────────────────────────────────────────────────────────────\n\nclass ErrorBoundary extends React.Component{\n  constructor(p){super(p);this.state={err:null};}\n  static getDerivedStateFromError(e){return{err:e};}\n  componentDidCatch(e,i){console.error('React crash:',e,i);}\n  render(){\n    if(this.state.err)return(\n      <div style={{padding:24,color:'#ef4444',fontSize:13,fontFamily:'monospace',background:'#fff',height:'100%',overflowY:'auto'}}>\n        <b>Errore app:</b><br/>\n        {this.state.err.message||String(this.state.err)}<br/><br/>\n        <button onClick={()=>this.setState({err:null})} style={{padding:'8px 16px',borderRadius:8,border:'1px solid #ef4444',cursor:'pointer',background:'#fff',color:'#ef4444',fontFamily:'inherit'}}>Riprova</button>\n      </div>\n    );\n    return this.props.children;\n  }\n}\n\nfunction App() {\n  const [splash,setSplash]=useState(true);\n  const [user,setUser]=useState(null);\n  const [userData,setUserData]=useState(null);\n  const [loading,setLoading]=useState(true);\n\n  // App state\n  const [section,setSection]=useState('home');\n  const [stats,setStats]=useState(null);\n  const [completed,setCompleted]=useState([]);\n  const [activeLesson,setActiveLesson]=useState(1);\n  const [timerOn,setTimerOn]=useState(false);\n  const [showCalc,setShowCalc]=useState(false);\n  const [chats,setChats]=useState([]);\n  const [activeChatId,setActiveChatId]=useState(null);\n\n  // Quiz state\n  const [quiz,setQuiz]=useState(null);\n  const [quizQs,setQuizQs]=useState([]);\n  const [quizIdx,setQuizIdx]=useState(0);\n  const [quizAnswers,setQuizAnswers]=useState([]);\n  const [selected,setSelected]=useState(null);\n  const [streak,setStreak]=useState(0);\n  const [timer,setTimer]=useState(null);\n  const [quizResults,setQuizResults]=useState(null);\n  const [quizTopic,setQuizTopic]=useState(null);\n\n  // Library state\n  const [topic,setTopic]=useState(null);\n  const [libTab,setLibTab]=useState('teoria');\n  const [cardIdx,setCardIdx]=useState(0);\n  const [flipped,setFlipped]=useState(false);\n\n  useEffect(()=>{\n    mockAuth.onAuthStateChanged(u=>{\n      if(u){setUser(u);const d=mockDb.get(u.uid)||defaultData();setUserData(d);setStats(d.stats);setCompleted(d.completedLessons||[]);setActiveLesson(d.activeLesson||1);}\n      setLoading(false);\n    });\n  },[]);\n\n  useEffect(()=>{\n    if(user&&stats){\n      const d={stats,completedLessons:completed,activeLesson,settings:{timerEnabled:timerOn}};\n      mockDb.set(user.uid,d);\n    }\n  },[stats,completed,activeLesson,timerOn]);\n\n  useEffect(()=>{\n    try{setChats(JSON.parse(localStorage.getItem(\"fl_chats_\"+(user?.uid))||'[]'));}catch{}\n  },[user?.uid]);\n  useEffect(()=>{\n    try{localStorage.setItem(\"fl_chats_\"+(user?.uid),JSON.stringify(chats));}catch{}\n  },[chats,user?.uid]);\n\n  // Timer\n  useEffect(()=>{\n    const cur=quizQs[quizIdx];\n    if(quiz&&timerOn&&timer>0&&quizAnswers[quizIdx]==null){\n      const id=setTimeout(()=>setTimer(t=>t-1),1000);return()=>clearTimeout(id);\n    }\n    if(timer===0&&quizAnswers[quizIdx]==null){\n      const na=[...quizAnswers];na[quizIdx]=-1;setQuizAnswers(na);setStreak(0);\n    }\n  },[quiz,timerOn,timer,quizIdx,quizAnswers,quizQs]);\n\n  const startQuiz=(questions,topicKey=null)=>{\n    const qs=[...questions].sort(()=>Math.random()-.5);\n    setQuizQs(qs);setQuizAnswers(new Array(qs.length).fill(null));\n    setQuizIdx(0);setQuiz(qs[0]);setSelected(null);setQuizResults(null);setStreak(0);setQuizTopic(topicKey);\n    if(timerOn)setTimer(qs[0].time||45);\n  };\n  const exitQuiz=()=>{setQuiz(null);setQuizQs([]);setQuizAnswers([]);setQuizResults(null);setQuizIdx(0);setSelected(null);};\n\n  const onAuth=(u,d)=>{setUser(u);setUserData(d);setStats(d.stats);setCompleted(d.completedLessons||[]);setActiveLesson(d.activeLesson||1);};\n  const onLogout=async()=>{await mockAuth.signOut();setUser(null);setUserData(null);setStats(null);};\n\n  // ── Quiz Results ─────────────────────────────────────────────────────────\n  if(quizResults){\n    const{total,correct,pct,xpEarned,coinsEarned}=quizResults;\n </div>}\n\n          <div style={{display:'flex',flexDirection:'column',gap:12}}>\n            <button onClick={exitQuiz} className=\"btn-primary\" style={{padding:'15px 0',borderRadius:16,fontSize:15,width:'100%'}}>Continua →</button>\n            <button onClick={()=>{exitQuiz();setTimeout(()=>startQuiz(quizQs,quizTopic),100);}} style={{padding:'13px 0',borderRadius:16,fontSize:14,background:'rgba(255,255,255,.08)',border:'1px solid rgba(255,255,255,.1)',color:'rgba(255,255,255,.7)',cursor:'pointer',fontWeight:600,fontFamily:'inherit',display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>\n              <IRefresh size={16}/> Riprova\n            </button>\n          </div>\n        </div>\n      </div>\n    );\n  }\n\n  // ── Quiz Screen ───────────────────────────────────────────────────────────\n  if(quiz){\n    const cur=quizQs[quizIdx];\n    const curAnswer=quizAnswers[quizIdx];\n    const isAnswered=curAnswer!==null&&curAnswer!==undefined;\n    const isCorrect=isAnswered&&curAnswer===cur.ans;\n    const totalAnswered=quizAnswers.filter(a=>a!==null&&a!==undefined).length;\n    const allAnswered=quizAnswers.every(a=>a!==null&&a!==undefined);\n    const progress=totalAnswered/quizQs.length;\n\n    const goTo=(idx)=>{\n      if(idx<0||idx>=quizQs.length)return;\n      setQuizIdx(idx);setQuiz(quizQs[idx]);setSelected(null);\n      if(timerOn&&quizAnswers[idx]===null)setTimer(quizQs[idx].time||45);\n    };\n    const submitCur=()=>{\n      if(selected===null)return;\n      const na=[...quizAnswers];na[quizIdx]=selected;setQuizAnswers(na);\n      if(selected===cur.ans)setStreak(s=>s+1);else setStreak(0);\n      setSelected(null);\n    };\n    const finishQuiz=()=>{\n      const correct=quizAnswers.filter((a,i)=>a===quizQs[i].ans).length;\n      const pct=Math.round(correct/quizQs.length*100);\n      const xpEarned=correct*20;const coinsEarned=correct*10;\n      setStats(s=>({...s,quizzes:s.quizzes+quizQs.length,correct:s.correct+correct,xp:s.xp+xpEarned+(pct>=60?200:0),coins:s.coins+coinsEarned+(pct>=60?100:0),bestStreak:Math.max(s.bestStreak,streak)}));\n      if(pct>=60&&!quizTopic){setCompleted(p=>[...new Set([...p,activeLesson])]);setActiveLesson(Math.min(activeLesson+1,LESSONS.length));}\n      setQuizResults({total:quizQs.length,correct,pct,xpEarned:xpEarned+(pct>=60?200:0),coinsEarned:coinsEarned+(pct>=60?100:0)});\n    };\n\n    return(\n      <div style={{height:'100vh',display:'flex',flexDirection:'column',background:'#f8fafc'}}>\n        {/* Header */}\n        <div style={{background:'#fff',borderBottom:'1px solid var(--border)',flexShrink:0}}>\n          <div style={{padding:'10px 16px',display:'flex',alignItems:'center',justifyContent:'space-between',maxWidth:600,margin:'0 auto',width:'100%'}}>\n            <button onClick={exitQuiz} style={{width:36,height:36,borderRadius:12,background:'#f1f5f9',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--ink-3)'}}><IX size={18}/></button>\n            <div style={{display:'flex',alignItems:'center',gap:10}}>\n              {streak>1&&<div style={{background:'#fef3c7',color:'#d97706',padding:'4px 10px',borderRadius:99,fontSize:12,fontWeight:700}}>🔥 {streak}</div>}\n              {timerOn&&timer!==null&&!isAnswered&&<div style={{background:timer<=10?'#fef2f2':'#f1f5f9',color:timer<=10?'#dc2626':'#64748b',padding:'4px 10px',borderRadius:99,fontSize:12,fontWeight:700}}>{timer}s</div>}\n              <button onClick={()=>setShowCalc(true)} style={{width:36,height:36,borderRadius:12,background:'#fffbeb',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:'#d97706'}}><ICalc size={17}/></button>\n            </div>\n          </div>\n          {/* Progress */}\n          <div style={{height:3,background:'#f1f5f9'}}>\n            <div style={{height:'100%',background:'linear-gradient(90deg,#059669,#0d9488)',borderRadius:1.5,transition:'width .4s ease',width:(progress*100)+\"%\"}}/>\n          </div>\n        </div>\n\n        {/* Dot navigator */}\n        <div style={{background:'#fff',borderBottom:'1px solid var(--border)',padding:'10px 16px',flexShrink:0}}>\n          <div style={{maxWidth:600,margin:'0 auto',display:'flex',gap:6,overflowX:'auto',WebkitOverflowScrolling:'touch'}}>\n            {quizQs.map((_,i)=>{\n              const a=quizAnswers[i];const isCur=i===quizIdx;\n              const correct=a!==null&&a!==undefined&&a===quizQs[i].ans;\n              const wrong=a!==null&&a!==undefined&&a!==quizQs[i].ans;\n              return(\n                <button key={i} onClick={()=>goTo(i)} style={{flexShrink:0,width:34,height:34,borderRadius:10,border:\"2px solid \"+(isCur?'#059669':correct?'#059669':wrong?'#ef4444':'#e2e8f0'),background:correct?'#059669':wrong?'#ef4444':isCur?'#ecfdf5':'#fff',color:correct||wrong?'#fff':isCur?'#059669':'#94a3b8',fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'inherit',transition:'all .15s'}}>\n                  {correct?'✓':wrong?'✗':i+1}\n                </button>\n              );\n            })}\n          </div>\n        </div>\n\n        {/* Question */}\n        <div style={{flex:1,overflowY:'auto',WebkitOverflowScrolling:'touch'}}>\n          <div style={{maxWidth:600,margin:'0 auto',padding:'24px 20px'}}>\n            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>\n              <span style={{fontSize:12,color:'var(--ink-4)',fontWeight:500}}>Domanda {quizIdx+1} di {quizQs.length}</span>\n              {cur.diff&&<div style={{display:'flex',gap:3}}>{[1,2,3].map(d=><div key={d} style={{width:6,height:6,borderRadius:'50%',background:d<=cur.diff?'#f59e0b':'#e2e8f0'}}/>)}</div>}\n            </div>\n\n            <h2 style={{fontSize:19,fontWeight:700,color:'var(--ink)',lineHeight:1.45,marginBottom:24,textWrap:'pretty'}}>{cur.q}</h2>\n\n            <div style={{display:'flex',flexDirection:'column',gap:10,marginBottom:20}}>\n              {cur.opts.map((opt,i)=>{\n                let cls='option-btn';\n                if(isAnswered){\n                  if(i===cur.ans)cls='option-btn correct';\n                  else if(curAnswer===i)cls='option-btn wrong';\n                  else cls='option-btn dimmed';\n                }else if(selected===i)cls='option-btn selected';\n                return(\n                  <button key={i} className={cls} disabled={isAnswered} onClick={()=>!isAnswered&&setSelected(i)}\n                    style={{padding:'14px 16px',display:'flex',alignItems:'center',gap:12}}>\n                    <div style={{width:30,height:30,borderRadius:9,display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:700,background:isAnswered&&i===cur.ans?'#059669':isAnswered&&curAnswer===i&&!isCorrect?'#ef4444':selected===i?'#059669':'#f1f5f9',color:isAnswered&&(i===cur.ans||(curAnswer===i&&!isCorrect))?'#fff':selected===i?'#fff':'#94a3b8',flexShrink:0,transition:'all .18s'}}>\n                      {String.fromCharCode(65+i)}\n                    </div>\n                    <span style={{fontSize:14,fontWeight:500,color:'var(--ink-2)',flex:1,textAlign:'left'}}>{opt}</span>\n                    {isAnswered&&i===cur.ans&&<ICheck size={16} style={{color:'#059669',flexShrink:0}}/>}\n                    {isAnswered&&curAnswer===i&&!isCorrect&&<IX size={16} style={{color:'#ef4444',flexShrink:0}}/>}\n                  </button>\n                );\n              })}\n            </div>\n\n            {/* Explanation */}\n            {isAnswered&&(\n              <div className=\"anim-up\" style={{borderRadius:16,padding:'16px',background:isCorrect?'#ecfdf5':'#fffbeb',border:\"1.5px solid \"+(isCorrect?'#a7f3d0':'#fde68a')}}>\n                <div style={{display:'flex',gap:12,alignItems:'flex-start'}}>\n                  <div style={{width:34,height:34,borderRadius:10,background:isCorrect?'#dcfce7':'#fef9c3',display:'flex',alignItems:'center',justifyContent:'center',f      </div>\n    );\n  }\n\n  // ── Main layout ───────────────────────────────────────────────────────────\n  if(!user||!stats)return(\n    <div style={{height:'100vh',display:'flex',alignItems:'center',justifyContent:'center'}}>\n      <div style={{width:36,height:36,border:'3px solid #e2e8f0',borderTopColor:'var(--em)',borderRadius:'50%',animation:'spin .7s linear infinite'}}/>\n    </div>\n  );\n\n  const level=getLevel(stats.xp);const nextLvl=getNextLevel(stats.xp);\n  const xpInLevel=nextLvl?stats.xp-level.min:0;const xpNeeded=nextLvl?nextLvl.min-level.min:1;\n  const xpPct=nextLvl?Math.min(1,xpInLevel/xpNeeded):1;\n  const R=44,C=2*Math.PI*R,dash=C*xpPct;\n\n  const navItems=[\n    {id:'home',   label:'Home',     icon:(a)=><Ph name=\"house-simple\"     size={22} fill={!!a}/>},\n    {id:'learn',  label:'Impara',   icon:(a)=><Ph name=\"books\"             size={22} fill={!!a}/>},\n    {id:'test',   label:'Test CFA', icon:(a)=><Ph name=\"exam\"              size={22} fill={!!a}/>},\n    {id:'chat',   label:'Coach',    icon:(a)=><Ph name=\"chat-circle-dots\"  size={22} fill={!!a}/>},\n    {id:'profile',label:'Profilo',  icon:(a)=><Ph name=\"user-circle\"       size={22} fill={!!a}/>},\n  ];\n\n  return(\n    <div style={{height:'100vh',display:'flex',flexDirection:'column',overflow:'hidden'}}>\n      <div style={{flex:1,overflow:'hidden',position:'relative'}}>\n\n        {/* ── HOME ─────────────────────────────────────────────────── */}\n        {section==='home'&&(\n          <div style={{height:'100%',overflowY:'auto',WebkitOverflowScrolling:'touch'}}>\n            {/* Hero */}\n            <div style={{background:'linear-gradient(160deg,#0d1b3e 0%,#0a0f1e 70%)',padding:'20px 20px 28px',position:'relative',overflow:'hidden'}}>\n              <div style={{position:'absolute',top:-80,right:-60,width:260,height:260,borderRadius:'50%',background:'radial-gradient(circle,rgba(5,150,105,.1),transparent 70%)',pointerEvents:'none'}}/>\n              <div style={{positi e0b\"/></linearGradient></defs>\n                    </svg>\n                    <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center'}}>\n                      <img src={LOGO_B64} style={{width:40,height:40,borderRadius:10,objectFit:'cover'}} alt=\"\"/>\n                    </div>\n                  </div>\n                  <div style={{flex:1}}>\n                    <div style={{fontSize:10,color:'rgba(255,255,255,.4)',textTransform:'uppercase',letterSpacing:'.1em',marginBottom:3}}>{level.title}</div>\n                    <div style={{fontSize:26,fontWeight:800,color:'#fff',lineHeight:1}}>{stats.xp.toLocaleString()}<span style={{fontSize:12,fontWeight:500,color:'rgba(255,255,255,.4)',marginLeft:4}}>XP</span></div>\n                    {nextLvl&&<div style={{fontSize:11,color:'rgba(255,255,255,.3)',marginTop:3}}>→ {(nextLvl.min-stats.xp).toLocaleString()} XP al prossimo livello</div>}\n                    <div style={{display:'flex',gap:16,marginTop:12}}>\n                      {[{v:stats.streak,l:'Streak',icon:'🔥'},{v:stats.coins,l:'Coins',icon:'🪙'},{v:stats.correct,l:'Corrette',icon:'✅'}].map((s,i)=>(\n                        <div key={i}><div style={{fontSize:14,fontWeight:700,color:'#fff'}}>{s.icon} {s.v}</div><div style={{fontSize:9,color:'rgba(255,255,255,.3)',marginTop:1}}>{s.l}</div></div>\n                      ))}\n                    </div>\n                  </div>\n                </div>\n              </div>\n            </div>\n\n            <div style={{maxWidth:600,margin:'0 auto',padding:'20px 20px 100px'}}>\n              {/* Daily Challenge */}\n              {(()=>{\n                const allQs=[...QUESTIONS.bonds,...QUESTIONS.stocks,...QUESTIONS.cfa_fi,...QUESTIONS.derivatives];\n                const seed=new Date().toDateString();\n                let h=0;for(const c of seed)h=(h*31+c.charCodeAt(0))&0x7fffffff;\n                const dq=allQs[h%allQs.length];\n                const todayKey='fl_dc_'+new Date().toDateString()+'_'+(user?.uid||'');\n                const dcDone=localStorage.getItem(todayKey)==='1';\n                return(\n                  <div style={{marginBottom:24}}>\n                    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>\n                      <Ph name=\"star\" size={16} fill style={{color:'#f59e0b'}}/>\n                      <h2 style={{fontSize:15,fontWeight:700,color:'var(--ink)'}}>Sfida del giorno</h2>\n                      {dcDone&&<span style={{marginLeft:'auto',fontSize:11,fontWeight:600,color:'#059669',background:'#ecfdf5',padding:'2px 10px',borderRadius:99}}>✓ Completata</span>}\n                    </div>\n                    <div className=\"card\" style={{padding:'18px 18px',borderLeft:'3px solid #f59e0b'}}>\n                      <p style={{fontSize:14,fontWeight:600,color:'var(--ink)',marginBottom:14,lineHeight:1.5}}>{dq.q}</p>\n                      <div style={{display:'flex',flexDirection:'column',gap:8}}>\n                        {dq.opts.map((opt,i)=>{\n                          const isDone=dcDone;\n                          const isCorrect=i===dq.ans;\n                          return(\n                            <button key={i} disabled={isDone}\n                              onClick={()=>{localStorage.setItem(todayKey,'1');setStats(s=>({...s,xp:s.xp+(i===dq.ans?30:0),coins:s.coins+(i===dq.ans?15:0),correct:s.correct+(i===dq.ans?1:0),quizzes:s.quizzes+1}));}}\n                              style={{padding:'10px 14px',borderRadius:12,border:\"1.5px solid \"+(isDone&&isCorrect?'#059669':isDone&&!isCorrect?'#f1f5f9':'#e2e8f0'),background:isDone&&isCorrect?'#ecfdf5':'#fff',cursor:isDone?'default':'pointer',textAlign:'left',fontSize:13,fontWeight:500,color:isDone&&isCorrect?'#065f46':'var(--ink-2)',fontFamily:'inherit',transition:'all .15s'}}>\n                              <span style={{fontWeight:700,color:isDone&&isCorrect?'#059669':'#94a3b8',marginRight:8}}>{String.fromCharCode(65+i)}</span>{opt}\n                              {isDone&&isCorrect&&<span style={{float:'right',color:'#059669'}}>✓</span>}\n                            </button>\n                          );\n                        })}\n                      </div>\n                      {dcDone&&<p style={{fontSize:12,color:'var(--ink-3)',marginTop:12,lineHeight:1.5,background:'#f8fafc',borderRadius:10,padding:'10px 12px'}}>{dq.exp}</p>}\n                    </div>\n                  </div>\n                );\n              })()}\n\n              {/* Quick Games */}\n              <div style={{marginBottom:24}}>\n                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>\n                  <div style={{display:'flex',alignItems:'center',gap:8}}><Ph name=\"game-controller\" size={16} fill style={{color:'var(--em)'}}/><h2 style={{fontSize:15,fontWeight:700,color:'var(--ink)'}}>Gioca</h2></div>\n                </div>\n                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>\n                  {LESSONS.map(l=>{\n                    const tp=TOPICS[l.topicKey];\n                    return(\n                      <button key={l.id} onClick={()=>startQuiz(tp.questions)} className=\"card lesson-card\"\n                        style={{padding:'16px 14px',border:'none',cursor:'pointer',fontFamily:'inherit',textAlign:'left',position:'relative',overflow:'hidden',borderTop:\"3px solid \"+(tp.color)}}>\n                        <div style={{position:'absolute',top:-16,right:-16,width:60,height:60,borderRadius:'50%',background:tp.colorLight,opacity:.8}}/>\n                        <div style={{fontSize:24,marginBottom:8,position:'relative'}}>{l.topicKey==='alt_investments'?<AltIcon size={26}/>:l.topicKey==='derivatives'?<DerivIcon size={26}/>:l.icon}</div>\n                        <div style={{fontSize:12,fontWeight:700,color:'var(--ink)',lineHeight:1.2,position:'relative'}}>{l.name}</div>\n                        <div style={{fontSize:10,color:'var(--ink-4)',marginTop:3,position:'relative'}}>{tp.questions.length} domande</div>\n                      </button>\n                    );\n                  })}\n                </div>\n              </div>\n\n              {/* Go to Test CFA */}\n              <button onClick={()=>setSection('test')} style={{width:'100%',padding:'18px 20px',borderRadius:20,background:'linear-gradient(135deg,#0d1b3e,#1a3a6e)',border:'none',cursor:'pointer',fontFamily:'inherit',display:'flex',alignItems:'center',gap:14,marginBottom:16}}>\n                <div style={{width:48,height:48,borderRadius:14,background:'rgba(255,255,255,.1)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>\n                  <Ph name=\"exam\" size={26} fill style={{color:'#60a5fa'}}/>\n                </div>\n                <div style={{flex:1,textAlign:'left'}}>\n                  <div style={{fontWeight:700,fontSize:15,color:'#fff'}}>Simulazione Esame CFA</div>\n                  <div style={{fontSize:12,color:'rgba(255,255,255,.45)',marginTop:2}}>Esame cronometrato · storico punteggi</div>\n                </div>\n                <Ph name=\"arrow-right\" size={20} style={{color:'rgba(255,255,255,.4)'}}/>\n              </button>\n            </div>\n          </div>\n        )}\n\n        {/* ── LEARN ────────────────────────────────────────────────── */}        {/* ── LEARN ────────────────────────────────────────────────── */}\n        {section==='learn'&&(\n          <div style={{height:'100%',overflowY:'auto',WebkitOverflowScrolling:'touch'}}>\n            <div style={{background:'#fff',borderBottom:'1px solid var(--border)',padding:'16px 20px',position:'sticky',top:0,zIndex:10,backdropFilter:'blur(16px)'}}>\n              <h1 style={{fontSize:20,fontWeight:800,color:'var(--ink)'}}>Libreria</h1>\n              <p style={{fontSize:12,color:'var(--ink-4)',marginTop:2}}>Seleziona un argomento da studiare</p>\n            </div>\n            <div style={{maxWidth:600,margin:'0 auto',padding:'20px 20px 100px'}}>\n              {LESSONS.map((l,i)=>{\n                const tp=TOPICS[l.topicKey];\n                return(\n                  <button key={l.id} onClick={()=>{setTopic(l.topicKey);setLibTab('teoria');setCardIdx(0);setFlipped(false);}}\n                    className=\"card lesson-card\" style={{width:'100%',padding:0,marginBottom:14,border:'none',cursor:'pointer',fontFamily:'inherit',overflow:'hidden',display:'block',textAlign:'left'}}>\n                    {/* Color bar */}\n                    <div style={{height:4,background:l.gradient}}/>\n                    <div style={{padding:'18px 20px',display:'flex',gap:14,alignItems:'center'}}>\n                      <div style={{width:52,height:52,borderRadius:16,background:tp.colorLight,display:'flex',alignItems:'center',justifyContent:'center',fontSize:26,flexShrink:0}}>{l.topicKey==='alt_investments'?<AltIcon size={32} style={{borderRadius:8}}/>:l.icon}</div>\n                      <div style={{flex:1}}>\n                        <div style={{fontWeight:700,fontSize:16,color:'var(--ink)'}}>{l.name}</div>\n                        <div style={{fontSize:12,color:'var(--ink-4)',marginTop:3}}>{tp.time} · {tp.cards.length} card · {tp.questions.length} quiz</div>\n                        <div style={{display:'flex',gap:6,marginTop:8}}>\n                          {['card','formule','quiz'].map(t=>(\n                            <span key={t} className=\"badge\" style={{background:tp.colorLight,color:tp.color,fontSize:10}}>{t}</span>\n                          ))}\n                        </div>\n                      </div>\n                      <IChevR style={{color:'var(--ink-4)',flexShrink:0}}/>\n                    </div>\n                  </button>\n                );\n              })}\n            </div>\n          </div>\n        )}\n\n        {/* ── TEST CFA ─────────────────────────────────────────────── */}\n        {section==='test'&&<TestCFA user={user} stats={stats} setStats={setStats} setSection={setSection}/>}\n\n        {/* ── CHAT ─────────────────────────────────────────────────── */}        {/* ── CHAT ─────────────────────────────────────────────────── */}        {/* ── CHAT ─────────────────────────────────────────────────── */}\n        {section==='chat'&&(\n          <div style={{height:'100%',position:'relative'}}>\n            <ErrorBoundary><ChatPanel user={user} chats={chats} setChats={setChats} activeChatId={activeChatId} setActiveChatId={setActiveChatId}/></ErrorBoundary>\n          </div>\n        )}\n\n        {/* ── PROFILE ──────────────────────────────────────────────── */}\n        {section==='profile'&&(\n          <div style={{height:'100%',overflowY:'auto',WebkitOverflowScrolling:'touch'}}>\n            {/* Profile hero */}\n            <div style={{background:'linear-gradient(160deg,#0d1b3e,#0a0f1e)',padding:'32px 20px 28px'}}>\n              <div style={{maxWidth:600,margin:'0 auto',textAlign:'center'}}>\n                <div style={{width:80,height:80,borderRadius:22,overflow:'hidden',margin:'0 auto 14px',boxShadow:'0 16px 40px rgba(15,32,68,.4)'}}><img src={LOGO_B64} style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}} alt=\"FinLearn\"/></div>\n                <h1 style={{fontFamily:\"'DM Serif Display',Georgia,serif\",fontSize:26,color:'#fff',marginBottom:4}}>{user.displayName}</h1>\n                <p style={{color:'rgba(255,255,255,.35)',fontSize:12}}>{user.email}</p>\n                <div style={{display:'inline-flex',alignItems:'center',gap:6,marginTop:12,background:'rgba(255,255,255,.07)',border:'1px solid rgba(255,255,255,.1)',borderRadius:99,padding:'6px 14px'}}>\n                  <span style={{fontSize:14}}>{level.name.split(' ')[0]}</span>\n                  <span style={{fontSize:12,color:'rgba(255,255,255,.6)',fontWeight:600}}>{level.title}</span>\n                </div>\n              </div>\n            </div>\n\n            <div style={{maxWidth:600,margin:'0 auto',padding:'20px 20px 100px'}}>\n              {/* Stats grid */}\n              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:28}}>\n                {[\n                  {icon:'⚡',v:stats.xp.toLocaleString(),l:'Punti XP',c:'#f59e0b'},\n                  {icon:'🪙',v:stats.coins,l:'Coins',c:'#fbbf24'},\n                  {icon:'🔥',v:stats.streak,l:'Streak',c:'#ef4444'},\n                  {icon:'✅',v:stats.correct,l:'Risposte corrette',c:'#059669'},\n                  {icon:'📝',v:stats.quizzes,l:'Quiz completati',c:'#8b5cf6'},\n                  {icon:'🏆',v:stats.bestStreak,l:'Streak record',c:'#d97706'},\n                ].map((s,i)=>(\n                  <div key={i} className=\"card\" style={{padding:'18px 16px',textAlign:'center',animationDelay:(i*.05)+\"s\"}}>\n                    <div style={{fontSize:28,marginBottom:8}}>{s.icon}</div>\n                    <div style={{fontSize:24,fontWeight:800,color:s.c}}>{s.v}</div>\n                    <div style={{fontSize:11,color:'var(--ink-4)',marginTop:4}}>{s.l}</div>\n                  </div>\n                ))}\n              </div>\n\n              {/* Settings */}\n              <div className=\"card\" style={{padding:'6px 0',marginBottom:16}}>\n                <div style={{padding:'14px 20px',borderBottom:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>\n                  <div>\n                    <div style={{fontWeight:600,fontSize:14,color:'var(--ink)'}}>Timer quiz</div>\n                    <div style={{fontSize:12,color:'var(--ink-4)',marginTop:2}}>Abilita conto alla rovescia</div>\n                  </div>\n                  <div onClick={()=>setTimerOn(!timerOn)} style={{width:46,height:26,borderRadius:13,background:timerOn?'var(--em)':'#e2e8f0',cursor:'pointer',position:'relative',transition:'background .2s'}}>\n                    <div style={{position:'absolute',width:22,height:22,borderRadius:'50%',background:'#fff',top:2,left:timerOn?22:2,transition:'left .2s',boxShadow:'0 2px 6px rgba(0,0,0,.15)'}}/>\n                  </div>\n                </div>\n                <button onClick={()=>setShowCalc(true)} style={{width:'100%',padding:'14px 20px',background:'transparent',border:'none',fontFamily:'inherit',cursor:'pointer',display:'flex',alignItems:'center',gap:12,color:'var(--ink)',borderBottom:'1px solid var(--border)'}}>\n                  <ICalc size={18} style={{color:'var(--ink-3)'}}/>\n                  <span style={{fontWeight:600,fontSize:14}}>Calcolatrice TI BA II+</span>\n                  <IChevR size={16} style={{color:'var(--ink-4)',marginLeft:'auto'}}/>\n                </button>\n                <button onClick={onLogout} style={{width:'100%',padding:'14px 20px',background:'transparent',border:'none',fontFamily:'inherit',cursor:'pointer',display:'flex',alignItems:'center',gap:12,color:'#ef4444'}}>\n                  <ILogOut size={18} style={{color:'#ef4444'}}/>\n                  <span style={{fontWeight:600,fontSize:14}}>Esci</span>\n                </button>\n              </div>\n            </div>\n          </div>\n        )}\n      </div>\n\n      {/* Bottom Nav */}\n      <div className=\"bottom-nav\" style={{flexShrink:0,paddingBottom:'env(safe-area-inset-bottom,0px)'}}>\n        <div style={{display:'flex',maxWidth:500,margin:'0 auto',padding:'8px 12px 6px'}}>\n          {navItems.map(it=>{\n            const active=section===it.id;\n            return(\n              <button key={it.id} onClick={()=>setSection(it.id)} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:3,background:'transparent',border:'none',cursor:'pointer',padding:'4px 0',transition:'all .15s'}}>\n                <div style={{width:42,height:32,borderRadius:12,display:'flex',alignItems:'center',justifyContent:'center',background:active?'#ecfdf5':'transparent',transition:'all .2s',color:active?'var(--em)':'var(--ink-4)'}}>\n                  {it.icon(active)}\n                </div>\n                <span style={{fontSize:10,fontWeight:active?700:500,color:active?'var(--em)':'var(--ink-4)',transition:'all .15s'}}>{it.label}</span>\n              </button>\n            );\n          })}\n        </div>\n      </div>\n\n      {showCalc&&<Calculator onClose={()=>setShowCalc(false)}/>}\n    </div>\n  );\n}\n\n// ─── ROOT ─────────────────────────────────────────────────────────────────────\nfunction Root() {\n  const [showSplash,setShowSplash]=useState(true);\n  const [user,setUser]=useState(null);\n  const [userData,setUserData]=useState(null);\n  const [checking,setChecking]=useState(true);\n\n  useEffect(()=>{\n    mockAuth.onAuthStateChanged(u=>{\n      if(u){const d=mockDb.get(u.uid)||defaultData();setUser(u);setUserData(d);}\n      setChecking(false);\n    });\n  },[]);\n\n  if(showSplash)return<Splash onComplete={()=>setShowSplash(false)}/>;\n  if(checking)return<div style={{height:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#f8fafc'}}><div style={{width:32,height:32,border:'3px solid #e2e8f0',borderTopColor:'var(--em)',borderRadius:'50%',animation:'spin .7s linear infinite'}}/></div>;\n  if(!user)return<Auth onAuth={(u,d)=>{setUser(u);setUserData(d);}}/>;\n\n  return<App user={user} userData={userData}/>;\n}\n\nReactDOM.createRoot(document.getElementById('root')).render(<Root/>);\n\n\n";
  function runApp() {
    try {
      var compiled = Babel.transform(sourceCode, {presets: ['react'], compact: false}).code;
      var fn = new Function('React', 'ReactDOM', compiled);
      fn(React, ReactDOM);
    } catch(e) {
      console.error('App error:', e.message, e.stack);

    }
  }
  if(typeof Babel !== 'undefined' && typeof React !== 'undefined') {
    runApp();

    window.addEventListener('load', runApp);

})();
