                     <circle cx={48} cy={48} r={38} fill=\"none\" stroke=\"rgba(255,255,255,.07)\" strokeWidth={6}/>\n                      <circle cx={48} cy={48} r={38} fill=\"none\" stroke=\"url(#xpG)\" strokeWidth={6} strokeLinecap=\"round\"\n                        strokeDasharray={String(2*Math.PI*38*xpPct)+' '+String(2*Math.PI*38)} style={{transition:'stroke-dasharray .6s ease'}}/>\n                      <defs><linearGradient id=\"xpG\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\"><stop stopColor=\"#34d399\"/><stop offset=\"1\" stopColor=\"#f59e0b\"/></linearGradient></defs>\n                    </svg>\n                    <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center'}}>\n                      <img src={LOGO_B64} style={{width:40,height:40,borderRadius:10,objectFit:'cover'}} alt=\"\"/>\n                    </div>\n                  </div>\n                  <div style={{flex:1}}>\n                    <div style={{fontSize:10,color:'rgba(255,255,255,.4)',textTransform:'uppercase',letterSpacing:'.1em',marginBottom:3}}>{level.title}</div>\n                    <div style={{fontSize:26,fontWeight:800,color:'#fff',lineHeight:1}}>{stats.xp.toLocaleString()}<span style={{fontSize:12,fontWeight:500,color:'rgba(255,255,255,.4)',marginLeft:4}}>XP</span></div>\n                    {nextLvl&&<div style={{fontSize:11,color:'rgba(255,255,255,.3)',marginTop:3}}>→ {(nextLvl.min-stats.xp).toLocaleString()} XP al prossimo livello</div>}\n                    <div style={{display:'flex',gap:16,marginTop:12}}>\n                      {[{v:stats.streak,l:'Streak',icon:'🔥'},{v:stats.coins,l:'Coins',icon:'🪙'},{v:stats.correct,l:'Corrette',icon:'✅'}].map((s,i)=>(\n                        <div key={i}><div style={{fontSize:14,fontWeight:700,color:'#fff'}}>{s.icon} {s.v}</div><div style={{fontSize:9,color:'rgba(255,255,255,.3)',marginTop:1}}>{s.l}</div></div>\n                      ))}\n                    </div>\n                  </div>\n                </div>\n              </div>\n            </div>\n\n            <div style={{maxWidth:600,margin:'0 auto',padding:'20px 20px 100px'}}>\n              {/* Daily Challenge */}\n              {(()=>{\n                const allQs=[...QUESTIONS.bonds,...QUESTIONS.stocks,...QUESTIONS.cfa_fi,...QUESTIONS.derivatives];\n                const seed=new Date().toDateString();\n                let h=0;for(const c of seed)h=(h*31+c.charCodeAt(0))&0x7fffffff;\n                const dq=allQs[h%allQs.length];\n                const todayKey='fl_dc_'+new Date().toDateString()+'_'+(user?.uid||'');\n                const dcDone=localStorage.getItem(todayKey)==='1';\n                return(\n                  <div style={{marginBottom:24}}>\n                    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>\n                      <Ph name=\"star\" size={16} fill style={{color:'#f59e0b'}}/>\n                      <h2 style={{fontSize:15,fontWeight:700,color:'var(--ink)'}}>Sfida del giorno</h2>\n                      {dcDone&&<span style={{marginLeft:'auto',fontSize:11,fontWeight:600,color:'#059669',background:'#ecfdf5',padding:'2px 10px',borderRadius:99}}>✓ Completata</span>}\n                    </div>\n                    <div className=\"card\" style={{padding:'18px 18px',borderLeft:'3px solid #f59e0b'}}>\n                      <p style={{fontSize:14,fontWeight:600,color:'var(--ink)',marginBottom:14,lineHeight:1.5}}>{dq.q}</p>\n                      <div style={{display:'flex',flexDirection:'column',gap:8}}>\n                        {dq.opts.map((opt,i)=>{\n                          const isDone=dcDone;\n                          const isCorrect=i===dq.ans;\n                          return(\n                            <button key={i} disabled={isDone}\n                              onClick={()=>{localStorage.setItem(todayKey,'1');setStats(s=>({...s,xp:s.xp+(i===dq.ans?30:0),coins:s.coins+(i===dq.ans?15:0),correct:s.correct+(i===dq.ans?1:0),quizzes:s.quizzes+1}));}}\n                              style={{padding:'10px 14px',borderRadius:12,border:\"1.5px solid \"+(isDone&&isCorrect?'#059669':isDone&&!isCorrect?'#f1f5f9':'#e2e8f0'),background:isDone&&isCorrect?'#ecfdf5':'#fff',cursor:isDone?'default':'pointer',textAlign:'left',fontSize:13,fontWeight:500,color:isDone&&isCorrect?'#065f46':'var(--ink-2)',fontFamily:'inherit',transition:'all .15s'}}>\n                              <span style={{fontWeight:700,color:isDone&&isCorrect?'#059669':'#94a3b8',marginRight:8}}>{String.fromCharCode(65+i)}</span>{opt}\n                              {isDone&&isCorrect&&<span style={{float:'right',color:'#059669'}}>✓</span>}\n                            </button>\n                          );\n                        })}\n                      </div>\n                      {dcDone&&<p style={{fontSize:12,color:'var(--ink-3)',marginTop:12,lineHeight:1.5,background:'#f8fafc',borderRadius:10,padding:'10px 12px'}}>{dq.exp}</p>}\n                    </div>\n                  </div>\n                );\n              })()}\n\n              {/* Quick Games */}\n              <div style={{marginBottom:24}}>\n                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>\n                  <div style={{display:'flex',alignItems:'center',gap:8}}><Ph name=\"game-controller\" size={16} fill style={{color:'var(--em)'}}/><h2 style={{fontSize:15,fontWeight:700,color:'var(--ink)'}}>Gioca</h2></div>\n                </div>\n                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>\n                  {LESSONS.map(l=>{\n                    const tp=TOPICS[l.topicKey];\n                    return(\n                      <button key={l.id} onClick={()=>startQuiz(tp.questions)} className=\"card lesson-card\"\n                        style={{padding:'16px 14px',border:'none',cursor:'pointer',fontFamily:'inherit',textAlign:'left',position:'relative',overflow:'hidden',borderTop:\"3px solid \"+(tp.color)}}>\n                        <div style={{position:'absolute',top:-16,right:-16,width:60,height:60,borderRadius:'50%',background:tp.colorLight,opacity:.8}}/>\n                        <div style={{fontSize:24,marginBottom:8,position:'relative'}}>{l.topicKey==='alt_investments'?<AltIcon size={26}/>:l.icon}</div>\n                        <div style={{fontSize:12,fontWeight:700,color:'var(--ink)',lineHeight:1.2,position:'relative'}}>{l.name}</div>\n                        <div style={{fontSize:10,color:'var(--ink-4)',marginTop:3,position:'relative'}}>{tp.questions.length} domande</div>\n                      </button>\n                    );\n                  })}\n                </div>\n              </div>\n\n              {/* Go to Test CFA */}\n              <button onClick={()=>setSection('test')} style={{width:'100%',padding:'18px 20px',borderRadius:20,background:'linear-gradient(135deg,#0d1b3e,#1a3a6e)',border:'none',cursor:'pointer',fontFamily:'inherit',display:'flex',alignItems:'center',gap:14,marginBottom:16}}>\n                <div style={{width:48,height:48,borderRadius:14,background:'rgba(255,255,255,.1)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>\n                  <Ph name=\"exam\" size={26} fill style={{color:'#60a5fa'}}/>\n                </div>\n                <div style={{flex:1,textAlign:'left'}}>\n                  <div style={{fontWeight:700,fontSize:15,color:'#fff'}}>Simulazione Esame CFA</div>\n                  <div style={{fontSize:12,color:'rgba(255,255,255,.45)',marginTop:2}}>Esame cronometrato · storico punteggi</div>\n                </div>\n                <Ph name=\"arrow-right\" size={20} style={{color:'rgba(255,255,255,.4)'}}/>\n              </button>\n            </div>\n          </div>\n        )}\n\n        {/* ── LEARN ────────────────────────────────────────────────── */}        {/* ── LEARN ────────────────────────────────────────────────── */}\n        {section==='learn'&&(\n          <div style={{height:'100%',overflowY:'auto',WebkitOverflowScrolling:'touch'}}>\n            <div style={{background:'#fff',borderBottom:'1px solid var(--border)',padding:'16px 20px',position:'sticky',top:0,zIndex:10,backdropFilter:'blur(16px)'}}>\n              <h1 style={{fontSize:20,fontWeight:800,color:'var(--ink)'}}>Libreria</h1>\n              <p style={{fontSize:12,color:'var(--ink-4)',marginTop:2}}>Seleziona un argomento da studiare</p>\n            </div>\n            <div style={{maxWidth:600,margin:'0 auto',padding:'20px 20px 100px'}}>\n              {LESSONS.map((l,i)=>{\n                const tp=TOPICS[l.topicKey];\n                return(\n                  <button key={l.id} onClick={()=>{setTopic(l.topicKey);setLibTab('teoria');setCardIdx(0);setFlipped(false);}}\n                    className=\"card lesson-card\" style={{width:'100%',padding:0,marginBottom:14,border:'none',cursor:'pointer',fontFamily:'inherit',overflow:'hidden',display:'block',textAlign:'left'}}>\n                    {/* Color bar */}\n                    <div style={{height:4,background:l.gradient}}/>\n                    <div style={{padding:'18px 20px',display:'flex',gap:14,alignItems:'center'}}>\n                      <div style={{width:52,height:52,borderRadius:16,background:tp.colorLight,display:'flex',alignItems:'center',justifyContent:'center',fontSize:26,flexShrink:0}}>{l.topicKey==='alt_investments'?<AltIcon size={32} style={{borderRadius:8}}/>:l.icon}</div>\n                      <div style={{flex:1}}>\n                        <div style={{fontWeight:700,fontSize:16,color:'var(--ink)'}}>{l.name}</div>\n                        <div style={{fontSize:12,color:'var(--ink-4)',marginTop:3}}>{tp.time} · {tp.cards.length} card · {tp.questions.length} quiz</div>\n                        <div style={{display:'flex',gap:6,marginTop:8}}>\n                          {['card','formule','quiz'].map(t=>(\n                            <span key={t} className=\"badge\" style={{background:tp.colorLight,color:tp.color,fontSize:10}}>{t}</span>\n                          ))}\n                        </div>\n                      </div>\n                      <IChevR style={{color:'var(--ink-4)',flexShrink:0}}/>\n                    </div>\n                  </button>\n                );\n              })}\n            </div>\n          </div>\n        )}\n\n        {/* ── TEST CFA ─────────────────────────────────────────────── */}\n        {section==='test'&&<TestCFA user={user} stats={stats} setStats={setStats} setSection={setSection}/>}\n\n        {/* ── CHAT ─────────────────────────────────────────────────── */}        {/* ── CHAT ─────────────────────────────────────────────────── */}        {/* ── CHAT ─────────────────────────────────────────────────── */}\n        {section==='chat'&&(\n          <div style={{height:'100%',position:'relative'}}>\n            <ChatPanel user={user} chats={chats} setChats={setChats} activeChatId={activeChatId} setActiveChatId={setActiveChatId}/>\n          </div>\n        )}\n\n        {/* ── PROFILE ──────────────────────────────────────────────── */}\n        {section==='profile'&&(\n          <div style={{height:'100%',overflowY:'auto',WebkitOverflowScrolling:'touch'}}>\n            {/* Profile hero */}\n            <div style={{background:'linear-gradient(160deg,#0d1b3e,#0a0f1e)',padding:'32px 20px 28px'}}>\n              <div style={{maxWidth:600,margin:'0 auto',textAlign:'center'}}>\n                <div style={{width:80,height:80,borderRadius:22,overflow:'hidden',margin:'0 auto 14px',boxShadow:'0 16px 40px rgba(15,32,68,.4)'}}><img src={LOGO_B64} style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}} alt=\"CFALearn\"/></div>\n                <h1 style={{fontFamily:\"'DM Serif Display',Georgia,serif\",fontSize:26,color:'#fff',marginBottom:4}}>{user.displayName}</h1>\n                <p style={{color:'rgba(255,255,255,.35)',fontSize:12}}>{user.email}</p>\n                <div style={{display:'inline-flex',alignItems:'center',gap:6,marginTop:12,background:'rgba(255,255,255,.07)',border:'1px solid rgba(255,255,255,.1)',borderRadius:99,padding:'6px 14px'}}>\n                  <span style={{fontSize:14}}>{level.name.split(' ')[0]}</span>\n                  <span style={{fontSize:12,color:'rgba(255,255,255,.6)',fontWeight:600}}>{level.title}</span>\n                </div>\n              </div>\n            </div>\n\n            <div style={{maxWidth:600,margin:'0 auto',padding:'20px 20px 100px'}}>\n              {/* Stats grid */}\n              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:28}}>\n                {[\n                  {icon:'⚡',v:stats.xp.toLocaleString(),l:'Punti XP',c:'#f59e0b'},\n                  {icon:'🪙',v:stats.coins,l:'Coins',c:'#fbbf24'},\n                  {icon:'🔥',v:stats.streak,l:'Streak',c:'#ef4444'},\n                  {icon:'✅',v:stats.correct,l:'Risposte corrette',c:'#059669'},\n                  {icon:'📝',v:stats.quizzes,l:'Quiz completati',c:'#8b5cf6'},\n                  {icon:'🏆',v:stats.bestStreak,l:'Streak record',c:'#d97706'},\n                ].map((s,i)=>(\n                  <div key={i} className=\"card\" style={{padding:'18px 16px',textAlign:'center',animationDelay:(i*.05)+\"s\"}}>\n                    <div style={{fontSize:28,marginBottom:8}}>{s.icon}</div>\n                    <div style={{fontSize:24,fontWeight:800,color:s.c}}>{s.v}</div>\n                    <div style={{fontSize:11,color:'var(--ink-4)',marginTop:4}}>{s.l}</div>\n                  </div>\n                ))}\n              </div>\n\n              {/* Settings */}\n              <div className=\"card\" style={{padding:'6px 0',marginBottom:16}}>\n                <div style={{padding:'14px 20px',borderBottom:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>\n                  <div>\n                    <div style={{fontWeight:600,fontSize:14,color:'var(--ink)'}}>Timer quiz</div>\n                    <div style={{fontSize:12,color:'var(--ink-4)',marginTop:2}}>Abilita conto alla rovescia</div>\n                  </div>\n                  <div onClick={()=>setTimerOn(!timerOn)} style={{width:46,height:26,borderRadius:13,background:timerOn?'var(--em)':'#e2e8f0',cursor:'pointer',position:'relative',transition:'background .2s'}}>\n                    <div style={{position:'absolute',width:22,height:22,borderRadius:'50%',background:'#fff',top:2,left:timerOn?22:2,transition:'left .2s',boxShadow:'0 2px 6px rgba(0,0,0,.15)'}}/>\n                  </div>\n                </div>\n                <button onClick={()=>setShowCalc(true)} style={{width:'100%',padding:'14px 20px',background:'transparent',border:'none',fontFamily:'inherit',cursor:'pointer',display:'flex',alignItems:'center',gap:12,color:'var(--ink)',borderBottom:'1px solid var(--border)'}}>\n                  <ICalc size={18} style={{color:'var(--ink-3)'}}/>\n                  <span style={{fontWeight:600,fontSize:14}}>Calcolatrice TI BA II+</span>\n                  <IChevR size={16} style={{color:'var(--ink-4)',marginLeft:'auto'}}/>\n                </button>\n                <button onClick={onLogout} style={{width:'100%',padding:'14px 20px',background:'transparent',border:'none',fontFamily:'inherit',cursor:'pointer',display:'flex',alignItems:'center',gap:12,color:'#ef4444'}}>\n                  <ILogOut size={18} style={{color:'#ef4444'}}/>\n                  <span style={{fontWeight:600,fontSize:14}}>Esci</span>\n                </button>\n              </div>\n            </div>\n          </div>\n        )}\n      </div>\n\n      {/* Bottom Nav */}\n      <div className=\"bottom-nav\" style={{flexShrink:0,paddingBottom:'env(safe-area-inset-bottom,0px)'}}>\n        <div style={{display:'flex',maxWidth:500,margin:'0 auto',padding:'8px 12px 6px'}}>\n          {navItems.map(it=>{\n            const active=section===it.id;\n            return(\n              <button key={it.id} onClick={()=>setSection(it.id)} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:3,background:'transparent',border:'none',cursor:'pointer',padding:'4px 0',transition:'all .15s'}}>\n                <div style={{width:42,height:32,borderRadius:12,display:'flex',alignItems:'center',justifyContent:'center',background:active?'#ecfdf5':'transparent',transition:'all .2s',color:active?'var(--em)':'var(--ink-4)'}}>\n                  {it.icon(active)}\n                </div>\n                <span style={{fontSize:10,fontWeight:active?700:500,color:active?'var(--em)':'var(--ink-4)',transition:'all .15s'}}>{it.label}</span>\n              </button>\n            );\n          })}\n        </div>\n      </div>\n\n      {showCalc&&<Calculator onClose={()=>setShowCalc(false)}/>}\n        {showQuizAI&&<QuizAI question={quizQs&&quizQs[quizIdx]} onClose={()=>setShowQuizAI(false)}/>}\n    </div>\n  );\n}\n\n// ─── ROOT ─────────────────────────────────────────────────────────────────────\nfunction Root() {\n  const [showSplash,setShowSplash]=useState(true);\n  const [user,setUser]=useState(null);\n  const [userData,setUserData]=useState(null);\n  const [checking,setChecking]=useState(true);\n\n  useEffect(()=>{\n    mockAuth.onAuthStateChanged(u=>{\n      if(u){const d=mockDb.get(u.uid)||defaultData();setUser(u);setUserData(d);}\n      setChecking(false);\n    });\n  },[]);\n\n  if(showSplash)return<Splash onComplete={()=>setShowSplash(false)}/>;\n  if(checking)return<div style={{height:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#f8fafc'}}><div style={{width:32,height:32,border:'3px solid #e2e8f0',borderTopColor:'var(--em)',borderRadius:'50%',animation:'spin .7s linear infinite'}}/></div>;\n  if(!user)return<Auth onAuth={(u,d)=>{setUser(u);setUserData(d);}}/>;\n\n  return<App user={user} userData={userData}/>;\n}\n\nReactDOM.createRoot(document.getElementById('root')).render(<Root/>);\n\n\n";
  function runApp() {
    try {
      var compiled = Babel.transform(sourceCode, {presets: ['react'], compact: false}).code;
      var fn = new Function('React', 'ReactDOM', compiled);
      fn(React, ReactDOM);
    } catch(e) {
      console.error('App error:', e.message, e.stack);
      document.getElementById('root').innerHTML = '<div style="color:red;padding:20px">Error: ' + e.message + '</div>';
    }
  }
  if(typeof Babel !== 'undefined' && typeof React !== 'undefined') {
    runApp();
  } else {
    document.addEventListener('DOMContentLoaded', runApp);
    window.addEventListener('load', runApp);
  }
})();
</script>
