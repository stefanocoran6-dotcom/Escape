<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --em: #059669; --em-d: #065f46; --em-l: #d1fae5; --em-2: #34d399;
    --am: #f59e0b; --am-d: #d97706; --am-l: #fef3c7;
    --ink: #0f172a; --ink-2: #334155; --ink-3: #64748b; --ink-4: #94a3b8;
    --bg: #f1f5f9; --card: #ffffff; --border: rgba(15,23,42,.07);
    --shadow-sm: 0 1px 3px rgba(15,23,42,.08), 0 1px 2px rgba(15,23,42,.04);
    --shadow: 0 4px 16px rgba(15,23,42,.08), 0 1px 4px rgba(15,23,42,.04);
    --shadow-lg: 0 16px 48px rgba(15,23,42,.12), 0 4px 12px rgba(15,23,42,.06);
    --r: 16px; --r-sm: 10px; --r-lg: 24px;
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body { background: var(--bg); overflow: hidden; height: 100vh; }
  #root { height: 100vh; display: flex; flex-direction: column; }

  /* Typography */
  .serif { font-family: 'DM Serif Display', Georgia, serif; }

  /* Scrollbars */
  ::-webkit-scrollbar { width: 0; height: 0; }

  /* Animations */
  @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes scaleIn { from { opacity:0; transform:scale(.96); } to { opacity:1; transform:scale(1); } }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes pulse-glow { 0%,100% { box-shadow:0 0 0 0 rgba(5,150,105,.4); } 50% { box-shadow:0 0 0 12px rgba(5,150,105,0); } }
  @keyframes bounce-dot { 0%,80%,100% { transform:translateY(0); } 40% { transform:translateY(-6px); } }

  .anim-up { animation: fadeUp .4s cubic-bezier(.22,.68,0,1.2) both; }
  .anim-in { animation: fadeIn .3s ease both; }
  .anim-scale { animation: scaleIn .3s cubic-bezier(.22,.68,0,1.2) both; }

  /* Cards */
  .card { background:var(--card); border-radius:var(--r); box-shadow:var(--shadow); border:1px solid var(--border); }
  .card-sm { background:var(--card); border-radius:var(--r-sm); box-shadow:var(--shadow-sm); border:1px solid var(--border); }

  /* Buttons */
  .btn-primary { background:linear-gradient(135deg,#059669,#0d9488); color:#fff; border:none; font-weight:700; cursor:pointer; transition:all .18s; }
  .btn-primary:hover { filter:brightness(1.08); transform:translateY(-1px); box-shadow:0 8px 24px rgba(5,150,105,.35); }
  .btn-primary:active { transform:translateY(0); filter:brightness(.97); }
  .btn-ghost { background:transparent; border:1.5px solid var(--border); color:var(--ink-2); font-weight:600; cursor:pointer; transition:all .18s; }
  .btn-ghost:hover { background:var(--bg); border-color:var(--em); color:var(--em); }

  /* Badge */
  .badge { display:inline-flex; align-items:center; padding:3px 10px; border-radius:99px; font-size:11px; font-weight:700; letter-spacing:.02em; }

  /* Bottom nav */
  .bottom-nav { background:rgba(255,255,255,.92); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-top:1px solid var(--border); }

  /* Input */
  .input { width:100%; padding:13px 16px; background:#f8fafc; border:1.5px solid #e2e8f0; border-radius:12px; font-size:15px; font-family:inherit; color:var(--ink); transition:all .18s; outline:none; }
  .input:focus { border-color:var(--em); background:#fff; box-shadow:0 0 0 3px rgba(5,150,105,.1); }
  .input::placeholder { color:var(--ink-4); }

  /* Pill tab */
  .pill-tab { display:flex; background:#f1f5f9; border-radius:12px; padding:4px; gap:4px; }
  .pill-tab-item { flex:1; padding:9px 12px; border-radius:9px; border:none; background:transparent; font-family:inherit; font-size:13px; font-weight:600; color:var(--ink-3); cursor:pointer; transition:all .2s; }
  .pill-tab-item.active { background:#fff; color:var(--em); box-shadow:0 2px 8px rgba(15,23,42,.08); }

  /* XP ring */
  .xp-ring { transform:rotate(-90deg); }

  /* Lesson card hover */
  .lesson-card { transition:transform .2s, box-shadow .2s; }
  .lesson-card:hover { transform:translateY(-2px); box-shadow:var(--shadow-lg); }

  /* Option button */
  .option-btn { width:100%; border:1.5px solid #e2e8f0; border-radius:14px; background:#fff; text-align:left; cursor:pointer; transition:all .18s; }
  .option-btn:hover:not(:disabled) { border-color:var(--em); background:#f0fdf8; }
  .option-btn.selected { border-color:var(--em); background:#f0fdf8; }
  .option-btn.correct { border-color:#059669; background:#ecfdf5; }
  .option-btn.wrong { border-color:#ef4444; background:#fef2f2; }
  .option-btn.dimmed { border-color:#f1f5f9; background:#fafafa; opacity:.45; }

  /* Flashcard flip */
  .flip-card { perspective:1000px; }
  .flip-inner { transition:transform .45s cubic-bezier(.4,0,.2,1); transform-style:preserve-3d; }
  .flip-inner.flipped { transform:rotateY(180deg); }
  .flip-front, .flip-back { backface-visibility:hidden; -webkit-backface-visibility:hidden; }
  .flip-back { transform:rotateY(180deg); }

  /* Deep dive iframe */
  .deep-iframe { border:none; width:100%; height:100%; display:block; }

  /* Chat bubble */
  .bubble-ai { background:#f1f5f9; border-radius:4px 18px 18px 18px; }
  .bubble-user { background:linear-gradient(135deg,#059669,#0d9488); border-radius:18px 4px 18px 18px; color:#fff; }

  /* Streak flame */
  @keyframes flicker { 0%,100%{transform:scaleY(1) scaleX(1);} 25%{transform:scaleY(1.04) scaleX(.98);} 75%{transform:scaleY(.97) scaleX(1.02);} }
  .flame { animation:flicker 1.8s ease-in-out infinite; display:inline-block; }

  /* Calculator */
  .calc-btn { display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:10px; font-weight:700; transition:all .12s; cursor:pointer; border:none; user-select:none; height:40px; font-family:inherit; }
  .calc-btn:active { transform:scale(.93); }
</style>

  var sourceCode = "\n\n\n\nconst { useState, useEffect, useRef, useCallback, useMemo } = React;\n\n// ─── PHOSPHOR ICON HELPER ──────────────────────────────────────────────────────\n// ph-* = regular, ph-fill ph-* = filled, ph-duotone ph-* = duotone\nconst Ph = ({ name, size=22, fill=false, duotone=false, style={}, className='' }) => (\n  <i className={(duotone?'ph-duotone ':fill?'ph-fill ':'')+' ph-'+name+(className?' '+className:'')}\n     style={{fontSize:size, lineHeight:1, display:'inline-flex', alignItems:'center', ...style}}/>\n);\n// Aliases used throughout\nconst IHome   = ({active,size=22}) => <Ph name=\"house\"            size={size} fill={!!active}/>;\nconst IBook   = ({active,size=22}) => <Ph name=\"books\"            size={size} fill={!!active}/>;\nconst IChat   = ({active,size=22}) => <Ph name=\"chat-circle-dots\" size={size} fill={!!active}/>;\nconst IUser   = ({active,size=22}) => <Ph name=\"user-circle\"      size={size} fill={!!active}/>;\nconst ICheck  = ({size=18,style})  => <Ph name=\"check-circle\"     size={size} fill style={style}/>;\nconst IX      = ({size=18,style,onClick}) => <Ph name=\"x-circle\"  size={size} fill style={{cursor:onClick?'pointer':'default',...style}} onClick={onClick}/>;\nconst ISend   = ({size=18})        => <Ph name=\"paper-plane-tilt\" size={size} fill/>;\nconst IChevL  = ({size=20})        => <Ph name=\"caret-left\"       size={size} fill/>;\nconst IChevR  = ({size=20,style})  => <Ph name=\"caret-right\"      size={size} fill style={style}/>;\nconst ICalc   = ({size=20})        => <Ph name=\"calculator\"       size={size} duotone/>;\nconst ISpark  = ({size=18,style})  => <Ph name=\"sparkle\"          size={size} fill style={style}/>;\nconst IPlus   = ({size=18})        => <Ph name=\"plus-circle\"      size={size} fill/>;\nconst ITrash  = ({size=16})        => <Ph name=\"trash\"            size={size} fill/>;\nconst IClock  = ({size=18})        => <Ph name=\"clock-countdown\"  size={size} duotone/>;\nconst IRefresh= ({size=18})        => <Ph name=\"arrow-counter-clockwise\" size={size}/>;\nconst IMail   = ({size=18})        => <Ph name=\"envelope-simple\"  size={size} fill/>;\nconst ILock   = ({size=18})        => <Ph name=\"lock-simple\"      size={size} fill/>;\nconst IEye    = ({size=18})        => <Ph name=\"eye\"              size={size} fill/>;\nconst IEyeOff = ({size=18})        => <Ph name=\"eye-slash\"        size={size} fill/>;\nconst IAlert  = ({size=18})        => <Ph name=\"warning-circle\"   size={size} fill/>;\nconst ILogOut = ({size=18})        => <Ph name=\"sign-out\"         size={size} fill/>;\nconst ITarget = ({size=18})        => <Ph name=\"target\"           size={size} fill/>;\nconst IZap    = ({size=18})        => <Ph name=\"lightning\"        size={size} fill/>;\n\nconst ALT_LOGO_B64 = window.__FL_ALT_LOGO;\n\nconst AltIcon = ({size=24,style={}}) => <img src={ALT_LOGO_B64} style={{width:size,height:size,objectFit:'cover',borderRadius:size*0.22,...style}} alt=\"Alt Inv\"/>;\nconst LOGO_B64 = window.__FL_LOGO;\n\n\n// ─── DATA ─────────────────────────────────────────────────────────────────────\nconst LEVELS = [\n  { min:0,    name:'🌱 Seme',     title:'Seme Curioso',      color:'#6b7280' },\n  { min:200,  name:'🌿 Germoglio',title:'Germoglio',         color:'#10b981' },\n  { min:600,  name:'☘️ Piantina', title:'Piantina',          color:'#059669' },\n  { min:1200, name:'🌳 Albero',   title:'Albero Esperto',    color:'#0d9488' },\n  { min:2500, name:'🌲 Sequoia',  title:'Sequoia del Sapere',color:'#0891b2' },\n  { min:5000, name:'🏔️ Foresta',  title:'Maestro della Foresta',color:'#7c3aed' },\n];\nconst getLevel = xp => { let l=LEVELS[0]; for(const x of LEVELS) if(xp>=x.min) l=x; return l; };\nconst getNextLevel = xp => { for(const l of LEVELS) if(xp<l.min) return l; return null; };\n\nconst QUESTIONS = window.__FL_QUESTIONS;\nconst TOPICS = window.__FL_TOPICS;\nconst LESSONS = window.__FL_LESSONS;\n// ─── AUTH ─────────────────────────────────────────────────────────────────────\nconst mockAuth = {\n  currentUser:null,\n  onAuthStateChanged:(cb)=>{const s=localStorage.getItem('fl_user');if(s){mockAuth.currentUser=JSON.parse(s);setTimeout(()=>cb(mockAuth.currentUser),120);}else setTimeout(()=>cb(null),120);return()=>{};},\n  signIn:async(email,pw)=>{await new Promise(r=>setTimeout(r,700));const u=JSON.parse(localStorage.getItem('fl_users')||'{}');if(!u[email.toLowerCase()])throw{code:'auth/user-not-found'};if(u[email.toLowerCase()].password!==pw)throw{code:'auth/wrong-password'};mockAuth.currentUser=u[email.toLowerCase()].user;localStorage.setItem('fl_user',JSON.stringify(mockAuth.currentUser));return{user:mockAuth.currentUser};},\n  register:async(email,pw,name)=>{await new Promise(r=>setTimeout(r,700));const u=JSON.parse(localStorage.getItem('fl_users')||'{}');if(u[email.toLowerCase()])throw{code:'auth/email-already-in-use'};const user={uid:'u_'+Date.now(),email,displayName:name,photoURL:null};u[email.toLowerCase()]={user,password:pw};localStorage.setItem('fl_users',JSON.stringify(u));mockAuth.currentUser=user;localStorage.setItem('fl_user',JSON.stringify(user));return{user};},\n  signOut:async()=>{mockAuth.currentUser=null;localStorage.removeItem('fl_user');},\n};\nconst mockDb={\n  get:(uid)=>{const d=localStorage.getItem('fl_d_'+uid);return d?JSON.parse(d):null;},\n  set:(uid,data)=>localStorage.setItem('fl_d_'+uid,JSON.stringify(data)),\n};\nconst defaultData=()=>({stats:{xp:0,coins:0,streak:1,quizzes:0,correct:0,bestStreak:0},completedLessons:[],activeLesson:1,settings:{timerEnabled:false}});\nconst ERR={\n  'auth/email-already-in-use':'Email già registrata.',\n  'auth/user-not-found':'Account non trovato.',\n  'auth/wrong-password':'Password errata.',\n};\n\n// ─── KATEX COMPONENT ─────────────────────────────────────────────────────────\nfunction Tex({children,display=false,style={}}) {\n  const ref=useRef(null);\n  useEffect(()=>{\n    if(ref.current&&window.katex){\n      try{window.katex.render(children,ref.current,{displayMode:display,throwOnError:false});}\n      catch{if(ref.current)ref.current.textContent=children;}\n    }\n  },[children,display]);\n  return <span ref={ref} style={display?{display:'block',margin:'6px 0',overflowX:'auto',...style}:{display:'inline',...style}}/>;\n}\n\n// ─── SPLASH ───────────────────────────────────────────────────────────────────\nfunction Splash({onComplete}) {\n  const [p,setP]=useState(0);\n  useEffect(()=>{\n    const ts=[\n      setTimeout(()=>setP(1),150),\n      setTimeout(()=>setP(2),500),\n      setTimeout(()=>setP(3),900),\n      setTimeout(()=>setP(4),1400),\n      setTimeout(()=>setP(5),2100),\n      setTimeout(()=>onComplete(),2700),\n    ];\n    return()=>ts.forEach(clearTimeout);\n  },[]);\n\n  return (\n    <div style={{position:'fixed',inset:0,zIndex:100,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:'linear-gradient(160deg,#0d1b3e 0%,#0a0f1e 55%,#0d2a30 100%)',transition:'opacity .5s',opacity:p>=5?0:1}}>\n      {/* Glow */}\n      <div style={{position:'absolute',width:320,height:320,borderRadius:'50%',background:'radial-gradient(circle,rgba(16,185,129,.18),rgba(245,158,11,.08),transparent 70%)',filter:'blur(40px)',transition:'all .8s',transform:p>=1?'scale(1.4)':'scale(0)',opacity:p>=1?1:0}}/>\n\n      {/* Logo mark */}\n      <div style={{position:'relative',transition:'all .6s cubic-bezier(.22,.68,0,1.2)',transform:p>=1?'scale(1) rotate(0deg)':'scale(0) rotate(-20deg)',opacity:p>=1?1:0}}>\n        <img src={LOGO_B64} style={{width:96,height:96,borderRadius:24,boxShadow:'0 24px 64px rgba(15,32,68,.5)',display:'block'}} alt=\"CFALearn\"/>\n      </div>\n\n      {/* Title */}\n      <div style={{marginTop:28,transition:'all .5s',opacity:p>=2?1:0,transform:p>=2?'translateY(0)':'translateY(12px)'}}>\n        <h1 style={{fontFamily:\"'DM Serif Display',Georgia,serif\",fontSize:42,color:'#fff',letterSpacing:'.04em',textAlign:'center',lineHeight:1}}>CFALearn</h1>\n        <p style={{color:'rgba(52,211,153,.55)',fontSize:11,letterSpacing:'.28em',textTransform:'uppercase',textAlign:'center',marginTop:8,fontWeight:500}}>Pianta oggi · Raccogli domani</p>\n      </div>\n\n      {/* Progress bar */}\n      <div style={{width:160,height:2,background:'rgba(255,255,255,.08)',borderRadius:1,marginTop:40,overflow:'hidden',opacity:p>=3?1:0,transition:'opacity .3s'}}>\n        <div style={{height:'100%',borderRadius:1,background:'linear-gradient(90deg,#34d399,#f59e0b)',transition:'width 1.2s ease-out',width:p>=4?'100%':'0%'}}/>\n      </div>\n      <p style={{color:'rgba(255,255,255,.15)',fontSize:10,letterSpacing:'.18em',marginTop:12,opacity:p>=4?1:0,transition:'opacity .3s'}}>v3.0 · AI-Powered</p>\n    </div>\n  );\n}\n\n// ─── AUTH ─────────────────────────────────────────────────────────────────────\nfunction Auth({onAuth}) {\n  const [mode,setMode]=useState('login');\n  const [email,setEmail]=useState('');\n  const [pw,setPw]=useState('');\n  const [pw2,setPw2]=useState('');\n  const [name,setName]=useState('');\n  const [show,setShow]=useState(false);\n  const [loading,setLoading]=useState(false);\n  const [err,setErr]=useState(null);\n\n  const submit=async(e)=>{\n    e.preventDefault();setErr(null);\n    if(!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email))return setErr('Email non valida.');\n    if(pw.length<6)return setErr('Password min 6 caratteri.');\n    if(mode==='register'&&pw!==pw2)return setErr('Le password non coincidono.');\n    if(mode==='register'&&name.trim().length<2)return setErr('Inserisci il tuo nome.');\n    setLoading(true);\n    try{\n      const res=mode==='login'?await mockAuth.signIn(email,pw):await mockAuth.register(email,pw,name.trim());\n      let data=mockDb.get(res.user.uid);\n      if(!data){data=defaultData();mockDb.set(res.user.uid,data);}\n      onAuth(res.user,data);\n    }catch(e){setErr(ERR[e.code]||'Errore. Riprova.');}\n    finally{setLoading(false);}\n  };\n\n  return (\n    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:24,background:'linear-gradient(160deg,#0d1b3e 0%,#0a0f1e 55%,#0d2a30 100%)'}}>\n      {/* Ambient blobs */}\n      <div style={{position:'absolute',top:'8%',left:'5%',width:280,height:280,borderRadius:'50%',background:'radial-gradient(circle,rgba(5,150,105,.12),transparent 70%)',filter:'blur(60px)',pointerEvents:'none'}}/>\n      <div style={{position:'absolute',bottom:'15%',right:'5%',width:220,height:220,borderRadius:'50%',background:'radial-gradient(circle,rgba(139,92,246,.1),transparent 70%)',filter:'blur(60px)',pointerEvents:'none'}}/>\n\n      <div style={{width:'100%',maxWidth:400}} className=\"anim-scale\">\n        {/* Header */}\n        <div style={{textAlign:'center',marginBottom:32}}>\n          <img src={LOGO_B64} style={{width:72,height:72,borderRadius:20,margin:'0 auto 16px',display:'block',boxShadow:'0 20px 48px rgba(15,32,68,.4)'}} alt=\"CFALearn\"/>\n          <h1 style={{fontFamily:\"'DM Serif Display',Georgia,serif\",fontSize:34,color:'#fff',letterSpacing:'.03em'}}>CFALearn</h1>\n          <p style={{color:'rgba(52,211,153,.5)',fontSize:12,letterSpacing:'.2em',textTransform:'uppercase',marginTop:6}}>AI-Powered CFA Prep</p>\n        </div>\n\n        {/* Card */}\n        <div style={{background:'rgba(255,255,255,.97)',borderRadius:24,padding:28,boxShadow:'0 32px 80px rgba(0,0,0,.3)',border:'1px solid rgba(255,255,255,.15)'}}>\n          {/* Tabs */}\n          <div className=\"pill-tab\" style={{marginBottom:24}}>\n            {['login','register'].map(m=>(\n              <button key={m} className={\"pill-tab-item\"+(mode===m?' active':'')} onClick={()=>{setMode(m);setErr(null);}}>\n                {m==='login'?'Accedi':'Registrati'}\n              </button>\n            ))}\n          </div>\n\n          <form onSubmit={submit} style={{display:'flex',flexDirection:'column',gap:14}}>\n            {mode==='register'&&(\n              <input className=\"input\" type=\"text\" value={name} onChange={e=>setName(e.target.value)} placeholder=\"Il tuo nome\" autoComplete=\"name\"/>\n            )}\n            <div style={{position:'relative'}}>\n              <span style={{position:'absolute',left:14,top:'50%',transform:'translateY(-50%)',color:'#94a3b8',pointerEvents:'none'}}><IMail size={16}/></span>\n              <input className=\"input\" style={{paddingLeft:42}} type=\"email\" value={email} onChange={e=>setEmail(e.target.value)} placeholder=\"Email\" autoComplete=\"email\"/>\n            </div>\n            <div style={{position:'relative'}}>\n              <span style={{position:'absolute',left:14,top:'50%',transform:'translateY(-50%)',color:'#94a3b8',pointerEvents:'none'}}><ILock size={16}/></span>\n              <input className=\"input\" style={{paddingLeft:42,paddingRight:44}} type={show?'text':'password'} value={pw} onChange={e=>setPw(e.target.value)} placeholder=\"Password\"/>\n              <button type=\"button\" onClick={()=>setShow(!show)} style={{position:'absolute',right:14,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',color:'#94a3b8',cursor:'pointer',padding:4}}>\n                {show?<IEyeOff size={16}/>:<IEye size={16}/>}\n              </button>\n            </div>\n            {mode==='register'&&(\n              <input className=\"input\" type=\"password\" value={pw2} onChange={e=>setPw2(e.target.value)} placeholder=\"Conferma password\"/>\n            )}\n            {err&&(\n              <div style={{display:'flex',alignItems:'center',gap:8,padding:'10px 14px',background:'#fef2f2',border:'1px solid #fecaca',borderRadius:10,color:'#dc2626',fontSize:13}}>\n                <IAlert size={15}/>{err}\n              </div>\n            )}\n            <button type=\"submit\" disabled={loading} className=\"btn-primary\" style={{padding:'14px 0',borderRadius:12,fontSize:15,marginTop:4}}>\n              {loading?<span style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8}}><span style={{width:16,height:16,border:'2px solid rgba(255,255,255,.4)',borderTopColor:'#fff',borderRadius:'50%',display:'inline-block',animation:'spin .7s linear infinite'}}/> Caricamento…</span>\n               :mode==='login'?'Accedi →':'Crea account →'}\n            </button>\n          </form>\n        </div>\n      </div>\n    </div>\n  );\n}\n\n// ─── CALCULATOR ───────────────────────────────────────────────────────────────\nfunction Calculator({onClose}) {\n  const [display,setDisplay]=useState('0');\n  const [sub,setSub]=useState('');\n  const [input,setInput]=useState('');\n  const [pendingOp,setPendingOp]=useState(null);\n  const [first,setFirst]=useState(null);\n  const [tvm,setTvm]=useState({N:0,IY:0,PV:0,PMT:0,FV:0});\n  const [cptMode,setCptMode]=useState(false);\n  const [sec,setSec]=useState(false);\n  const [cashFlows,setCashFlows]=useState([{value:0,freq:1}]);\n  const [cfMode,setCfMode]=useState(false);\n  const [cfIdx,setCfIdx]=useState(0);\n\n  const fmt=(n,d=6)=>{if(n===undefined||isNaN(n)||!isFinite(n))return'Error';if(Math.abs(n)<1e-9&&n!==0)return n.toExponential(4);if(Math.abs(n)>=1e10)return n.toExponential(4);return parseFloat(n.toFixed(d)).toLocaleString('en-US',{maximumFractionDigits:d});};\n  const raw=(n,d=6)=>{if(n===undefined||isNaN(n))return'0';return parseFloat(n.toFixed(d)).toString();};\n  const cur=()=>parseFloat((input||display).replace(/,/g,''))||0;\n\n  const pressNum=(n)=>{const ni=input===''||input==='0'?String(n):input+n;setInput(ni);setDisplay(ni);};\n  const pressDecimal=()=>{if(input.includes('.'))return;const ni=input===''?'0.':input+'.';setInput(ni);setDisplay(ni);};\n  const pressClear=()=>{if(input!==''){setInput('');setDisplay('0');}else{setDisplay('0');setSub('');setPendingOp(null);setFirst(null);}};\n  const pressOp=(op)=>{setFirst(cur());setPendingOp(op);setSub(op);setInput('');};\n  const pressEq=()=>{if(!pendingOp||first===null)return;const b=cur();let r;switch(pendingOp){case'+':r=first+b;break;case'−':r=first-b;break;case'×':r=first*b;break;case'÷':r=b!==0?first/b:NaN;break;default:r=b;}setDisplay(fmt(r));setFirst(null);setPendingOp(null);setInput('');setSub('');};\n\n  const pressTVM=(key)=>{\n    if(cptMode){\n      const{N,IY,PV,PMT,FV}=tvm;\n      const i=IY/100/12;let result;\n      try{\n        if(key==='FV'){result=i===0?-PV-PMT*N:-(PV*Math.pow(1+i,N)+PMT*(Math.pow(1+i,N)-1)/i);}\n        else if(key==='PV'){result=i===0?-FV-PMT*N:-FV/Math.pow(1+i,N)-PMT*(1-Math.pow(1+i,-N))/i;}\n        else if(key==='PMT'){result=i===0?N!==0?-(PV+FV)/N:0:-(PV+FV/Math.pow(1+i,N))*i/(1-Math.pow(1+i,-N));}\n        else if(key==='N'){result=i===0?-(PV+FV)/(PMT||1):Math.log((PMT-FV*i)/(PMT+PV*i))/Math.log(1+i);}\n        if(isNaN(result)||!isFinite(result)){setDisplay('Error');setSub('No solution');}\n        else{setTvm(t=>({...t,[key]:result}));setDisplay(fmt(result,2));setSub((key)+\" = \"+(fmt(result,2)));}\n      }catch{setDisplay('Error');}\n      setCptMode(false);setInput('');return;\n    }\n    if(sec){\n      if(key==='FV'){setTvm({N:0,IY:0,PV:0,PMT:0,FV:0});setSub('CLR TVM');}\n      setSec(false);return;\n    }\n    const val=cur();setTvm(t=>({...t,[key]:val}));setSub((key)+\"=\"+(fmt(val,2)));setInput('');\n  };\n\n  const pressNPV=()=>{\n    const rate=tvm.IY/100;let npv=0,t=0;\n    for(const cf of cashFlows){for(let j=0;j<(cf.freq||1);j++){npv+=(cf.value||0)/Math.pow(1+rate,t);t++;}}\n    setDisplay(fmt(npv,2));setSub(\"NPV @ \"+(tvm.IY)+\"%\");setCfMode(false);\n  };\n\n  const CalcBtn=({label,sub:s,onClick,type='num'})=>{\n    const colors={num:{bg:'#3f3f46',text:'#fff'},op:{bg:'#27272a',text:'#e4e4e7'},tvm:{bg:'#065f46',text:'#fff'},func:{bg:'#1c1c1e',text:'#a1a1aa'},second:{bg:'#d97706',text:'#fff'}};\n    const c=colors[type]||colors.num;\n    return(\n      <button onClick={onClick} className=\"calc-btn\" style={{background:c.bg,color:c.text,fontSize:type==='tvm'?11:13,position:'relative'}}>\n        {s&&<span style={{position:'absolute',top:-9,fontSize:7,color:'#f59e0b',fontWeight:600,letterSpacing:'.02em'}}>{s}</span>}\n        {label}\n      </button>\n    );\n  };\n\n  return(\n    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.75)',backdropFilter:'blur(8px)',zIndex:200,display:'flex',alignItems:'center',justifyContent:'center',padding:16}} onClick={onClose}>\n      <div style={{background:'#18181b',borderRadius:24,width:'100%',maxWidth:360,boxShadow:'0 32px 80px rgba(0,0,0,.5)',border:'1px solid rgba(255,255,255,.08)',overflow:'hidden'}} onClick={e=>e.stopPropagation()}>\n        {/* Header */}\n        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'14px 16px',borderBottom:'1px solid rgba(255,255,255,.06)'}}>\n          <span style={{color:'#f59e0b',fontSize:10,fontWeight:800,letterSpacing:'.18em'}}>FINLEARN CALC</span>\n          <button onClick={onClose} style={{width:28,height:28,borderRadius:'50%',background:'rgba(255,255,255,.08)',border:'none',color:'#71717a',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}><IX size={14}/></button>\n        </div>\n        {/* LCD */}\n        <div style={{background:'#0a1a0f',margin:'12px 14px 0',borderRadius:14,padding:'12px 14px',border:'1px solid rgba(52,211,153,.1)'}}>\n          <div style={{display:'flex',justifyContent:'space-between',fontSize:8,color:'rgba(52,211,153,.5)',height:14}}>\n            <div style={{display:'flex',gap:6}}>{sec&&<span>2ND</span>}{cptMode&&<span>CPT</span>}{cfMode&&<span>CF</span>}</div>\n          </div>\n          <div style={{color:'rgba(52,211,153,.5)',fontSize:10,textAlign:'right',height:14,fontFamily:'monospace'}}>{sub}</div>\n          <div style={{color:'#4ade80',fontSize:32,fontFamily:'monospace',textAlign:'right',letterSpacing:'.04em',textShadow:'0 0 20px rgba(74,222,128,.4)'}}>{display}</div>\n          <div style={{display:'flex',justifyContent:'space-between',marginTop:8,paddingTop:8,borderTop:'1px solid rgba(52,211,153,.1)',fontSize:7,fontFamily:'monospace',color:'#166534',gap:4}}>\n            {Object.entries(tvm).map(([k,v])=><span key={k} style={{color:v?'#22c55e':'#166534'}}>{k}:{raw(v,0)}</span>)}\n          </div>\n        </div>\n        {/* Keys */}\n        <div style={{padding:'12px 14px 16px',display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:6}}>\n          <CalcBtn label=\"N\" s=\"×P/Y\" onClick={()=>pressTVM('N')} type=\"tvm\"/>\n          <CalcBtn label=\"I/Y\" onClick={()=>pressTVM('IY')} type=\"tvm\"/>\n          <CalcBtn label=\"PV\" onClick={()=>pressTVM('PV')} type=\"tvm\"/>\n          <CalcBtn label=\"PMT\" onClick={()=>pressTVM('PMT')} type=\"tvm\"/>\n          <CalcBtn label=\"FV\" s=\"CLR\" onClick={()=>pressTVM('FV')} type=\"tvm\"/>\n          <CalcBtn label=\"CF\" onClick={()=>{setCfMode(true);setSub('CF0');}} type=\"func\"/>\n          <CalcBtn label=\"NPV\" onClick={pressNPV} type=\"func\"/>\n          <CalcBtn label=\"IRR\" onClick={()=>setSub('IRR N/A')} type=\"func\"/>\n          <CalcBtn label=\"%\" onClick={()=>{setDisplay(fmt(cur()/100));setInput('');}} type=\"func\"/>\n          <CalcBtn label=\"√x\" onClick={()=>{const v=cur();setDisplay(v<0?'Error':fmt(Math.sqrt(v)));setInput('');}} type=\"func\"/>\n          <CalcBtn label=\"2nd\" onClick={()=>{setSec(!sec);setSub(sec?'':'2nd');}} type=\"second\"/>\n          <CalcBtn label=\"CPT\" onClick={()=>{setCptMode(true);setSub('CPT');}} type=\"second\"/>\n          <CalcBtn label=\"DEL\" onClick={()=>{const ni=input.slice(0,-1);setInput(ni);setDisplay(ni||'0');}} type=\"func\"/>\n          <CalcBtn label=\"CE\" onClick={pressClear} type=\"func\"/>\n          <CalcBtn label=\"÷\" onClick={()=>pressOp('÷')} type=\"op\"/>\n          <CalcBtn label=\"7\" onClick={()=>pressNum(7)}/><CalcBtn label=\"8\" onClick={()=>pressNum(8)}/><CalcBtn label=\"9\" onClick={()=>pressNum(9)}/>\n          <CalcBtn label=\"×\" onClick={()=>pressOp('×')} type=\"op\"/>\n          <CalcBtn label=\"yˣ\" onClick={()=>{setFirst(cur());setPendingOp('yˣ');setInput('');}} type=\"func\"/>\n          <CalcBtn label=\"4\" onClick={()=>pressNum(4)}/><CalcBtn label=\"5\" onClick={()=>pressNum(5)}/><CalcBtn label=\"6\" onClick={()=>pressNum(6)}/>\n          <CalcBtn label=\"−\" onClick={()=>pressOp('−')} type=\"op\"/>\n          <CalcBtn label=\"1/x\" onClick={()=>{const v=cur();setDisplay(v===0?'Error':fmt(1/v));setInput('');}} type=\"func\"/>\n          <CalcBtn label=\"1\" onClick={()=>pressNum(1)}/><CalcBtn label=\"2\" onClick={()=>pressNum(2)}/><CalcBtn label=\"3\" onClick={()=>pressNum(3)}/>\n          <CalcBtn label=\"+\" onClick={()=>pressOp('+')} type=\"op\"/>\n          <CalcBtn label=\"=\" onClick={pressEq} type=\"op\"/>\n          <CalcBtn label=\"0\" onClick={()=>pressNum(0)}/><CalcBtn label=\".\" onClick={pressDecimal}/>\n          <CalcBtn label=\"+/−\" onClick={()=>{if(input.startsWith('-'))setInput(input.slice(1));else if(input&&input!=='0')setInput('-'+input);setDisplay(input.startsWith('-')?input.slice(1):'-'+input);}} type=\"func\"/>\n        </div>\n      </div>\n    </div>\n  );\n}\n\n// ─── AI CHAT PANEL ────────────────────────────────────────────────────────────\nfunction ChatPanel({user,chats,setChats,activeChatId,setActiveChatId}) {\n  const [msg,setMsg]=useState('');\n  const [loading,setLoading]=useState(false);\n  const [showHistory,setShowHistory]=useState(false);\n  const endRef=useRef(null);\n\n  const current=chats.find(c=>c.id===activeChatId);\n  const messages=current?.messages||[];\n\n  useEffect(()=>{endRef.current?.scrollIntoView({behavior:'smooth'});},[messages,loading]);\n\n  const SYSTEM='Sei il Bull Coach, tutor AI esperto per CFA prep e finanza. Rispondi SEMPRE in italiano (termini tecnici in inglese ok). Sii conciso ma preciso. Usa emoji: 📊📈💡🎯⚡. Copri: Fixed Income, Equity, Derivatives, Portfolio Mgmt, Ethics, FRA, Quant Methods.';\n\n  const callAI=async(userMsg,history)=>{\n    const msgs=[];\n    for(const m of history.slice(-8))msgs.push({role:m.role,content:m.content});\n    if(msgs.length>0&&msgs[0].role==='user')msgs[0]={role:'user',content:SYSTEM+'\\n\\n---\\n\\n'+msgs[0].content};\n    else msgs.unshift({role:'user',content:SYSTEM+'\\n\\nPresentati brevemente.'},{role:'assistant',content:'🐂 Ciao! Sono il Bull Coach, il tuo tutor CFA. Cosa vuoi studiare?'});\n    msgs.push({role:'user',content:userMsg});\n    try{const r=await window.claude.complete({messages:msgs.slice(-10)});return r||fallback(userMsg);}\n    catch{return fallback(userMsg);}\n  };\n\n  const fallback=(t)=>{\n    const l=t.toLowerCase();\n    if(l.includes('duration'))return'📊 **Duration** misura la sensibilità al tasso:\\n\\n• **MacD** = tempo medio ponderato dei CF\\n• **ModD** = MacD / (1+y/m) → variazione % per 1% Δy\\n• **EffD** = per bond con opzioni embedded\\n\\n💡 ModD=7 → yield +1% ≈ price -7%';\n    if(l.includes('ytm')||l.includes('yield'))return'📈 **YTM** = IRR del bond!\\n\\nTasso che eguaglia PV di tutti i CF al prezzo.\\n• **BEY** = 2 × semi YTM\\n• **EAY** = (1+semi YTM)² - 1\\n\\n⚡ Premium bond: Coupon > CY > YTM';\n    if(l.includes('ciao')||l.includes('hello'))return'🐂 Ciao'+(user?.displayName?' '+user.displayName:'')+'! Pronto a dominare il CFA?\\n\\nChiedimi di:\\n📊 Fixed Income & Duration\\n📈 Equity & Valuation\\n⚡ Derivatives & Greeks\\n📐 Quant Methods';\n    return'🐂 Ottima domanda! Posso aiutarti con:\\n\\n📊 Bond valuation, duration, spreads\\n📈 Equity, P/E, DDM, FCF\\n⚡ Options, futures, swaps\\n📐 NPV, IRR, CAPM\\n\\nDimmi cosa vuoi approfondire! 💪';\n  };\n\n  const newChat=()=>{\n    const c={id:'c_'+Date.now(),title:'Nuova chat',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),messages:[{role:'assistant',content:'🐂 Ciao'+(user?.displayName?' '+user.displayName:'')+'! Sono il Bull Coach, il tuo tutor AI per il CFA.\\n\\nChiedimi qualsiasi cosa su:\\n📊 Fixed Income & Bonds\\n📈 Equity Analysis\\n⚡ Derivatives\\n📐 Quant Methods',timestamp:new Date().toISOString()}]};\n    setChats(p=>[c,...p].slice(0,50));setActiveChatId(c.id);setShowHistory(false);\n  };\n\n  const send=async()=>{\n    if(!msg.trim()||loading)return;\n    const text=msg.trim();\n    let chatId=activeChatId;\n    if(!chatId){const c={id:'c_'+Date.now(),title:text.slice(0,40),createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),messages:[]};chatId=c.id;setChats(p=>[c,...p].slice(0,50));setActiveChatId(c.id);}\n    const um={role:'user',content:text,timestamp:new Date().toISOString()};\n    setChats(p=>p.map(c=>c.id===chatId?{...c,title:c.messages.filter(x=>x.role==='user').length===0?text.slice(0,40):c.title,messages:[...c.messages,um],updatedAt:new Date().toISOString()}:c));\n    setMsg('');setLoading(true);\n    try{\n      const cur=chats.find(c=>c.id===chatId)?.messages||[];\n      const reply=await callAI(text,cur);\n      setChats(p=>p.map(c=>c.id===chatId?{...c,messages:[...c.messages,{role:'assistant',content:reply,timestamp:new Date().toISOString()}],updatedAt:new Date().toISOString()}:c));\n    }catch{\n      setChats(p=>p.map(c=>c.id===chatId?{...c,messages:[...c.messages,{role:'assistant',content:'⚠️ Errore. Riprova!',timestamp:new Date().toISOString()}],updatedAt:new Date().toISOString()}:c));\n    }\n    setLoading(false);\n  };\n\n  const fmtMsg=(text)=>{\n    if(!text)return null;\n    return text.split('\\n').map((line,i)=>{\n      const safe=line.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');\n      const fmt=safe.replace(/**(.*?)**/g,'<strong>$1</strong>');\n      if(line.startsWith('• ')||line.startsWith('- '))return(\n        <div key={i} style={{display:'flex',gap:8,marginTop:2}}>\n          <span style={{color:'var(--em)',flexShrink:0}}>•</span>\n          <span dangerouslySetInnerHTML={{__html:fmt.slice(fmt.indexOf(' ')+1)}}/>\n        </div>\n      );\n      return<div key={i} style={{marginTop:i>0?2:0}} dangerouslySetInnerHTML={{__html:fmt}}/>;\n    });\n  };\n\n  const suggestions=['📊 Cos è la Duration?','📈 Come calcolo YTM?','⚡ Differenza Call vs Put','📐 Spiegami il CAPM'];\n\n  return(\n    <div style={{display:'flex',flexDirection:'column',height:'100%',background:'#fafafa'}}>\n      <div style={{background:'rgba(255,255,255,.95)',backdropFilter:'blur(16px)',borderBottom:'1px solid var(--border)',padding:'12px 16px',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>\n        <div style={{display:'flex',alignItems:'center',gap:12}}>\n          <div style={{width:44,height:44,borderRadius:14,background:'linear-gradient(135deg,#f59e0b,#ea580c)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:22,boxShadow:'0 4px 12px rgba(245,158,11,.3)'}}>🐂</div>\n          <div>\n            <div style={{fontWeight:700,fontSize:15,color:'var(--ink)'}}>Bull Coach AI</div>\n            <div style={{fontSize:11,color:'var(--ink-4)',display:'flex',alignItems:'center',gap:4}}><ISpark size={10} style={{color:'#f59e0b'}}/> Powered by Claude</div>\n          </div>\n        </div>\n        <div style={{display:'flex',gap:8}}>\n          <button onClick={()=>setShowHistory(true)} style={{position:'relative',width:38,height:38,borderRadius:12,background:'#f1f5f9',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--ink-3)'}}>\n            <IClock size={17}/>\n            {chats.length>0&&<span style={{position:'absolute',top:-3,right:-3,width:16,height:16,background:'#f59e0b',color:'#fff',fontSize:9,fontWeight:700,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center'}}>{chats.length}</span>}\n          </button>\n          <button onClick={newChat} style={{width:38,height:38,borderRadius:12,background:'#fef3c7',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:'#d97706'}}><IPlus size={17}/></button>\n        </div>\n      </div>\n\n      {!activeChatId&&chats.length===0?(\n        <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:24,gap:20}}>\n          <div style={{width:80,height:80,borderRadius:24,background:'linear-gradient(135deg,#f59e0b,#ea580c)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:40,boxShadow:'0 16px 48px rgba(245,158,11,.3)'}}>🐂</div>\n          <div style={{textAlign:'center'}}>\n            <div style={{fontSize:20,fontWeight:800,color:'var(--ink)'}}>Bull Coach AI</div>\n            <div style={{fontSize:13,color:'var(--ink-3)',marginTop:4}}>Il tuo tutor CFA personale</div>\n          </div>\n          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,width:'100%',maxWidth:320}}>\n            {suggestions.map((s,i)=>(\n              <button key={i} onClick={()=>setMsg(s.replace(/^[^s]+ /,''))}\n                style={{padding:'12px 14px',background:'#fff',border:'1.5px solid var(--border)',borderRadius:14,fontSize:12,color:'var(--ink-2)',cursor:'pointer',textAlign:'left',fontWeight:500,fontFamily:'inherit'}}>\n                {s}\n              </button>\n            ))}\n          </div>\n        </div>\n      ):(\n        <div style={{flex:1,overflowY:'auto',WebkitOverflowScrolling:'touch',padding:'16px 16px 8px'}}>\n          <div style={{maxWidth:560,margin:'0 auto',display:'flex',flexDirection:'column',gap:12}}>\n            {messages.map((m,i)=>(\n              <div key={i} style={{display:'flex',justifyContent:m.role==='user'?'flex-end':'flex-start'}}>\n                {m.role==='assistant'&&<div style={{width:28,height:28,borderRadius:9,background:'linear-gradient(135deg,#f59e0b,#ea580c)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,marginRight:8,flexShrink:0,marginTop:4}}>🐂</div>}\n                <div className={m.role==='user'?'bubble-user':'bubble-ai'} style={{maxWidth:'82%',padding:'11px 15px',fontSize:13.5,lineHeight:1.65,color:m.role==='user'?'#fff':'var(--ink-2)'}}>\n                  <div style={{display:'flex',flexDirection:'column',gap:1}}>{fmtMsg(m.content)}</div>\n                </div>\n              </div>\n            ))}\n            {loading&&(\n              <div style={{display:'flex',justifyContent:'flex-start'}}>\n                <div style={{width:28,height:28,borderRadius:9,background:'linear-gradient(135deg,#f59e0b,#ea580c)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,marginRight:8,flexShrink:0}}>🐂</div>\n                <div className=\"bubble-ai\" style={{padding:'14px 16px'}}>\n                  <div style={{display:'flex',gap:5}}>\n                    {[0,.15,.3].map((d,i)=><div key={i} style={{width:7,height:7,background:'#94a3b8',borderRadius:'50%',animation:'bounce-dot 1.2s infinite',animationDelay:d+'s'}}/>)}\n                  </div>\n                </div>\n              </div>\n            )}\n            <div ref={endRef}/>\n          </div>\n        </div>\n      )}\n\n      <div style={{background:'rgba(255,255,255,.95)',backdropFilter:'blur(16px)',borderTop:'1px solid var(--border)',padding:'12px 16px',flexShrink:0}}>\n        <div style={{maxWidth:560,margin:'0 auto',display:'flex',gap:10,alignItems:'center'}}>\n          <input value={msg} onChange={e=>setMsg(e.target.value)} onKeyDown={e=>e.key==='Enter'&&!e.shiftKey&&send()}\n            placeholder=\"Chiedimi di bonds, equity, derivati…\" disabled={loading}\n            style={{flex:1,padding:'12px 16px',background:'#f1f5f9',border:'1.5px solid transparent',borderRadius:14,outline:'none',fontSize:14,fontFamily:'inherit',color:'var(--ink)',transition:'all .18s'}}\n            onFocus={e=>{e.target.style.background='#fff';e.target.style.border='1.5px solid var(--em)';e.target.style.boxShadow='0 0 0 3px rgba(5,150,105,.1)';}}\n            onBlur={e=>{e.target.style.background='#f1f5f9';e.target.style.border='1.5px solid transparent';e.target.style.boxShadow='none';}}\n          />\n          <button onClick={send} disabled={!msg.trim()||loading}\n            style={{width:46,height:46,borderRadius:14,background:msg.trim()&&!loading?'linear-gradient(135deg,#f59e0b,#ea580c)':'#f1f5f9',border:'none',cursor:msg.trim()&&!loading?'pointer':'default',display:'flex',alignItems:'center',justifyContent:'center',color:msg.trim()&&!loading?'#fff':'#cbd5e1',transition:'all .2s',flexShrink:0}}>\n            <ISend size={17}/>\n          </button>\n        </div>\n      </div>\n\n      {showHistory&&(\n        <div style={{position:'absolute',inset:0,zIndex:50,display:'flex'}} className=\"anim-in\">\n          <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,.35)',backdropFilter:'blur(4px)'}} onClick={()=>setShowHistory(false)}/>\n          <div style={{position:'relative',marginLeft:'auto',width:300,background:'#fff',height:'100%',display:'flex',flexDirection:'column',boxShadow:'-16px 0 48px rgba(0,0,0,.12)'}}>\n            <div style={{padding:'16px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'space-between'}}>\n              <div>\n                <div style={{fontWeight:700,fontSize:15,color:'var(--ink)'}}>Cronologia</div>\n                <div style={{fontSize:11,color:'var(--ink-4)',marginTop:2}}>{chats.length} conversazioni</div>\n              </div>\n              <button onClick={()=>setShowHistory(false)} style={{width:32,height:32,borderRadius:10,background:'#f1f5f9',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--ink-3)'}}><IX size={15}/></button>\n            </div>\n            <div style={{flex:1,overflowY:'auto',padding:'10px 10px'}}>\n              {chats.length===0?<div style={{textAlign:'center',padding:40,color:'var(--ink-4)'}}><IChat size={28} style={{margin:'0 auto 8px',display:'block'}}/><div style={{fontSize:13}}>Nessuna chat</div></div>\n              :chats.map(c=>(\n                <div key={c.id} onClick={()=>{setActiveChatId(c.id);setShowHistory(false);}}\n                  style={{padding:'12px',borderRadius:12,cursor:'pointer',marginBottom:4,background:c.id===activeChatId?'#ecfdf5':'transparent',border:'1.5px solid '+(c.id===activeChatId?'#a7f3d0':'transparent'),transition:'all .15s',display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}\n                  onMouseEnter={e=>{if(c.id!==activeChatId)e.currentTarget.style.background='#f8fafc';}}\n                  onMouseLeave={e=>{if(c.id!==activeChatId)e.currentTarget.style.background='transparent';}}>\n                  <div style={{flex:1,minWidth:0}}>\n                    <div style={{fontWeight:600,fontSize:13,color:'var(--ink)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{c.title||'Chat'}</div>\n                    <div style={{fontSize:11,color:'var(--ink-4)',marginTop:2}}>{new Date(c.updatedAt).toLocaleDateString('it')} · {c.messages?.length||0} msg</div>\n                  </div>\n                  <button onClick={e=>{e.stopPropagation();setChats(p=>p.filter(x=>x.id!==c.id));if(activeChatId===c.id)setActiveChatId(null);}}\n                    style={{width:24,height:24,borderRadius:8,background:'transparent',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:'#fca5a5',opacity:0,transition:'opacity .15s',flexShrink:0}}\n                    onMouseEnter={e=>e.currentTarget.style.opacity='1'} onMouseLeave={e=>e.currentTarget.style.opacity='0'}>\n                    <ITrash size={12}/>\n                  </button>\n                </div>\n              ))}\n            </div>\n            <div style={{padding:'12px'}}>\n              <button onClick={newChat} style={{width:'100%',padding:'12px',borderRadius:14,background:'linear-gradient(135deg,#f59e0b,#ea580c)',color:'#fff',border:'none',fontWeight:700,fontSize:14,cursor:'pointer',fontFamily:'inherit'}}>+ Nuova Chat</button>\n            </div>\n          </div>\n        </div>\n      )}\n    </div>\n  );\n}\n\n// ─── EXPORT TO WINDOW FOR SCRIPT 2 ──────────────────────────────────────────\n\nfunction QuizAI({question, onClose}) {\n  const [q,setQ]=useState(\"\");\n  const [a,setA]=useState(\"\");\n  const [loading,setLoading]=useState(false);\n  const ask=async()=>{\n    if(!q.trim())return;\n    setLoading(true);setA(\"\");\n    try{\n      const ctx=question?\"Domanda quiz CFA: \"+question.q+\"\\nOpzioni: \"+question.opts.join(\" / \")+\"\\nRisposta corretta: \"+question.opts[question.ans]+\"\\nSpiegazione: \"+question.exp+\"\\n\\nDomanda dello studente: \"+q:\"Domanda CFA: \"+q;\n      const txt=await window.claude.complete(ctx+\"\\n\\nRispondi in italiano, in modo chiaro e didattico, max 150 parole.\");\n      setA(txt);\n    }catch(e){setA(\"Errore. Riprova.\");}\n    setLoading(false);\n  };\n  return(\n    <div style={{position:\"fixed\",inset:0,background:\"rgba(15,23,42,.6)\",backdropFilter:\"blur(8px)\",zIndex:1000,display:\"flex\",flexDirection:\"column\",justifyContent:\"flex-end\"}} onClick={onClose}>\n      <div onClick={e=>e.stopPropagation()} style={{background:\"#fff\",borderRadius:\"24px 24px 0 0\",padding:24,maxHeight:\"80vh\",overflowY:\"auto\",animation:\"fadeUp .3s\"}}>\n        <div style={{display:\"flex\",alignItems:\"center\",gap:12,marginBottom:16}}>\n          <div style={{width:40,height:40,borderRadius:14,background:\"linear-gradient(135deg,#10b981,#059669)\",display:\"flex\",alignItems:\"center\",justifyContent:\"center\"}}><ISpark size={20} style={{color:\"#fff\"}}/></div>\n          <div style={{flex:1}}><div style={{fontWeight:700,fontSize:16}}>Bull Coach</div><div style={{fontSize:12,color:\"#64748b\"}}>Chiedi spiegazioni sulla domanda</div></div>\n          <button onClick={onClose} style={{width:32,height:32,borderRadius:10,background:\"#f1f5f9\",border:\"none\",cursor:\"pointer\"}}>✕</button>\n        </div>\n        {question&&<div style={{background:\"#f8fafc\",padding:12,borderRadius:12,fontSize:13,color:\"#475569\",marginBottom:12,lineHeight:1.5}}><strong>Domanda:</strong> {question.q}</div>}\n        <textarea value={q} onChange={e=>setQ(e.target.value)} placeholder=\"Es. Spiegami perché la risposta è corretta...\" style={{width:\"100%\",minHeight:80,padding:12,borderRadius:12,border:\"1px solid #e2e8f0\",fontSize:14,fontFamily:\"inherit\",resize:\"none\",outline:\"none\"}}/>\n        <button onClick={ask} disabled={loading||!q.trim()} style={{marginTop:12,width:\"100%\",padding:14,borderRadius:14,background:loading?\"#94a3b8\":\"linear-gradient(135deg,#10b981,#059669)\",color:\"#fff\",border:\"none\",fontWeight:700,fontSize:15,cursor:loading?\"wait\":\"pointer\"}}>{loading?\"Sto pensando...\":\"Chiedi a Bull Coach\"}</button>\n        {a&&<div style={{marginTop:16,padding:16,background:\"#ecfdf5\",borderRadius:14,fontSize:14,lineHeight:1.6,color:\"#065f46\",whiteSpace:\"pre-wrap\"}}>{a}</div>}\n      </div>\n    </div>\n  );\n}\n\nfunction App() {\n  const [splash,setSplash]=useState(true);\n  const [user,setUser]=useState(null);\n  const [userData,setUserData]=useState(null);\n  const [loading,setLoading]=useState(true);\n\n  // App state\n  const [section,setSection]=useState('home');\n  const [stats,setStats]=useState(null);\n  const [completed,setCompleted]=useState([]);\n  const [activeLesson,setActiveLesson]=useState(1);\n  const [timerOn,setTimerOn]=useState(false);\n  const [showCalc,setShowCalc]=useState(false);\n  const [showQuizAI,setShowQuizAI]=useState(false);\n  const [quizAIQ,setQuizAIQ]=useState(\"\");\n  const [quizAIA,setQuizAIA]=useState(\"\");\n  const [quizAILoading,setQuizAILoading]=useState(false);\n  const [chats,setChats]=useState([]);\n  const [activeChatId,setActiveChatId]=useState(null);\n\n  // Quiz state\n  const [quiz,setQuiz]=useState(null);\n  const [quizQs,setQuizQs]=useState([]);\n  const [quizIdx,setQuizIdx]=useState(0);\n  const [quizAnswers,setQuizAnswers]=useState([]);\n  const [selected,setSelected]=useState(null);\n  const [streak,setStreak]=useState(0);\n  const [timer,setTimer]=useState(null);\n  const [quizResults,setQuizResults]=useState(null);\n  const [quizTopic,setQuizTopic]=useState(null);\n\n  // Library state\n  const [topic,setTopic]=useState(null);\n  const [libTab,setLibTab]=useState('teoria');\n  const [cardIdx,setCardIdx]=useState(0);\n  const [flipped,setFlipped]=useState(false);\n\n  useEffect(()=>{\n    mockAuth.onAuthStateChanged(u=>{\n      if(u){setUser(u);const d=mockDb.get(u.uid)||defaultData();setUserData(d);setStats(d.stats);setCompleted(d.completedLessons||[]);setActiveLesson(d.activeLesson||1);}\n      setLoading(false);\n    });\n  },[]);\n\n  useEffect(()=>{\n    if(user&&stats){\n      const d={stats,completedLessons:completed,activeLesson,settings:{timerEnabled:timerOn}};\n      mockDb.set(user.uid,d);\n    }\n  },[stats,completed,activeLesson,timerOn]);\n\n  useEffect(()=>{\n    try{setChats(JSON.parse(localStorage.getItem(\"fl_chats_\"+(user?.uid))||'[]'));}catch{}\n  },[user?.uid]);\n  useEffect(()=>{\n    try{localStorage.setItem(\"fl_chats_\"+(user?.uid),JSON.stringify(chats));}catch{}\n  },[chats,user?.uid]);\n\n  // Timer\n  useEffect(()=>{\n    const cur=quizQs[quizIdx];\n    if(quiz&&timerOn&&timer>0&&quizAnswers[quizIdx]==null){\n      const id=setTimeout(()=>setTimer(t=>t-1),1000);return()=>clearTimeout(id);\n    }\n    if(timer===0&&quizAnswers[quizIdx]==null){\n      const na=[...quizAnswers];na[quizIdx]=-1;setQuizAnswers(na);setStreak(0);\n    }\n  },[quiz,timerOn,timer,quizIdx,quizAnswers,quizQs]);\n\n  const startQuiz=(questions,topicKey=null)=>{\n    const qs=[...questions].sort(()=>Math.random()-.5);\n    setQuizQs(qs);setQuizAnswers(new Array(qs.length).fill(null));\n    setQuizIdx(0);setQuiz(qs[0]);setSelected(null);setQuizResults(null);setStreak(0);setQuizTopic(topicKey);\n    if(timerOn)setTimer(qs[0].time||45);\n  };\n  const exitQuiz=()=>{setQuiz(null);setQuizQs([]);setQuizAnswers([]);setQuizResults(null);setQuizIdx(0);setSelected(null);};\n\n  const onAuth=(u,d)=>{setUser(u);setUserData(d);setStats(d.stats);setCompleted(d.completedLessons||[]);setActiveLesson(d.activeLesson||1);};\n  const onLogout=async()=>{await mockAuth.signOut();setUser(null);setUserData(null);setStats(null);};\n\n  // ── Quiz Results ─────────────────────────────────────────────────────────\n  if(quizResults){\n    const{total,correct,pct,xpEarned,coinsEarned}=quizResults;\n    const passed=pct>=60;\n    return(\n      <div style={{height:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:28,background:passed?'linear-gradient(160deg,#0d1b3e,#0a0f1e)':'linear-gradient(160deg,#1e1b4b,#0a0f1e)'}}>\n        <div style={{position:'absolute',top:'10%',width:260,height:260,borderRadius:'50%',background:passed?'radial-gradient(circle,rgba(16,185,129,.15),transparent)':'radial-gradient(circle,rgba(139,92,246,.12),transparent)',filter:'blur(48px)',pointerEvents:'none'}}/>\n        <div className=\"anim-scale\" style={{width:'100%',maxWidth:360,textAlign:'center'}}>\n          <div style={{width:88,height:88,borderRadius:24,overflow:'hidden',margin:'0 auto 16px',boxShadow:'0 20px 48px rgba(15,32,68,.5)'}}><img src={LOGO_B64} style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}} alt=\"\"/></div>\n          <h1 style={{fontFamily:\"'DM Serif Display',Georgia,serif\",fontSize:36,color:'#fff',marginBottom:8}}>{passed?'Fantastico!':'Continua a studiare!'}</h1>\n          <p style={{color:'rgba(255,255,255,.5)',marginBottom:32,fontSize:15}}>{correct}/{total} corrette · {pct}%</p>\n\n          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,marginBottom:28}}>\n            {[{v:'+'+xpEarned,l:'XP guadagnati',c:'#34d399'},{v:'+'+coinsEarned,l:'Coins',c:'#fbbf24'}].map((s,i)=>(\n              <div key={i} style={{background:'rgba(255,255,255,.07)',borderRadius:18,padding:'18px 14px',border:'1px solid rgba(255,255,255,.08)'}}>\n                <div style={{fontSize:28,fontWeight:800,color:s.c}}>{s.v}</div>\n                <div style={{fontSize:11,color:'rgba(255,255,255,.4)',marginTop:4}}>{s.l}</div>\n              </div>\n            ))}\n          </div>\n\n          {passed&&<div style={{background:'rgba(16,185,129,.15)',border:'1px solid rgba(16,185,129,.25)',borderRadius:16,padding:'14px 18px',marginBottom:24,color:'#6ee7b7',fontSize:13}}>🌱 Lezione completata! Ottimo lavoro.</div>}\n\n          <div style={{display:'flex',flexDirection:'column',gap:12}}>\n            <button onClick={exitQuiz} className=\"btn-primary\" style={{padding:'15px 0',borderRadius:16,fontSize:15,width:'100%'}}>Continua →</button>\n            <button onClick={()=>{exitQuiz();setTimeout(()=>startQuiz(quizQs,quizTopic),100);}} style={{padding:'13px 0',borderRadius:16,fontSize:14,background:'rgba(255,255,255,.08)',border:'1px solid rgba(255,255,255,.1)',color:'rgba(255,255,255,.7)',cursor:'pointer',fontWeight:600,fontFamily:'inherit',display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>\n              <IRefresh size={16}/> Riprova\n            </button>\n          </div>\n        </div>\n      </div>\n    );\n  }\n\n  // ── Quiz Screen ───────────────────────────────────────────────────────────\n  if(quiz){\n    const cur=quizQs[quizIdx];\n    const curAnswer=quizAnswers[quizIdx];\n    const isAnswered=curAnswer!==null&&curAnswer!==undefined;\n    const isCorrect=isAnswered&&curAnswer===cur.ans;\n    const totalAnswered=quizAnswers.filter(a=>a!==null&&a!==undefined).length;\n    const allAnswered=quizAnswers.every(a=>a!==null&&a!==undefined);\n    const progress=totalAnswered/quizQs.length;\n\n    const goTo=(idx)=>{\n      if(idx<0||idx>=quizQs.length)return;\n      setQuizIdx(idx);setQuiz(quizQs[idx]);setSelected(null);\n      if(timerOn&&quizAnswers[idx]===null)setTimer(quizQs[idx].time||45);\n    };\n    const submitCur=()=>{\n      if(selected===null)return;\n      const na=[...quizAnswers];na[quizIdx]=selected;setQuizAnswers(na);\n      if(selected===cur.ans)setStreak(s=>s+1);else setStreak(0);\n      setSelected(null);\n    };\n    const finishQuiz=()=>{\n      const correct=quizAnswers.filter((a,i)=>a===quizQs[i].ans).length;\n      const pct=Math.round(correct/quizQs.length*100);\n      const xpEarned=correct*20;const coinsEarned=correct*10;\n      setStats(s=>({...s,quizzes:s.quizzes+quizQs.length,correct:s.correct+correct,xp:s.xp+xpEarned+(pct>=60?200:0),coins:s.coins+coinsEarned+(pct>=60?100:0),bestStreak:Math.max(s.bestStreak,streak)}));\n      if(pct>=60&&!quizTopic){setCompleted(p=>[...new Set([...p,activeLesson])]);setActiveLesson(Math.min(activeLesson+1,LESSONS.length));}\n      setQuizResults({total:quizQs.length,correct,pct,xpEarned:xpEarned+(pct>=60?200:0),coinsEarned:coinsEarned+(pct>=60?100:0)});\n    };\n\n    return(\n      <div style={{height:'100vh',display:'flex',flexDirection:'column',background:'#f8fafc'}}>\n        {/* Header */}\n        <div style={{background:'#fff',borderBottom:'1px solid var(--border)',flexShrink:0}}>\n          <div style={{padding:'10px 16px',display:'flex',alignItems:'center',justifyContent:'space-between',maxWidth:600,margin:'0 auto',width:'100%'}}>\n            <button onClick={exitQuiz} style={{width:36,height:36,borderRadius:12,background:'#f1f5f9',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--ink-3)'}}><IX size={18}/></button>\n            <div style={{display:'flex',alignItems:'center',gap:10}}>\n              {streak>1&&<div style={{background:'#fef3c7',color:'#d97706',padding:'4px 10px',borderRadius:99,fontSize:12,fontWeight:700}}>🔥 {streak}</div>}\n              {timerOn&&timer!==null&&!isAnswered&&<div style={{background:timer<=10?'#fef2f2':'#f1f5f9',color:timer<=10?'#dc2626':'#64748b',padding:'4px 10px',borderRadius:99,fontSize:12,fontWeight:700}}>{timer}s</div>}\n              <button onClick={()=>setShowCalc(true)} style={{width:36,height:36,borderRadius:12,background:'#fffbeb',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:'#d97706'}}><ICalc size={17}/></button>\n              <button onClick={()=>setShowQuizAI(true)} style={{width:36,height:36,borderRadius:12,background:'#ecfdf5',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:'#059669'}}><ISpark size={17}/></button>\n            </div>\n          </div>\n          {/* Progress */}\n          <div style={{height:3,background:'#f1f5f9'}}>\n            <div style={{height:'100%',background:'linear-gradient(90deg,#059669,#0d9488)',borderRadius:1.5,transition:'width .4s ease',width:(progress*100)+\"%\"}}/>\n          </div>\n        </div>\n\n        {/* Dot navigator */}\n        <div style={{background:'#fff',borderBottom:'1px solid var(--border)',padding:'10px 16px',flexShrink:0}}>\n          <div style={{maxWidth:600,margin:'0 auto',display:'flex',gap:6,overflowX:'auto',WebkitOverflowScrolling:'touch'}}>\n            {quizQs.map((_,i)=>{\n              const a=quizAnswers[i];const isCur=i===quizIdx;\n              const correct=a!==null&&a!==undefined&&a===quizQs[i].ans;\n              const wrong=a!==null&&a!==undefined&&a!==quizQs[i].ans;\n              return(\n                <button key={i} onClick={()=>goTo(i)} style={{flexShrink:0,width:34,height:34,borderRadius:10,border:\"2px solid \"+(isCur?'#059669':correct?'#059669':wrong?'#ef4444':'#e2e8f0'),background:correct?'#059669':wrong?'#ef4444':isCur?'#ecfdf5':'#fff',color:correct||wrong?'#fff':isCur?'#059669':'#94a3b8',fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'inherit',transition:'all .15s'}}>\n                  {correct?'✓':wrong?'✗':i+1}\n                </button>\n              );\n            })}\n          </div>\n        </div>\n\n        {/* Question */}\n        <div style={{flex:1,overflowY:'auto',WebkitOverflowScrolling:'touch'}}>\n          <div style={{maxWidth:600,margin:'0 auto',padding:'24px 20px'}}>\n            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>\n              <span style={{fontSize:12,color:'var(--ink-4)',fontWeight:500}}>Domanda {quizIdx+1} di {quizQs.length}</span>\n              {cur.diff&&<div style={{display:'flex',gap:3}}>{[1,2,3].map(d=><div key={d} style={{width:6,height:6,borderRadius:'50%',background:d<=cur.diff?'#f59e0b':'#e2e8f0'}}/>)}</div>}\n            </div>\n\n            <h2 style={{fontSize:19,fontWeight:700,color:'var(--ink)',lineHeight:1.45,marginBottom:24,textWrap:'pretty'}}>{cur.q}</h2>\n\n            <div style={{display:'flex',flexDirection:'column',gap:10,marginBottom:20}}>\n              {cur.opts.map((opt,i)=>{\n                let cls='option-btn';\n                if(isAnswered){\n                  if(i===cur.ans)cls='option-btn correct';\n                  else if(curAnswer===i)cls='option-btn wrong';\n                  else cls='option-btn dimmed';\n                }else if(selected===i)cls='option-btn selected';\n                return(\n                  <button key={i} className={cls} disabled={isAnswered} onClick={()=>!isAnswered&&setSelected(i)}\n                    style={{padding:'14px 16px',display:'flex',alignItems:'center',gap:12}}>\n                    <div style={{width:30,height:30,borderRadius:9,display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:700,background:isAnswered&&i===cur.ans?'#059669':isAnswered&&curAnswer===i&&!isCorrect?'#ef4444':selected===i?'#059669':'#f1f5f9',color:isAnswered&&(i===cur.ans||(curAnswer===i&&!isCorrect))?'#fff':selected===i?'#fff':'#94a3b8',flexShrink:0,transition:'all .18s'}}>\n                      {String.fromCharCode(65+i)}\n                    </div>\n                    <span style={{fontSize:14,fontWeight:500,color:'var(--ink-2)',flex:1,textAlign:'left'}}>{opt}</span>\n                    {isAnswered&&i===cur.ans&&<ICheck size={16} style={{color:'#059669',flexShrink:0}}/>}\n                    {isAnswered&&curAnswer===i&&!isCorrect&&<IX size={16} style={{color:'#ef4444',flexShrink:0}}/>}\n                  </button>\n                );\n              })}\n            </div>\n\n            {/* Explanation */}\n            {isAnswered&&(\n              <div className=\"anim-up\" style={{borderRadius:16,padding:'16px',background:isCorrect?'#ecfdf5':'#fffbeb',border:\"1.5px solid \"+(isCorrect?'#a7f3d0':'#fde68a')}}>\n                <div style={{display:'flex',gap:12,alignItems:'flex-start'}}>\n                  <div style={{width:34,height:34,borderRadius:10,background:isCorrect?'#dcfce7':'#fef9c3',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><Ph name={isCorrect?'check-circle':'x-circle'} size={20} fill style={{color:isCorrect?'#16a34a':'#ca8a04'}}/></div>\n                  <div>\n                    <div style={{fontWeight:700,fontSize:14,color:isCorrect?'#065f46':'#92400e',marginBottom:4}}>{isCorrect?'Esatto!':'Non questa volta'}</div>\n                    <p style={{fontSize:13,color:'#475569',lineHeight:1.6}}>{cur.exp}</p>\n                  </div>\n                </div>\n              </div>\n            )}\n          </div>\n        </div>\n\n        {/* Bottom bar */}\n        <div style={{background:'rgba(255,255,255,.95)',backdropFilter:'blur(12px)',borderTop:'1px solid var(--border)',padding:'12px 20px',flexShrink:0}}>\n          <div style={{maxWidth:600,margin:'0 auto',display:'flex',gap:10,alignItems:'center'}}>\n            <button onClick={()=>goTo(quizIdx-1)} disabled={quizIdx===0}\n              style={{width:46,height:46,borderRadius:14,background:quizIdx>0?'#f1f5f9':'#fafafa',border:\"1.5px solid \"+(quizIdx>0?'#e2e8f0':'#f1f5f9'),cursor:quizIdx>0?'pointer':'default',display:'flex',alignItems:'center',justifyContent:'center',color:quizIdx>0?'var(--ink-2)':'#cbd5e1',transition:'all .18s'}}>\n              <IChevL/>\n            </button>\n            <div style={{flex:1}}>\n              {!isAnswered?(\n                <button onClick={submitCur} disabled={selected===null} className={selected!==null?'btn-primary':''} style={{width:'100%',padding:'14px 0',borderRadius:14,fontSize:14,fontWeight:700,fontFamily:'inherit',background:selected===null?'#f1f5f9':'',color:selected===null?'#cbd5e1':'',border:'none',cursor:selected!==null?'pointer':'default',transition:'all .18s'}}>\n                  Verifica →\n                </button>\n              ):allAnswered?(\n                <button onClick={finishQuiz} className=\"btn-primary\" style={{width:'100%',padding:'14px 0',borderRadius:14,fontSize:14,fontWeight:700,fontFamily:'inherit'}}>\n                  🌱 Vedi risultati\n                </button>\n              ):(\n                <button onClick={()=>{const next=quizAnswers.findIndex((a,i)=>i>quizIdx&&(a===null||a===undefined));const first=quizAnswers.findIndex(a=>a===null||a===undefined);goTo(next!==-1?next:first);}} className=\"btn-primary\" style={{width:'100%',padding:'14px 0',borderRadius:14,fontSize:14,fontWeight:700,fontFamily:'inherit'}}>\n                  Prossima ({totalAnswered}/{quizQs.length}) →\n                </button>\n              )}\n            </div>\n            <button onClick={()=>goTo(quizIdx+1)} disabled={quizIdx>=quizQs.length-1}\n              style={{width:46,height:46,borderRadius:14,background:quizIdx<quizQs.length-1?'#f1f5f9':'#fafafa',border:\"1.5px solid \"+(quizIdx<quizQs.length-1?'#e2e8f0':'#f1f5f9'),cursor:quizIdx<quizQs.length-1?'pointer':'default',display:'flex',alignItems:'center',justifyContent:'center',color:quizIdx<quizQs.length-1?'var(--ink-2)':'#cbd5e1',transition:'all .18s'}}>\n              <IChevR/>\n            </button>\n          </div>\n        </div>\n        {showCalc&&<Calculator onClose={()=>setShowCalc(false)}/>}\n        {showQuizAI&&<QuizAI question={quizQs&&quizQs[quizIdx]} onClose={()=>setShowQuizAI(false)}/>}\n      </div>\n    );\n  }\n\n  // ── Library topic deep dive ───────────────────────────────────────────────\n  if(topic){\n    const t=TOPICS[topic];\n    const card=t.cards[cardIdx];\n\n    return(\n      <div style={{height:'100vh',display
